# actionlint's configuration for `pnpm check:workflow-security`
# (scripts/check-workflow-security.sh, promise WS2). Each ignore says why the
# finding is safe here, or is actionlint's gap rather than the workflow's (#2116).
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # `concurrency.queue` (`queue: max` in the release workflows:
      # release.yml, wasm-release.yml and the three docker-release ones,
      # whose comments say why) is a GitHub key newer than actionlint's
      # schema. Drop this when the pinned actionlint knows it.
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/_extension-sign.yml:
    ignore:
      # SC2012 (info) on the AMO step's fallback `ls .../source-*.zip`: the
      # names are the ones the extension's own build writes, never a
      # stranger's. Ignored rather than rewritten so this change does not
      # touch the step that submits to AMO, which a person releases. The
      # ignore covers the whole file: an SC2012 elsewhere in it is hidden
      # too, until that step is rewritten with `find`.
      - "SC2012:"
