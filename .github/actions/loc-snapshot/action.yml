name: "LOC snapshot"
description: >-
  Write the lines-of-code snapshot that www's header widget shows
  (apps/www/src/lib/loc-report), from this repository's history and, when a
  token is given, paulgsc/server's. Run it after checkout and before www is
  built; the build carries whatever it wrote.

# Best-effort, and every caller says `continue-on-error: true`: a number in a
# header is not worth a failed release. When this step fails or is skipped the
# build ships the tracked placeholder and the widget stays out of the header.
#
# Needs Nix set up first (./.github/actions/nix-setup), for a Node that runs
# TypeScript. It runs in `.#extension` (Node and pnpm only), not `.#ci`, whose
# Rust, poppler and web-ext closure the Docker publish job never needed. It
# needs no `pnpm install`, which that job does not run either.
#
# Why a clone and not the API: the widget leaves lockfiles and generated files
# out of the default total, and only a diff says which files a commit touched.
#
# Both histories are cloned into $RUNNER_TEMP, outside the workspace, and the
# workspace itself is left a depth-1 checkout. Deepening it in place would put
# the whole history into the Docker build's context (`COPY . .` takes `.git`).
#
# Not for pull requests: they build www only to check it, and a fork's has no
# secrets. Callers gate on the event, and on a rollback build (an older commit
# than the history the numbers would count up to).
inputs:
  server-token:
    description: >-
      Token that can read paulgsc/server (a fine-grained PAT with Contents:
      read, repo secret LOC_SNAPSHOT_TOKEN). Empty skips the server, and the
      snapshot covers this repository alone. Not the route snapshot's
      SERVER_ROUTES_DISPATCH_TOKEN, whose reach is pinned by RS1 in CLAUDE.md.
    required: false
    default: ""
runs:
  using: composite
  steps:
    # git shows a shallow clone's oldest commit as adding every file it holds,
    # so a count over one is wrong by orders of magnitude. The script refuses
    # a shallow repository; a fetch of the one commit this job built, with no
    # depth, is a full history of it.
    - name: Fetch this repository's full history
      shell: bash
      env:
        REPO_TOKEN: ${{ github.token }}
      run: |
        dir="$RUNNER_TEMP/loc-some-ui"
        auth="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 --wrap=0)"
        echo "::add-mask::$auth"
        git init --quiet "$dir"
        git -C "$dir" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
          fetch --quiet --no-tags "https://github.com/$GITHUB_REPOSITORY.git" "$(git rev-parse HEAD)"
        git -C "$dir" update-ref --no-deref HEAD FETCH_HEAD
        echo "LOC_UI_DIR=$dir" >> "$GITHUB_ENV"

    # A token that has expired or lost its reach fails only this step: the
    # snapshot is then this repository's alone, which the script reports.
    - name: Clone the server's history
      if: inputs.server-token != ''
      continue-on-error: true
      shell: bash
      env:
        SERVER_TOKEN: ${{ inputs.server-token }}
      run: |
        auth="$(printf 'x-access-token:%s' "$SERVER_TOKEN" | base64 --wrap=0)"
        echo "::add-mask::$auth"
        git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
          clone --no-checkout --no-tags --quiet \
          https://github.com/paulgsc/server.git "$RUNNER_TEMP/loc-server"
        echo "LOC_SERVER_DIR=$RUNNER_TEMP/loc-server" >> "$GITHUB_ENV"

    - name: Write the snapshot
      shell: bash
      run: |
        args=(--repo "some-ui=$LOC_UI_DIR")
        if [ -n "${LOC_SERVER_DIR:-}" ]; then
          args+=(--repo "server=$LOC_SERVER_DIR")
        fi
        nix develop .#extension --command node --no-warnings scripts/loc-snapshot.ts "${args[@]}"
