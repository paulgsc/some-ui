name: "Nix Setup"
description: "Install Nix with flakes + DeterminateSystems magic cache. Single source of truth."
inputs:
  shell:
    description: "Which flake devShell to warm (e.g. ci, playwright, deny). Empty = no warm-up."
    required: false
    default: ""
runs:
  using: composite
  steps:
    # Determinate Nix, the installer's default since it moved past v14 (call
    # C1106); its flakes setting below is already on there.
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      with:
        determinate: true
        extra-conf: |
          experimental-features = nix-command flakes
          accept-flake-config = true
    - name: Cache Nix store
      uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      # With Determinate Nix present it tries FlakeHub Cache first, which this
      # repo has no account for: the login fails with an error annotation on
      # every job before it falls back. The GitHub Actions cache is the one used.
      with:
        use-flakehub: disabled
