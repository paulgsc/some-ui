name: "Nix Setup"
description: "Install Nix with flakes + DeterminateSystems magic cache. Single source of truth."
inputs:
  shell:
    description: "Which flake devShell to warm (e.g. ci, playwright, deny). Empty = no warm-up."
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14
      with:
        extra-conf: |
          experimental-features = nix-command flakes
          accept-flake-config = true
    - name: Cache Nix store
      uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b # v8
