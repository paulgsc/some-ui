name: "Node CI setup"
description: "Nix, the pnpm install and the affected-package build that every Node CI job in pr.yml starts from."
# pr.yml runs Node CI as four parallel jobs (node-checks, node-lint,
# node-test, node-e2e), and each needs the same tree: the dev shell, the
# installed workspace and the affected packages built. This is that tree, in
# one place, so the jobs cannot drift onto different installs or builds. The
# caller checks out first, with `fetch-depth: 2`, because the build filter
# below diffs against HEAD^1 and a local action is only on disk after
# checkout.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/nix-setup
    - uses: ./.github/actions/pnpm-cache

    - name: Install dependencies
      shell: bash
      run: nix develop .#ci --command pnpm install --frozen-lockfile --prefer-offline
      env:
        HUSKY: 0

    - uses: ./.github/actions/resume-assets-cache

    # Build only the packages that changed or whose dependents changed.
    # The ...[HEAD^1] syntax means: this package and everything that
    # depends on it, filtered to what changed since the last commit.
    #
    # crates/* are excluded explicitly (this step calls turbo directly, so
    # it does not pick up the root `pnpm build` script's filter). A PR that
    # touches a .rs file makes ...[HEAD^1] select that crate, whose `build`
    # script is `wasm-pack build --release` - a ~45s compile per crate, and
    # these jobs have no cargo-cache to make it cheaper. Nothing in the PR
    # needs the output: packages consume the wasm packages from the npm
    # registry at a pinned version, so no dependent is waiting on that dist.
    # The `rust` job in pr.yml already compiles, clippies and tests the
    # crate, and wasm-release.yml is the only flow that has to turn a crate
    # diff into an actual artifact.
    - name: Build (affected packages)
      shell: bash
      run: |
        nix develop .#ci --command pnpm turbo run build \
          --filter=...[HEAD^1] \
          --filter='!./extensions/**' \
          --filter='!./crates/*' \
          --concurrency=100%
