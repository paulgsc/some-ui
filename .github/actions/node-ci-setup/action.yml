name: "Node CI setup"
description: "Nix, the frozen pnpm install of the workspace, and optionally the affected-package build: what every Node job starts from."
# The one place a workflow installs the workspace, so no two jobs drift onto
# different flags (#1618). check:workflows fails an inline `pnpm install` in a
# workflow without a `Why not node-ci-setup:` line above its step.
#
# pr.yml's four Node jobs (node-checks, node-lint, node-test, node-e2e) take
# the default, which also builds the affected packages; they check out with
# `fetch-depth: 2`, because that build diffs against HEAD^1. Every other
# caller builds what it needs itself and passes `build: none`. The caller
# checks out first: a local action is only on disk after checkout.
inputs:
  build:
    description: "`affected` builds the packages changed since HEAD^1 and their dependents; `none` stops after the install."
    required: false
    default: affected
  resume-assets:
    description: "Restore @some-ui/resume's typst binary and fonts; only a job that builds the résumé needs them."
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: ./.github/actions/nix-setup
    - uses: ./.github/actions/pnpm-cache

    - name: Install dependencies
      shell: bash
      run: nix develop .#ci --command pnpm install --frozen-lockfile --prefer-offline
      env:
        HUSKY: 0

    - if: inputs.resume-assets == 'true'
      uses: ./.github/actions/resume-assets-cache

    # Build only the packages that changed or whose dependents changed.
    # The ...[HEAD^1] syntax means: this package and everything that
    # depends on it, filtered to what changed since the last commit.
    #
    # crates/* are excluded explicitly (this step calls turbo directly, so
    # it does not pick up the root `pnpm build` script's filter). A PR that
    # touches a .rs file makes ...[HEAD^1] select that crate, whose `build`
    # script is `wasm-pack build --release` - a ~45s compile per crate, and
    # these jobs have no cargo-cache to make it cheaper. Nothing in the PR
    # needs the output: packages consume the wasm packages from the npm
    # registry at a pinned version, so no dependent is waiting on that dist.
    # The `rust` job in pr.yml already compiles, clippies and tests the
    # crate, and wasm-release.yml is the only flow that has to turn a crate
    # diff into an actual artifact.
    - name: Build (affected packages)
      if: inputs.build == 'affected'
      shell: bash
      run: |
        nix develop .#ci --command pnpm turbo run build \
          --filter=...[HEAD^1] \
          --filter='!./extensions/**' \
          --filter='!./crates/*' \
          --concurrency=100%
