version: 2
updates:
  # npm / pnpm workspace
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Held below what typescript-eslint supports; the reason is on the
    # catalog entry in pnpm-workspace.yaml.
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.1"]
    groups:
      wasm-crates:
        patterns:
          - "@some-ui/*"
      # update-types keeps majors out of the group so they arrive as their
      # own PRs. Without it a single breaking bump makes the whole group
      # unmergeable and the routine patches riding with it stall too — see
      # #515, where typescript 5.9.3 -> 7.0.2 held up five @typescript-eslint
      # updates, and #775, where eslint-plugin-unicorn 69 -> 72 held up four.
      # Majors are not dropped, only ungrouped.
      typescript-tooling:
        patterns:
          - "typescript*"
          - "@typescript-eslint/*"
          - "tsc-*"
        update-types: ["minor", "patch"]
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
        update-types: ["minor", "patch"]
      vite:
        patterns:
          - "vite*"
          - "@vitejs/*"
  # Rust / Cargo workspace
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
  # GitHub Actions — keep action versions current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      determinate-systems:
        patterns:
          - "DeterminateSystems/*"
      actions-core:
        patterns:
          - "actions/*"
    # CS1: changesets/action's major pairs with the Changesets CLI's, so take
    # a major by hand together with the CLI's. check:workflows fails a
    # mismatched pair.
    ignore:
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]
