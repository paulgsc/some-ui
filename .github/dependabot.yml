version: 2
updates:
  # npm / pnpm workspace
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Held below what typescript-eslint supports; the reason is on the
    # catalog entry in pnpm-workspace.yaml.
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.1"]
    groups:
      wasm-crates:
        patterns:
          - "@some-ui/*"
      # update-types keeps majors out of the group so they arrive as their
      # own PRs. Without it a single breaking bump makes the whole group
      # unmergeable and the routine patches riding with it stall too — see
      # #515, where typescript 5.9.3 -> 7.0.2 held up five @typescript-eslint
      # updates, and #775, where eslint-plugin-unicorn 69 -> 72 held up four.
      # Majors are not dropped, only ungrouped.
      typescript-tooling:
        patterns:
          - "typescript*"
          - "@typescript-eslint/*"
          - "tsc-*"
        update-types: ["minor", "patch"]
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
        update-types: ["minor", "patch"]
      vite:
        patterns:
          - "vite*"
          - "@vitejs/*"
      # Every Playwright pin moves as one: @playwright/test (the e2e suites)
      # and playwright-core (packages/video-motion, which draws the
      # compositions); "playwright" is not a direct dependency today and is
      # listed so one added later joins them. A bump here is not complete
      # until two pins outside npm move with it: the render image's
      # mcr.microsoft.com/playwright:v<version>-noble digest in
      # infra/render/Dockerfile, whose Chromium headless shell home renders
      # with, and nixpkgs' playwright-driver (flake.lock, read by
      # nix/playwright), whose Chromium CI's e2e runs. Then `motion prove`
      # on home, since video-motion proves its frames byte-identical against
      # that image (#3047 is what moving one pin alone looks like).
      playwright:
        patterns:
          - "@playwright/*"
          - "playwright"
          - "playwright-core"
  # Rust / Cargo workspace
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
  # GitHub Actions — keep action versions current. Every `uses:` is pinned
  # to a commit with its release in a trailing comment (C953); Dependabot
  # moves both. `directory: "/"` reads only .github/workflows, so the
  # composite actions under .github/actions are listed too.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      determinate-systems:
        patterns:
          - "DeterminateSystems/*"
      actions-core:
        patterns:
          - "actions/*"
