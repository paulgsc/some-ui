version: 2
updates:
  # npm / pnpm workspace
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      typescript-tooling:
        patterns:
          - "typescript*"
          - "@typescript-eslint/*"
          - "tsc-*"
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
      storybook:
        patterns:
          - "@storybook/*"
          - "storybook"
      vite:
        patterns:
          - "vite*"
          - "@vitejs/*"
  # Rust / Cargo workspace
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
  # GitHub Actions — keep action versions current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      determinate-systems:
        patterns:
          - "DeterminateSystems/*"
      actions-core:
        patterns:
          - "actions/*"
