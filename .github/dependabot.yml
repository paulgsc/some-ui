version: 2
updates:
  # npm / pnpm workspace
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      wasm-crates:
        patterns:
          - "@some-ui/*"
      # update-types keeps majors out of the group so they arrive as their
      # own PRs. Without it a single breaking bump makes the whole group
      # unmergeable and the routine patches riding with it stall too — see
      # #515, where typescript 5.9.3 -> 7.0.2 held up five @typescript-eslint
      # updates, and #775, where eslint-plugin-unicorn 69 -> 72 held up four.
      # Majors are not dropped, only ungrouped.
      typescript-tooling:
        patterns:
          - "typescript*"
          - "@typescript-eslint/*"
          - "tsc-*"
        update-types: ["minor", "patch"]
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
        update-types: ["minor", "patch"]
      storybook:
        patterns:
          - "@storybook/*"
          - "storybook"
      vite:
        patterns:
          - "vite*"
          - "@vitejs/*"
  # Rust / Cargo workspace
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
  # GitHub Actions — keep action versions current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      # changesets/action v2 only runs against @changesets/cli v3 and renames
      # its inputs; its bump (#1085) broke wasm-release.yml and release.yml
      # silently for six weeks. Take the major by hand, with the CLI.
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]
    groups:
      determinate-systems:
        patterns:
          - "DeterminateSystems/*"
      actions-core:
        patterns:
          - "actions/*"
