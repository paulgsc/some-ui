name: Deny Checks
on:
  workflow_call:
    inputs:
      rust:
        description: "Run Rust deny checks"
        type: boolean
        required: false
        default: true
      node:
        description: "Run Node license checks"
        type: boolean
        required: false
        default: true
jobs:
  # cargo-deny runs from the .#deny nix shell — same binary version as local dev.
  # Advisories are continue-on-error to avoid flapping on newly published CVEs
  # that don't affect our code.
  rust-deny:
    name: Rust Deny (${{ matrix.checks }})
    if: inputs.rust
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks: [advisories, bans, licenses, sources]
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: deny-${{ matrix.checks }}
          cache-target: "false"
      - name: cargo deny check ${{ matrix.checks }}
        run: nix develop .#deny --command cargo deny check ${{ matrix.checks }}
  # Orphan dependency tracking: cargo-machete flags declared-but-unused
  # dependencies in Cargo.toml (e.g. leftovers from a deleted crate). Runs
  # from the same .#deny nix shell as cargo-deny to keep the audit toolchain
  # in one place.
  #
  # Diverging (duplicate-version) dependency tracking already lives in the
  # rust-deny "bans" check above — deny.toml sets `multiple-versions = "warn"`,
  # which surfaces duplicate crate versions across the workspace without
  # failing the build.
  #
  # A dependency that's a false positive (e.g. only used to activate a
  # feature, never referenced by name — like getrandom's wasm feature for
  # rand's wasm backend) should be added to that crate's own
  # `[package.metadata.cargo-machete] ignored = [...]`, not silenced here.
  rust-machete:
    name: Rust Orphan Deps (cargo-machete)
    if: inputs.rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: machete
          cache-target: "false"
      - name: cargo machete
        run: nix develop .#deny --command cargo machete
  # Node: license audit via pnpm licenses list.
  # We write the JSON to a temp file so we can run the audit script in the
  # same nix shell invocation as pnpm — avoids the stdin-across-subshells problem.
  node-deny:
    name: Node License Audit
    if: inputs.node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/pnpm-cache
      - name: Install dependencies
        run: |
          nix develop .#ci --command pnpm install \
            --frozen-lockfile \
            --prefer-offline
        env:
          HUSKY: 0
      - name: Audit Node licenses
        run: |
          nix develop .#ci --command bash -c '
            pnpm licenses list --json > /tmp/licenses.json

            node -e "
              const ALLOWED = new Set([
                \"MIT\", \"Apache-2.0\", \"ISC\",
                \"BSD-2-Clause\", \"BSD-3-Clause\",
                \"0BSD\", \"BlueOak-1.0.0\",
                \"MIT-0\", \"CC0-1.0\", \"Unlicense\", \"Zlib\",
              ]);
              // pnpm licenses list --json groups packages BY license, not a
              // flat package array - { <license>: Package[] }, and each
              // Package has versions (plural, array), not version.
              const data = JSON.parse(require(\"fs\").readFileSync(\"/tmp/licenses.json\", \"utf8\"));
              const isAllowed = (license) =>
                license !== \"Unknown\" &&
                license.replace(/[()]/g, \"\").split(\" AND \").every((part) =>
                  part.split(\" OR \").some((l) => ALLOWED.has(l.trim()))
                );
              const violations = [];
              for (const [license, packages] of Object.entries(data)) {
                if (isAllowed(license)) continue;
                for (const p of packages) {
                  violations.push(p.name + \"@\" + (p.versions || []).join(\",\") + \" (\" + license + \")\");
                }
              }
              if (violations.length > 0) {
                console.error(\"License violations:\");
                violations.forEach(v => console.error(\" -\", v));
                process.exit(1);
              }
              const total = Object.values(data).reduce((sum, arr) => sum + arr.length, 0);
              console.log(\"All licenses OK (\", total, \"packages)\");
            "
          '
