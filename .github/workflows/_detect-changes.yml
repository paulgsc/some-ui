name: Detect Changes
on:
  workflow_call:
    outputs:
      rust:
        description: "True if Rust sources changed"
        value: ${{ jobs.detect.outputs.rust }}
      node:
        description: "True if Node/TS/CSS sources changed"
        value: ${{ jobs.detect.outputs.node }}
      extensions:
        description: "True if extension sources changed"
        value: ${{ jobs.detect.outputs.extensions }}
      wasm:
        description: "True if wasm crate sources changed"
        value: ${{ jobs.detect.outputs.wasm }}
      ci:
        description: "True if CI config itself changed (force re-run all)"
        value: ${{ jobs.detect.outputs.ci }}
jobs:
  detect:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      node: ${{ steps.filter.outputs.node }}
      extensions: ${{ steps.filter.outputs.extensions }}
      wasm: ${{ steps.filter.outputs.wasm }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/**'
              - '!**/*.md'
            node:
              - 'packages/**/*.{ts,tsx,js,jsx,css,json}'
              - 'apps/**/*.{ts,tsx,js,jsx,css,json}'
              - 'package.json'
              # A transitive bump can break any build, Storybook's included.
              - 'pnpm-lock.yaml'
              - '.nvmrc'
              - 'tsconfig*.json'
              - 'vite.config.*'
              # Built by node-e2e for the panel-fit gate, its only CI build.
              - '.storybook/**'
              # Read by @some-ui/resume's check-claims.mjs, which fails on a
              # stale route figure; without these a README-only edit would
              # skip the build that runs it.
              - 'packages/ui/resume/**'
              - 'packages/contract-harness/README.md'
              - '!**/*.md'
            extensions:
              - 'extensions/**'
              - 'crates/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/extension.yml'
              - '.github/workflows/_extension-*.yml'
            wasm:
              - 'crates/**'
              - 'Cargo.lock'
            ci:
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'flake.nix'
              - 'nix/**'
