name: Extension Context Detection
# Detects which extensions need verification/signing based on changed paths.
#
# Strategy: scan extensions/ at runtime — no hardcoded enumeration.
# An extension is included if:
#   a) CI config or shared packages changed (force-all), OR
#   b) any file under extensions/<name>/ appears in the git diff.
#
# Adding a new extension requires no CI changes — drop a directory under
# extensions/ and it is automatically discovered.
#
# Edge cases:
#   - Initial push (before = 0000…): FORCE_ALL=1, all extensions included.
#   - workflow_dispatch: FORCE_ALL=1.
#   - PR: uses github.event.pull_request.base.sha vs github.sha.
#   - push: uses github.event.before vs github.sha.
on:
  workflow_call:
    outputs:
      matrix:
        value: ${{ jobs.detect.outputs.matrix }}
      has_changes:
        value: ${{ jobs.detect.outputs.has_changes }}
jobs:
  detect:
    name: Detect Changed Extensions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has_changes: ${{ steps.build-matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Need enough history to diff against base; 0 = full clone.
          # A depth of 2 is sufficient for push events (before→sha).
          # PRs need the base ref fetched — fetch-depth 0 is safest.
          fetch-depth: 0
      - name: Detect force-all triggers (shared / CI changes)
        id: force
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - 'packages/**'
              - 'pnpm-lock.yaml'
            ci:
              - '.github/workflows/**'
              - '.github/actions/**'
      - name: Build extension matrix
        id: build-matrix
        env:
          SHARED: ${{ steps.force.outputs.shared }}
          CI_CHANGED: ${{ steps.force.outputs.ci }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # ── Determine base ref for diffing ─────────────────────────────
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
          else
            BASE="$BEFORE"
          fi

          # Null SHA = initial push or workflow_dispatch — force all
          NULL_SHA="0000000000000000000000000000000000000000"
          FORCE_ALL="false"
          if [ "$SHARED" = "true" ] || [ "$CI_CHANGED" = "true" ]; then
            FORCE_ALL="true"
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            FORCE_ALL="true"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "$NULL_SHA" ]; then
            FORCE_ALL="true"
          fi

          # ── Discover extensions from filesystem ────────────────────────
          # Each immediate subdirectory of extensions/ is an extension.
          INCLUDE="[]"
          for ext_path in extensions/*/; do
            [ -d "$ext_path" ] || continue
            name=$(basename "$ext_path")

            if [ "$FORCE_ALL" = "true" ]; then
              CHANGED="true"
            else
              # Did any file under this extension change?
              COUNT=$(git diff --name-only "$BASE" "$SHA" \
                -- "$ext_path" 2>/dev/null | wc -l | tr -d ' ')
              if [ "$COUNT" -gt 0 ]; then
                CHANGED="true"
              else
                CHANGED="false"
              fi
            fi

            if [ "$CHANGED" = "true" ]; then
              PKG_NAME=$(jq -r '.name' "${ext_path}package.json" 2>/dev/null || echo "$name")
              INCLUDE=$(echo "$INCLUDE" | jq \
                --arg n "$name" \
                --arg p "$ext_path" \
                --arg pkg "$PKG_NAME" \
                 '. + [{"extension_name": $n, "extension_path": $p, "package_name": $pkg}]')
            fi
          done

          # Strip trailing slash from paths (ls -d includes it)
          INCLUDE=$(echo "$INCLUDE" | jq '[.[] | .extension_path |= rtrimstr("/")]')

          MATRIX=$(jq -cn --argjson inc "$INCLUDE" '{"include": $inc}')
          COUNT=$(echo "$INCLUDE" | jq 'length')

          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

          # Debug summary
          echo ""
          echo "FORCE_ALL: $FORCE_ALL"
          echo "Extensions included ($COUNT):"
          echo "$INCLUDE" | jq -r '.[].extension_name' | sed 's/^/  - /'
