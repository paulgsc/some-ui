name: Extension Context Detection
# Detects which extensions need verification/signing based on changed paths.
#
# Strategy: scan extensions/ at runtime — no hardcoded enumeration.
# An extension is included if:
#   a) CI config changed (force-all), OR
#   b) a workspace package that extensions transitively depend on changed (force-all), OR
#   c) any file under extensions/<name>/ appears in the git diff, OR
#   d) a crate in crates/ that the extension lists as a workspace dependency changed.
#
# Rule (b) is enforced by a Node.js graph-walk of package.json files — not a static
# path pattern — so it automatically tracks the real dep graph as it evolves.
# No pnpm install is needed; Node.js is always present on ubuntu-latest.
#
# Rule (d) ensures that changes to wasm crates (e.g. crates/polyhedron) trigger
# verification for the extensions that depend on them (e.g. some-conveyor).
#
# Adding a new extension requires no CI changes — drop a directory under
# extensions/ and it is automatically discovered.
#
# Edge cases:
#   - Initial push (before = 0000…): FORCE_ALL=1, all extensions included.
#   - workflow_dispatch: FORCE_ALL=1.
#   - PR: uses github.event.pull_request.base.sha vs github.sha.
#   - push: uses github.event.before vs github.sha.
on:
  workflow_call:
    outputs:
      matrix:
        value: ${{ jobs.detect.outputs.matrix }}
      has_changes:
        value: ${{ jobs.detect.outputs.has_changes }}
jobs:
  detect:
    name: Detect Changed Extensions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has_changes: ${{ steps.build-matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Need enough history to diff against base; 0 = full clone.
          # A depth of 2 is sufficient for push events (before→sha).
          # PRs need the base ref fetched — fetch-depth 0 is safest.
          fetch-depth: 0

      - name: Detect force-all triggers (CI config changes)
        id: force
        uses: dorny/paths-filter@v4
        with:
          filters: |
            crates:
              - 'crates/**'
            ci:
              - '.github/workflows/**'
              - '.github/actions/**'

      - name: Resolve changed shared extension deps
        id: shared-deps
        # Walk the workspace dependency graph (via package.json files only —
        # no pnpm install required) and set shared=true if any changed file
        # lives under a package that extensions transitively depend on.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          node - <<'SCRIPT'
          const fs   = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          const root      = process.cwd();
          const eventName = process.env.EVENT_NAME;
          const sha       = process.env.SHA;
          const base      = eventName === 'pull_request'
            ? process.env.PR_BASE
            : process.env.BEFORE;
          const NULL_SHA  = '0000000000000000000000000000000000000000';

          function writeOutput(value) {
            const line = `shared=${value}\n`;
            process.stdout.write(line);
            const f = process.env.GITHUB_OUTPUT;
            if (f) fs.appendFileSync(f, line);
          }

          // Can't diff on initial push — build-matrix null-SHA guard handles it.
          if (!base || base === NULL_SHA) {
            writeOutput('false');
            process.exit(0);
          }

          // ── 1. Build workspace package name → relative path map ──────────
          // Scan the top-level directories that pnpm-workspace.yaml covers.
          const workspaceMap = {};  // { "@some-ui/styles": "packages/some-styles" }

          function scanPackageDir(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;
              const pkgJson = path.join(dir, entry.name, 'package.json');
              if (!fs.existsSync(pkgJson)) continue;
              try {
                const pkg = JSON.parse(fs.readFileSync(pkgJson, 'utf8'));
                if (pkg.name) workspaceMap[pkg.name] = path.join(dir, entry.name);
              } catch {}
            }
          }

          scanPackageDir('packages');
          scanPackageDir('packages/ui');   // packages/ui/* pattern
          scanPackageDir('extensions');
          scanPackageDir('apps');

          // ── 2. Compute transitive non-extension workspace deps ────────────
          // Starting from every directory under extensions/, walk dependencies
          // and collect all workspace package paths that are NOT extensions themselves.
          const visited    = new Set();
          const extDepPaths = new Set();

          function walkDeps(relPath) {
            if (visited.has(relPath)) return;
            visited.add(relPath);

            const pkgJsonPath = path.join(root, relPath, 'package.json');
            if (!fs.existsSync(pkgJsonPath)) return;

            let pkg;
            try { pkg = JSON.parse(fs.readFileSync(pkgJsonPath, 'utf8')); }
            catch { return; }

            const allDeps = Object.assign(
              {},
              pkg.dependencies,
              pkg.devDependencies,
              pkg.peerDependencies,
            );

            for (const name of Object.keys(allDeps)) {
              const depPath = workspaceMap[name];
              if (!depPath) continue;                        // not a workspace package
              if (depPath.startsWith('extensions/')) continue; // skip sibling extensions
              extDepPaths.add(depPath);
              walkDeps(depPath);                             // recurse for transitive deps
            }
          }

          const extDirs = fs.readdirSync('extensions', { withFileTypes: true })
            .filter(e => e.isDirectory())
            .map(e => path.join('extensions', e.name));

          for (const d of extDirs) walkDeps(d);

          // ── 3. Get changed files ──────────────────────────────────────────
          let changedFiles = [];
          try {
            changedFiles = execSync(`git diff --name-only ${base} ${sha}`, { encoding: 'utf8' })
              .trim().split('\n').filter(Boolean);
          } catch {}

          // ── 4. Check intersection ─────────────────────────────────────────
          let shared = false;
          const hits = [];
          for (const file of changedFiles) {
            for (const depPath of extDepPaths) {
              if (file === depPath || file.startsWith(depPath + '/')) {
                shared = true;
                hits.push(`  ${file}  (workspace dep: ${depPath})`);
                break;
              }
            }
          }

          // ── Debug output ──────────────────────────────────────────────────
          const depList = [...extDepPaths].sort().map(p => '  ' + p).join('\n');
          console.log(`Extension transitive workspace deps:\n${depList || '  (none)'}`);
          if (shared) {
            console.log(`Changed files touching extension deps:\n${hits.join('\n')}`);
          } else {
            console.log('No extension workspace deps changed.');
          }

          writeOutput(shared);
          SCRIPT

      - name: Build extension matrix
        id: build-matrix
        env:
          SHARED: ${{ steps.shared-deps.outputs.shared }}
          CRATES_CHANGED: ${{ steps.force.outputs.crates }}
          CI_CHANGED: ${{ steps.force.outputs.ci }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # ── Determine base ref for diffing ─────────────────────────────
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
          else
            BASE="$BEFORE"
          fi

          # Null SHA = initial push or workflow_dispatch — force all
          NULL_SHA="0000000000000000000000000000000000000000"
          FORCE_ALL="false"
          if [ "$SHARED" = "true" ] || [ "$CI_CHANGED" = "true" ]; then
            FORCE_ALL="true"
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            FORCE_ALL="true"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "$NULL_SHA" ]; then
            FORCE_ALL="true"
          fi

          # ── Detect which crates changed (for per-extension dep matching) ──
          CHANGED_CRATE_NAMES=""
          if [ "$CRATES_CHANGED" = "true" ] && [ "$FORCE_ALL" = "false" ] \
             && [ -n "$BASE" ] && [ "$BASE" != "$NULL_SHA" ]; then
            CHANGED_CRATE_NAMES=$(
              git diff --name-only "$BASE" "$SHA" -- 'crates/' 2>/dev/null \
                | grep '^crates/' \
                | awk -F/ '{print $2}' \
                | sort -u
            )
          fi

          # ── Discover extensions from filesystem ────────────────────────
          # Each immediate subdirectory of extensions/ is an extension.
          INCLUDE="[]"
          for ext_path in extensions/*/; do
            [ -d "$ext_path" ] || continue
            name=$(basename "$ext_path")

            CHANGED="false"

            if [ "$FORCE_ALL" = "true" ]; then
              CHANGED="true"
            else
              # Did any file under this extension change directly?
              COUNT=$(git diff --name-only "$BASE" "$SHA" \
                -- "$ext_path" 2>/dev/null | wc -l | tr -d ' ')
              if [ "$COUNT" -gt 0 ]; then
                CHANGED="true"
              fi

              # Did any workspace crate this extension depends on change?
              # Only do this check if crates changed and the extension wasn't
              # already marked changed, to avoid redundant jq calls.
              if [ "$CHANGED" = "false" ] && [ -n "$CHANGED_CRATE_NAMES" ]; then
                PKG_JSON="${ext_path}package.json"
                if [ -f "$PKG_JSON" ]; then
                  for crate_name in $CHANGED_CRATE_NAMES; do
                    # Check both bare name and @scope/name variants
                    if jq -e \
                      --arg n "$crate_name" \
                      '(.dependencies // {}) | has($n)' \
                      "$PKG_JSON" > /dev/null 2>&1; then
                      CHANGED="true"
                      echo "  → $name includes changed crate dep: $crate_name"
                      break
                    fi
                  done
                fi
              fi
            fi

            if [ "$CHANGED" = "true" ]; then
              PKG_NAME=$(jq -r '.name' "${ext_path}package.json" 2>/dev/null || echo "$name")
              INCLUDE=$(echo "$INCLUDE" | jq \
                --arg n "$name" \
                --arg p "$ext_path" \
                --arg pkg "$PKG_NAME" \
                 '. + [{"extension_name": $n, "extension_path": $p, "package_name": $pkg}]')
            fi
          done

          # Strip trailing slash from paths (ls -d includes it)
          INCLUDE=$(echo "$INCLUDE" | jq '[.[] | .extension_path |= rtrimstr("/")]')

          MATRIX=$(jq -cn --argjson inc "$INCLUDE" '{"include": $inc}')
          COUNT=$(echo "$INCLUDE" | jq 'length')

          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

          # Debug summary
          echo ""
          echo "FORCE_ALL: $FORCE_ALL"
          echo "Changed crates: ${CHANGED_CRATE_NAMES:-none}"
          echo "Extensions included ($COUNT):"
          echo "$INCLUDE" | jq -r '.[].extension_name' | sed 's/^/  - /'
