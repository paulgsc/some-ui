name: Firefox Signing
# Signs each changed extension and uploads the .xpi artifact.
#
# Workspace packages (packages/*/dist) are consumed from the workspace-dist
# artifact produced by the build-workspace job in extension.yml.
# This job does NOT rebuild shared packages — only the extension itself.
on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
    secrets:
      AMO_JWT_ISSUER:
        required: true
      AMO_JWT_SECRET:
        required: true
jobs:
  sign:
    name: Sign ${{ matrix.extension_name }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/pnpm-cache
        with:
          shell: ci

      - name: Install dependencies
        run: nix develop .#ci --command pnpm install --frozen-lockfile --prefer-offline
        env:
          HUSKY: 0

      # Restore pre-built workspace packages produced by build-workspace.
      - name: Download workspace dist artifact
        uses: actions/download-artifact@v4
        with:
          name: workspace-dist
          path: packages

      # Build the extension itself — workspace deps already present from artifact.
      - name: Build release artifact
        run: nix develop .#ci --command pnpm --filter "${{ matrix.extension_name }}" build

      - name: Submit to AMO
        run: |
          nix develop .#ci --command web-ext sign \
            --source-dir "${{ matrix.extension_path }}/dist" \
            --channel unlisted \
            --api-key "${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret "${{ secrets.AMO_JWT_SECRET }}" \
            --artifacts-dir artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: signed-${{ matrix.extension_name }}
          path: artifacts/*.xpi
          if-no-files-found: error
          retention-days: 30
