name: Extension Verification
on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
jobs:
  verify:
    name: Verify ${{ matrix.extension_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/pnpm-cache
        with:
          shell: ci
      - name: Install dependencies
        run: nix develop .#ci --command pnpm install --frozen-lockfile --prefer-offline
        env:
          HUSKY: 0
      - name: Typecheck
        run: nix develop .#ci --command pnpm --filter "${{ matrix.extension_name }}" typecheck
      - name: Lint
        run: nix develop .#ci --command pnpm --filter "${{ matrix.extension_name }}" lint
      - name: Test
        run: nix develop .#ci --command pnpm --filter "${{ matrix.extension_name }}" test
      - name: Build
        run: nix develop .#ci --command pnpm --filter "${{ matrix.extension_name }}" build
      - name: web-ext lint
        run: |
          nix develop .#ci --command web-ext lint \
            --source-dir "${{ matrix.extension_path }}/dist" \
            --self-hosted \
            --warnings-as-errors
