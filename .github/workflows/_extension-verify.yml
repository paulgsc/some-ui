name: Extension Verification
# Verifies each changed extension: typecheck, lint, performance budgets, test,
# build, web-ext lint.
#
# Workspace packages (packages/*/dist) are consumed from the artifact produced
# by the build-workspace job in extension.yml. This job does NOT rebuild shared
# packages — only the extension itself.
#
# Wasm is not among them: extensions depend on the published npm packages
# (e.g. "@some-ui/polyhedron": "0.0.4"), so it arrives via pnpm install like
# any other registry dependency. Nothing in extension CI runs wasm-pack.
#
# Forbidden-dep check: extensions must not list React/preact/lucide-react or
# any packages/ui/* package as a runtime dependency. All deps bundled by Vite
# must appear in devDependencies so the distinction is semantically accurate and
# so the workspace build can be kept lean (packages/ui/** are never pulled in).
on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
jobs:
  verify:
    name: Verify ${{ matrix.extension_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/pnpm-cache
      - name: Install dependencies
        run: nix develop .#ci --command pnpm install --frozen-lockfile --prefer-offline
        env:
          HUSKY: 0
      # ── Forbidden runtime dependency check ─────────────────────────────
      # Extensions must not depend at runtime on:
      #   • packages/ui/* component libraries (React-based, DOM-bloating)
      #   • React/preact/lucide-react framework packages
      # These should be devDependencies (build-time only) or removed entirely.
      - name: Check for forbidden runtime dependencies
        run: |
          PKG_JSON="${{ matrix.extension_path }}/package.json"

          # Collect names of all packages/ui/* workspace packages
          UI_PKG_NAMES=$(
            for f in packages/ui/*/package.json; do
              [ -f "$f" ] && jq -r '.name // empty' "$f" 2>/dev/null
            done
          )

          # Runtime dependencies declared by this extension
          EXT_DEPS=$(jq -r '(.dependencies // {}) | keys[]' "$PKG_JSON" 2>/dev/null || true)

          # Framework/ESM packages that must never be runtime deps in extensions
          BANNED="react react-dom preact lucide-react"

          FAILED=false
          for dep in $EXT_DEPS; do
            for ui_pkg in $UI_PKG_NAMES; do
              if [ "$dep" = "$ui_pkg" ]; then
                echo "❌ ${{ matrix.extension_name }}: forbidden runtime dep '$dep' (packages/ui package — move to devDependencies)"
                FAILED=true
              fi
            done
            for banned in $BANNED; do
              if [ "$dep" = "$banned" ]; then
                echo "❌ ${{ matrix.extension_name }}: forbidden runtime dep '$dep' (framework/ESM — move to devDependencies)"
                FAILED=true
              fi
            done
          done

          if [ "$FAILED" = "true" ]; then
            echo ""
            echo "Extensions bundle all code via Vite — framework packages belong in"
            echo "devDependencies (build-time), not dependencies (runtime)."
            exit 1
          fi
          echo "✅ No forbidden runtime dependencies."
      # Restore pre-built workspace packages so the extension build doesn't
      # need to rebuild them. Produced by the build-workspace job.
      - name: Download workspace package dist
        uses: actions/download-artifact@v8
        with:
          name: workspace-packages-dist
          path: packages
      - name: Typecheck
        run: nix develop .#ci --command pnpm --filter "${{ matrix.package_name }}" typecheck
      - name: Lint
        run: nix develop .#ci --command pnpm --filter "${{ matrix.package_name }}" lint
      # ── Admission gate: the browser-unresponsive guard ─────────────────
      #
      # Blocks the one class of defect an extension must never ship: code we
      # own at compile time that drives the *browser's own* "Page
      # unresponsive" kill switch. A content script runs against <all_urls>,
      # so the pages it must survive are ones this repo never chose.
      #
      # The gate is a resource-admission rule over the SHIPPED ARTIFACT, not
      # a review of today's source. It reads dist/, classifies every
      # page-affecting browser primitive against a fixed alphabet, and
      # requires each to be declared admissible in effect-ledger.ts. An
      # effect with no ledger entry fails closed; a declared cost or
      # retention class that scales with page size is never admitted. That
      # is what makes it survive an arbitrary diff — an unbounded walk added
      # to a new module, to an imported workspace package, or to
      # public/prepaint-start.js still puts its primitives in the bundle.
      #
      # Build immediately before analysing, unconditionally and ignoring the
      # ext-build cache. The cache key hashes the extension tree, common/
      # and the lockfile, but NOT packages/** — so a change to an imported
      # workspace package restores a stale dist, and the gate would then
      # certify an artifact that is not the one shipping. Provenance of the
      # analysed bytes is part of the claim, so this rebuild is not
      # redundant with the cached Build step further down.
      - name: Build artifact for admission analysis
        run: nix develop .#ci --command pnpm --filter "${{ matrix.package_name }}" build:chromium

      # No --if-present here. An extension listed in PROTECTED below must
      # define test:budgets; deleting the script is otherwise a silent way
      # to opt out of the gate, which is the same falsely-green admission
      # the gate exists to prevent.
      - name: Performance budgets (browser-unresponsive guard)
        run: |
          PROTECTED="some-filter"
          NAME="${{ matrix.extension_name }}"

          nix develop .#ci --command pnpm exec stylelint \
            "${{ matrix.extension_path }}/public/*.css" --allow-empty-input

          HAS=$(nix develop .#ci --command node -e \
            "const p=require('./${{ matrix.extension_path }}/package.json');process.stdout.write(p.scripts&&p.scripts['test:budgets']?'yes':'no')")

          for protected_ext in $PROTECTED; do
            if [ "$NAME" = "$protected_ext" ] && [ "$HAS" != "yes" ]; then
              echo "::error::$NAME is a protected extension but defines no test:budgets script."
              echo "The admission gate cannot be removed by deleting its entry point."
              exit 1
            fi
          done

          if [ "$HAS" = "yes" ]; then
            nix develop .#ci --command pnpm --filter "${{ matrix.package_name }}" test:budgets
          else
            echo "$NAME defines no test:budgets and is not protected — skipping."
          fi

      - name: Test
        run: nix develop .#ci-playwright --command pnpm --filter "${{ matrix.package_name }}" test
      # Restore cached extension build output. Key covers the extension source
      # tree, extensions/common (shared runtime util several extensions import
      # — a source-only change there doesn't touch extension_path/** or bump
      # pnpm-lock.yaml, so it must be hashed explicitly or a stale dist gets
      # restored and skips Build below), and the pnpm lockfile.
      - name: Restore extension build cache
        id: ext-cache
        uses: actions/cache@v6
        with:
          path: ${{ matrix.extension_path }}/dist
          key: ext-build-${{ matrix.extension_name }}-${{ runner.os }}-${{ hashFiles(format('{0}/**', matrix.extension_path), 'extensions/common/**', 'pnpm-lock.yaml') }}
      # Build the extension itself — workspace deps already present from artifact.
      - name: Build
        if: steps.ext-cache.outputs.cache-hit != 'true'
        run: nix develop .#ci --command pnpm --filter "${{ matrix.package_name }}" build
      # ── Self-contained entry check ─────────────────────────────────────
      # Content scripts, MV2 background scripts, and non-module MV3 service
      # workers run as classic scripts and cannot use ESM import/export. Rollup
      # emits a shared chunk whenever a module is imported by 2+ entries (e.g. a
      # util hoisted into a shared package), which silently breaks those entries
      # at load with "Cannot use import statement outside a module". This check
      # fails on any NEW such violation; known debt is tracked in
      # extensions/scripts/self-contained-baseline.json and ratchets down only.
      - name: Assert classic entries are self-contained
        run: nix develop .#ci --command node extensions/scripts/assert-self-contained.mjs "${{ matrix.extension_path }}/dist"
      - name: web-ext lint
        run: |
          nix develop .#ci --command web-ext lint \
            --source-dir "${{ matrix.extension_path }}/dist" \
            --self-hosted \
            --warnings-as-errors
