name: Node CI
on:
  workflow_call:
jobs:
  node-ci:
    name: Node (typecheck · lint · prettier · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/pnpm-cache
        with:
          shell: ci
      - name: Install dependencies
        run: |
          nix develop .#ci --command pnpm install \
            --frozen-lockfile \
            --prefer-offline
        env:
          HUSKY: 0
      - name: Build workspace packages
        run: nix develop .#ci --command pnpm build
      - name: Typecheck
        run: nix develop .#ci --command pnpm typecheck
      - name: ESLint
        run: nix develop .#ci --command pnpm lint:js
      - name: Prettier
        run: nix develop .#ci --command pnpm prettier
      - name: Tests
        run: nix develop .#ci --command pnpm test
