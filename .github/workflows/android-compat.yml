name: Android Compat

# Stamps a release's Android compatibility (epic COMPAT): the APK built from
# a ref, run on slowed emulators across the API levels it supports, through
# the launch test and the storm scenario (apps/mobile/compat/storm.sh), and
# tabulated into a stamp the release can cite. apps/mobile/README.md,
# "Stamping a release's Android compatibility", says what it proves and what
# it cannot.
#
# Dispatch only, by the owner, when a release wants a stamp (owner,
# 2026-11-17: "workflows that exist and I reach for to basically stamp a
# release compat"). No push, pull request or schedule trigger: emulators are
# slow and costly, and nothing waits on this. It is not in pr.yml and CI Gate
# does not need it.
#
# No environment approval and no signing secrets: the APK is signed with a
# key made on the runner for this run, so it installs on a fresh emulator
# and nowhere else that matters (the phone refuses it as an update of the
# real one, which is the point).
on:
  # TEMPORARY, removed before review: one run from this branch, which cannot
  # be dispatched until the file is on main.
  push:
    branches: [claude/android-compat-stamp]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build and test."
        required: false
        default: main
      api_levels:
        description: "Android API levels, comma-separated. Default 34 and 36: the images whose stock WebView (113, 133) runs the bundle. 24, 28 and 31 (minSdk 24, in apps/mobile/android/variables.gradle) may be added; their stock WebView is older than the bundle needs, and their rows say so."
        required: false
        default: "34,36"
      cpu_percent:
        description: "Cap each emulator's one core at this share of a host core (0 for no cap)."
        required: false
        default: "60"

permissions:
  contents: read

concurrency:
  group: android-compat-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build the APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      levels: ${{ steps.levels.outputs.levels }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: levels
        env:
          LEVELS: ${{ inputs.api_levels || '34,36' }}
        run: |
          json=$(echo "$LEVELS" | tr -d ' ' | tr ',' '\n' | grep -E '^[0-9]+$' | jq -R 'tonumber' | jq -sc .)
          if [ "$json" = "[]" ]; then
            echo "::error::api_levels has no level: $LEVELS"
            exit 1
          fi
          echo "levels=$json" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/node-ci-setup
        with:
          build: none

      - name: Build www for the device and sync it into Android
        run: nix develop .#ci --command pnpm --filter @some-ui/mobile bundle
        env:
          NODE_ENV: production

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # A key for this run only (build.gradle reads SOME_UI_KEYSTORE): an
      # unsigned release APK does not install, and the real key is the
      # phone's, kept behind mobile-release.
      - name: Make a throwaway signing key
        run: |
          keystore="$RUNNER_TEMP/compat.keystore"
          keytool -genkeypair -keystore "$keystore" -storetype PKCS12 \
            -storepass compat-only -keypass compat-only -alias some-ui \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=android-compat"
          echo "SOME_UI_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      # The release build (R8, as the phone gets it) with x86_64 added for the
      # emulator, as mobile-apk.yml's launch test builds it; and the debug
      # build, whose page the storm scenario reads over DevTools.
      - name: Build the release and debug APKs
        working-directory: apps/mobile/android
        env:
          SOME_UI_KEYSTORE_PASSWORD: compat-only
          SOME_UI_VERSION_CODE: ${{ github.run_number }}
          SOME_UI_VERSION_NAME: 0.0.${{ github.run_number }}+compat.${{ steps.sha.outputs.sha }}
          SOME_UI_EXTRA_ABI: x86_64
        run: |
          ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace
          mkdir ../../../compat-apk
          cp app/build/outputs/apk/release/app-release.apk ../../../compat-apk/launch.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../../../compat-apk/debug.apk
      # Retention: read by this run's level jobs only. "Re-run failed jobs"
      # more than a day later finds no APK; dispatch the workflow again.
      - name: Upload the APKs
        uses: actions/upload-artifact@v7
        with:
          name: android-compat-apk-${{ github.run_id }}
          path: compat-apk
          if-no-files-found: error
          retention-days: 1

  level:
    name: API ${{ matrix.api }}
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(needs.apk.outputs.levels) }}
    steps:
      # The harness from this workflow's own commit, so a stamp of an older
      # ref still runs today's checks.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            apps/mobile/launch
            apps/mobile/compat
      - uses: actions/download-artifact@v8
        with:
          name: android-compat-apk-${{ github.run_id }}
          path: compat-apk
      - name: Install cpulimit
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cpulimit
      # The hosted runner has /dev/kvm but not the permission to use it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Slowed: one core, little memory, and a 3G link (netdelay umts,
      # netspeed hsdpa); run-level.sh caps the core's CPU.
      - name: Run the level
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CPU_PERCENT: ${{ inputs.cpu_percent || '60' }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          cores: 1
          ram-size: 1536M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -netdelay umts -netspeed hsdpa
          script: bash apps/mobile/compat/run-level.sh ${{ matrix.api }} compat-apk compat-out "$CPU_PERCENT"
      # The level's row of the stamp, written even when the emulator never
      # booted, so the table shows it.
      - name: Note a level that never ran
        if: always()
        run: |
          mkdir -p compat-out
          [ -f compat-out/row.json ] || echo '{"api":${{ matrix.api }},"webview":"unknown","launch":"not run","paired":"not run","storm":"not run","refresh":"not run"}' > compat-out/row.json
      # Retention: read by this run's stamp job, and by a person reading a
      # red level right after the run; a later look is a dispatch away.
      - name: Upload what the level showed
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-compat-out-${{ matrix.api }}-${{ github.run_id }}
          path: compat-out
          if-no-files-found: ignore
          retention-days: 1

  stamp:
    name: Stamp
    needs: [apk, level]
    if: always() && needs.apk.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: android-compat-out-*-${{ github.run_id }}
          path: rows
      - name: Write the stamp
        env:
          SHA: ${{ needs.apk.outputs.sha }}
          REF: ${{ inputs.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -s 'sort_by(.api)' rows/*/row.json > stamp-rows.json
          mark() { case "$1" in pass) echo "✅ pass" ;; fail) echo "❌ fail" ;; *) echo "– $1" ;; esac; }
          {
            echo "## Android compatibility: \`${SHA::7}\` ($REF)"
            echo
            echo "| API | Image's WebView | Launch | Paired (https) | Storm | Refresh |"
            echo "| --- | --- | --- | --- | --- | --- |"
            jq -r '.[] | [.api, (.webview // "unknown"), .launch, .paired, .storm, .refresh] | @tsv' stamp-rows.json |
              while IFS=$'\t' read -r api webview launch paired storm refresh; do
                echo "| $api | $webview | $(mark "$launch") | $(mark "$paired") | $(mark "$storm") | $(mark "$refresh") |"
              done
            echo
            passed=$(jq -r '[.[] | select(.launch == "pass" and .paired == "pass" and .storm == "pass" and .refresh == "pass") | .api] | join(", ")' stamp-rows.json)
            echo "For the release notes:"
            echo
            echo "> Android compatibility, \`${SHA::7}\`: launch, paired storm and refresh pass on API ${passed:-none} (slowed emulators, $(date -u +%F); [run]($RUN_URL))."
            echo
            echo "The record:"
            echo
            echo '```json'
            jq -c --arg sha "$SHA" --arg ref "$REF" --arg run "$RUN_URL" --arg day "$(date -u +%F)" \
              '{sha: $sha, ref: $ref, day: $day, run: $run, levels: .}' stamp-rows.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
