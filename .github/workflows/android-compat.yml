name: Android Compat

# Stamps a release's Android compatibility (epic COMPAT): the APK built from
# the branch or tag it is run from, run on slowed emulators across the API levels it supports, through
# the launch test and the storm scenario (apps/mobile/compat/storm.sh), and
# tabulated into a stamp the release can cite. apps/mobile/README.md,
# "Stamping a release's Android compatibility", says what it proves and what
# it cannot.
#
# Dispatch only, by the owner, when a release wants a stamp (owner,
# 2026-11-17: "workflows that exist and I reach for to basically stamp a
# release compat"). No push, pull request or schedule trigger: emulators are
# slow and costly, and nothing waits on this. It is not in pr.yml and CI Gate
# does not need it.
#
# No environment approval and no signing secrets: the APK is signed with a
# key made on the runner for this run, so it installs on a fresh emulator
# and nowhere else that matters (the phone refuses it as an update of the
# real one, which is the point).
on:
  workflow_dispatch:
    # The branch or tag to stamp is the one the workflow is run from ("Use
    # workflow from"), not an input: the job then runs only its own commit,
    # and whatever it caches stays in that ref's scope. Building another ref
    # from main would run that code in main's cache scope, which PR runs read
    # (CodeQL: cache poisoning). A bare commit, or a tag from before this
    # workflow, cannot be stamped.
    inputs:
      api_levels:
        description: "Android API levels, comma-separated. Default 34 and 36: the images whose stock WebView (113, 133) runs the bundle. 24, 28 and 31 (minSdk 24, in apps/mobile/android/variables.gradle) may be added; their stock WebView is older than the bundle needs, and their rows say so."
        required: false
        default: "34,36"
      cpu_percent:
        description: "Cap each emulator's one core at this share of a host core (0 for no cap)."
        required: false
        default: "60"
      route_only:
        description: "Run only the route scenario (#3411, NA2): home asked with Wi-Fi the default, with this app's traffic on mobile data while home answers only on Wi-Fi, and with the app kept off Wi-Fi; each as the app is and with its fix."
        required: false
        type: boolean
        default: false
      name_only:
        description: "Run only the name scenario (#3411): a name that fails its first lookup, then answers, asked again on Wi-Fi with mobile data off. Points each emulator's resolver at apps/mobile/compat/staged-dns.py."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-compat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build the APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      levels: ${{ steps.levels.outputs.levels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: levels
        env:
          LEVELS: ${{ inputs.api_levels }}
        run: |
          json=$(echo "$LEVELS" | tr -d ' ' | tr ',' '\n' | grep -E '^[0-9]+$' | jq -R 'tonumber' | jq -sc .)
          if [ "$json" = "[]" ]; then
            echo "::error::api_levels has no level: $LEVELS"
            exit 1
          fi
          echo "levels=$json" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/node-ci-setup
        with:
          build: none

      - name: Build www for the device and sync it into Android
        run: nix develop .#ci --command pnpm --filter @some-ui/mobile bundle
        env:
          NODE_ENV: production

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      # A key for this run only (build.gradle reads SOME_UI_KEYSTORE): an
      # unsigned release APK does not install, and the real key is the
      # phone's, kept behind mobile-release.
      - name: Make a throwaway signing key
        run: |
          keystore="$RUNNER_TEMP/compat.keystore"
          keytool -genkeypair -keystore "$keystore" -storetype PKCS12 \
            -storepass compat-only -keypass compat-only -alias some-ui \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=android-compat"
          echo "SOME_UI_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      # The release build (R8, as the phone gets it) with x86_64 added for the
      # emulator, as mobile-apk.yml's launch test builds it; and the debug
      # build, whose page the storm scenario reads over DevTools.
      - name: Build the release and debug APKs
        working-directory: apps/mobile/android
        env:
          SOME_UI_KEYSTORE_PASSWORD: compat-only
          SOME_UI_VERSION_CODE: ${{ github.run_number }}
          SOME_UI_VERSION_NAME: 0.0.${{ github.run_number }}+compat.${{ steps.sha.outputs.sha }}
          SOME_UI_EXTRA_ABI: x86_64
        run: |
          ./gradlew :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
          mkdir ../../../compat-apk
          cp app/build/outputs/apk/release/app-release.apk ../../../compat-apk/launch.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../../../compat-apk/debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ../../../compat-apk/tests.apk
      # Retention: read by this run's level jobs only. "Re-run failed jobs"
      # more than a day later finds no APK; dispatch the workflow again.
      - name: Upload the APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-compat-apk-${{ github.run_id }}
          path: compat-apk
          if-no-files-found: error
          retention-days: 1

  level:
    name: API ${{ matrix.api }}
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(needs.apk.outputs.levels) }}
    steps:
      # The harness, from the commit the APKs were built from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            apps/mobile/launch
            apps/mobile/compat
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-compat-apk-${{ github.run_id }}
          path: compat-apk
      - name: Install cpulimit
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cpulimit
      # The hosted runner has /dev/kvm but not the permission to use it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Home's stand-in for the name and route scenarios: a plain page, the
      # emulator's 10.0.2.2:8080.
      - name: Stand in a home
        if: inputs.name_only || inputs.route_only
        run: |
          mkdir -p "$RUNNER_TEMP/page" && echo ok > "$RUNNER_TEMP/page/index.html"
          nohup python3 -I -m http.server 8080 --directory "$RUNNER_TEMP/page" > "$RUNNER_TEMP/page.log" 2>&1 &
      # The name scenario's network (#3411): a resolver on the runner that
      # fails each staged name's first lookup and answers it after with the
      # stand-in's address. The emulator's `-dns-server` below points at it.
      - name: Stage a resolver that fails a name once
        if: inputs.name_only
        run: |
          # Port 53 without running the resolver as root, on the runner's own
          # address: systemd-resolved holds 127.0.0.53:53.
          host=$(hostname -I | awk '{print $1}')
          sudo sysctl -q -w net.ipv4.ip_unprivileged_port_start=53
          nohup python3 -I apps/mobile/compat/staged-dns.py file-host.home.test,fresh.home.test 10.0.2.2 53 8.8.8.8 "$host" > "$RUNNER_TEMP/dns.log" 2>&1 &
          sleep 1
          cat "$RUNNER_TEMP/dns.log"
          echo "STAGED_DNS=-dns-server $host" >> "$GITHUB_ENV"
      # Slowed: one core, little memory, and a 3G link (netdelay umts,
      # netspeed hsdpa); run-level.sh caps the core's CPU.
      - name: Run the level
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        # Inputs reach the script as environment, never interpolated into it.
        env:
          API: ${{ matrix.api }}
          CPU_PERCENT: ${{ inputs.cpu_percent }}
          NAME_ONLY: ${{ inputs.name_only }}
          ROUTE_ONLY: ${{ inputs.route_only }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          cores: 1
          ram-size: 1536M
          emulator-boot-timeout: 900
          # ANGLE over SwiftShader for the host's renderer: under
          # swiftshader_indirect, the emulator's process ended within 2 s of
          # the Cast wing painting its host drawings (#3613).
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim -netdelay umts -netspeed hsdpa ${{ env.STAGED_DNS }}
          script: bash apps/mobile/compat/run-level.sh "$API" compat-apk compat-out "$CPU_PERCENT"
      # The level's row of the stamp, written even when the emulator never
      # booted, so the table shows it.
      - name: Note a level that never ran
        if: always()
        env:
          API: ${{ matrix.api }}
        run: |
          mkdir -p compat-out
          [ -f compat-out/row.json ] || jq -nc --arg api "$API" \
            '{api: ($api | tonumber? // $api), webview: "unknown", launch: "not run", paired: "not run", storm: "not run", refresh: "not run", name: "not run"}' > compat-out/row.json
          [ ! -f "$RUNNER_TEMP/dns.log" ] || cp "$RUNNER_TEMP/dns.log" compat-out/staged-dns.log
      # Retention: read by this run's stamp job, and by a person reading a
      # red level right after the run; a later look is a dispatch away.
      - name: Upload what the level showed
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-compat-out-${{ matrix.api }}-${{ github.run_id }}
          path: compat-out
          if-no-files-found: ignore
          retention-days: 1

  stamp:
    name: Stamp
    needs: [apk, level]
    if: always() && needs.apk.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: android-compat-out-*-${{ github.run_id }}
          path: rows
      - name: Write the stamp
        env:
          SHA: ${{ needs.apk.outputs.sha }}
          REF: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -s 'sort_by(.api)' rows/*/row.json > stamp-rows.json
          mark() { case "$1" in pass) echo "✅ pass" ;; fail) echo "❌ fail" ;; *) echo "– $1" ;; esac; }
          {
            echo "## Android compatibility: \`${SHA::7}\` ($REF)"
            echo
            echo "| API | Image's WebView | Launch | Paired (https) | Storm | Refresh | Name or route scenario |"
            echo "| --- | --- | --- | --- | --- | --- | --- |"
            jq -r '.[] | [.api, (.webview // "unknown"), .launch, .paired, .storm, .refresh, (.name // "not run")] | @tsv' stamp-rows.json |
              while IFS=$'\t' read -r api webview launch paired storm refresh name; do
                echo "| $api | $webview | $(mark "$launch") | $(mark "$paired") | $(mark "$storm") | $(mark "$refresh") | $name |"
              done
            echo
            passed=$(jq -r '[.[] | select(.launch == "pass" and .paired == "pass" and .storm == "pass" and .refresh == "pass") | .api] | join(", ")' stamp-rows.json)
            echo "For the release notes:"
            echo
            echo "> Android compatibility, \`${SHA::7}\`: launch, paired storm and refresh pass on API ${passed:-none} (slowed emulators, $(date -u +%F); [run]($RUN_URL))."
            echo
            echo "The record:"
            echo
            echo '```json'
            jq -c --arg sha "$SHA" --arg ref "$REF" --arg run "$RUN_URL" --arg day "$(date -u +%F)" \
              '{sha: $sha, ref: $ref, day: $day, run: $run, levels: .}' stamp-rows.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
