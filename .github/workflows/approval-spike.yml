name: Approval Spike
# Temporary (epic #1615, Decision 1). Answers one question before Pages and
# the mobile APK move from a release PR to an Environment approval: when a
# newer push arrives, does job-level `concurrency` with
# `cancel-in-progress: true` cancel an older run whose job is still
# "Waiting" on the `approval-spike` environment's required reviewer? If it
# does, only the newest run can ever be approved. Runs only on this spike
# branch, holds no permissions and touches nothing; delete it (and the
# `approval-spike` environment) once the answer is recorded.
on:
  push:
    branches: [ccr-325c2503-rtgfe0]
permissions: {}
env:
  # Bumped on each spike push so every push is a real change.
  SPIKE_PUSH: "2"
jobs:
  approve:
    name: Approve
    runs-on: ubuntu-latest
    environment: approval-spike
    concurrency:
      group: approval-spike-approve
      cancel-in-progress: true
    steps:
      - name: Record the approved commit
        run: echo "Approved ${GITHUB_SHA} (spike push ${SPIKE_PUSH})"
  deploy:
    name: Deploy (simulated)
    needs: approve
    runs-on: ubuntu-latest
    concurrency:
      group: approval-spike-deploy
      cancel-in-progress: false
    steps:
      - name: Report what would ship
        run: |
          echo "Would deploy ${GITHUB_SHA} (spike push ${SPIKE_PUSH})"
          echo "Deployed \`${GITHUB_SHA}\` from spike push ${SPIKE_PUSH}" >> "$GITHUB_STEP_SUMMARY"
