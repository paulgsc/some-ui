name: Extension Release
# Publish cadence for AMO extensions that have cleared compliance (epic
# #310) and are explicitly opted in below. A person's only routine step is
# to skim one release PR and squash-merge it: the version, the changelog, and
# both AMO text fields ("Version notes" and "Notes for reviewers") arrive
# already written and already checked against the build they describe.
#
# Flow:
#   a push to main that can change the extension's build
#     -> detect: not a release commit, so release-pr
#     -> release-pr rebuilds the extension from main exactly as the sign job
#        will, and extensions/scripts/amo-release.mjs compares the build with
#        the last release AMO accepted (release/release.json at the newest
#        `suspender-ledger@<version>` tag; the bootstrap record before the
#        first tag):
#          - same content digest, or the same build as a release merged on
#            main but not yet tagged (still signing, or awaiting a
#            publish_only retry): nothing new; close any open release PR and stop. A lint, type or lockfile
#            change that leaves the bundle byte-identical opens nothing.
#          - different: write release/evidence.md (permission and content
#            script deltas, built-file changes, commits since the release)
#            and open/refresh the release PR with it.
#        The notes come from release/notes.md: the release branch's copy if it
#        is for a newer version (an agent pushed it there), else main's. They
#        are "ready" only if they name the build's content digest and an
#        allowed next version, and fit AMO's limits. Ready: the job bumps
#        package.json + manifest + CHANGELOG.md to the notes' version, rebuilds,
#        writes release.json (every dist/ file's hash and the exact AMO
#        payload), and marks the PR ready for review. Not ready: the PR stays
#        a draft whose body says what is wrong and how to fix it (the
#        /amo-release-notes skill writes the notes and pushes them to the
#        branch, which re-runs this job).
#   the PR is squash-merged
#     -> detect sees the release commit message on main: publish
#     -> build-workspace + sign rebuild that commit, and _extension-sign.yml
#        refuses unless every dist/ file matches release.json, then submits
#        the xpi, the source archive and release.json's AMO payload together.
#     -> tag marks the commit `suspender-ledger@<version>` once AMO took the
#        upload: the next release's baseline. A release commit whose sign
#        was refused (main moved under a ready PR) gets no tag, so the next
#        release PR still compares with what AMO actually has.
#
# Only release/notes.md carries over from the release branch; every other
# file there is regenerated from main on each run, so edits to them are lost.
#
# Retries: dispatch publish_only on a branch at the release commit
# (detect refuses any other commit), never on main once it has moved on.
#
# Deliberately NOT changesets: the version is the notes' decision (patch,
# minor or major, with a stated rationale), and the changelog section is the
# AMO version notes, so a changeset would be a third copy of both.
#
# Extensions still gated by epic #310 are unaffected: this workflow only
# ever acts on EXTENSION_NAME below, and extension-sign-manual.yml remains
# the manual escape hatch for them. For this extension it signs only a
# release commit, since the sign step requires a matching release record.
on:
  push:
    # The release branch is here so an agent's push of release/notes.md
    # refreshes the PR. The bot's own pushes use GITHUB_TOKEN and so trigger
    # nothing, which is what keeps this from looping.
    branches: [main, changeset-release/extension-suspender-ledger]
    paths:
      - "extensions/suspender-ledger/**"
      - "extensions/common/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/extension-release.yml"
      - ".github/workflows/_extension-sign.yml"
      - ".github/actions/extension-release-detect/**"
  workflow_dispatch:
    inputs:
      publish_only:
        description: "Sign the release commit this run is dispatched on (a branch at it, never a tag), to retry a publish that failed after the release PR merged"
        type: boolean
        default: false
env:
  EXTENSION_NAME: suspender-ledger
  RELEASE_COMMIT_MESSAGE: "chore(release): publish extension suspender-ledger"
  RELEASE_BRANCH: "changeset-release/extension-suspender-ledger"
permissions:
  contents: read
jobs:
  # ── Publish, or refresh the release PR? ─────────────────────────────────
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      release_mode: ${{ steps.detect.outputs.release_mode }}
      package_name: ${{ steps.pkg.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pkg
        run: echo "name=$(jq -r .name extensions/${{ env.EXTENSION_NAME }}/package.json)" >> "$GITHUB_OUTPUT"
      - id: detect
        uses: ./.github/actions/extension-release-detect
        with:
          event-name: ${{ github.event_name }}
          publish-only: ${{ inputs.publish_only }}
          commit-message: ${{ github.event.head_commit.message }}
          release-commit-message: ${{ env.RELEASE_COMMIT_MESSAGE }}
          head-sha: ${{ github.sha }}

  # ── Open/update the release PR ───────────────────────────────────────────
  release-pr:
    name: Open/Update Release PR
    needs: detect
    if: needs.detect.outputs.release_mode == 'release-pr'
    runs-on: ubuntu-latest
    # One refresh at a time. Each run rebuilds from main's head, so when a
    # newer run replaces a pending one nothing is lost.
    concurrency:
      group: extension-release-pr-suspender-ledger
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      EXTENSION_PATH: extensions/suspender-ledger
      PACKAGE_NAME: ${{ needs.detect.outputs.package_name }}
      # Job-wide, not only on the install: a later `pnpm` call re-runs the
      # root `prepare` script, which installs the git hooks, and the
      # pre-commit and commit-msg hooks need a pnpm that is only on PATH inside
      # `nix develop`. With HUSKY=0 husky neither installs nor runs them, so
      # create-pull-request's commit and push go through.
      HUSKY: "0"
    steps:
      # Always main, also when an agent's push to the release branch started
      # this run: the release is built from main, and only the branch's
      # release/notes.md is carried over (below).
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/pnpm-cache
      - name: Install dependencies
        run: nix develop .#ci --command pnpm install --frozen-lockfile --prefer-offline
      # The same two builds the publish path runs (build-workspace, then the
      # sign job's own extension build), so the digest compared here is the
      # one the sign job will see.
      - name: Build the extension
        run: |
          NODE_ENV=production nix develop .#ci --command pnpm build \
            --filter "...{./${EXTENSION_PATH}}" --concurrency=100%
          nix develop .#ci --command pnpm --filter "$PACKAGE_NAME" build
      - name: Read the release branch's notes
        run: |
          if git fetch --quiet origin "$RELEASE_BRANCH" 2>/dev/null &&
            git cat-file -e "FETCH_HEAD:${EXTENSION_PATH}/release/notes.md" 2>/dev/null; then
            git show "FETCH_HEAD:${EXTENSION_PATH}/release/notes.md" > "$RUNNER_TEMP/branch-notes.md"
          fi
      - name: Compare with the last release and check the notes
        id: prepare
        run: |
          nix develop .#ci --command node extensions/scripts/amo-release.mjs prepare "$EXTENSION_PATH" \
            --branch-notes "$RUNNER_TEMP/branch-notes.md" \
            --body "$RUNNER_TEMP/pr-body.md"
          if [ -f "$RUNNER_TEMP/pr-body.md" ]; then cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"; fi
      # prepare bumped the version; the record hashes the dist/ the sign job
      # will build from the merged commit, so rebuild at that version first.
      - name: Record the release build
        if: steps.prepare.outputs.ready == 'true'
        run: |
          nix develop .#ci --command pnpm --filter "$PACKAGE_NAME" build
          nix develop .#ci --command node extensions/scripts/amo-release.mjs record "$EXTENSION_PATH"
      - name: Open release PR
        id: cpr
        if: steps.prepare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ${{ env.RELEASE_BRANCH }}
          base: main
          delete-branch: true
          add-paths: |
            ${{ env.EXTENSION_PATH }}/package.json
            ${{ env.EXTENSION_PATH }}/public/manifest.firefox.json
            ${{ env.EXTENSION_PATH }}/CHANGELOG.md
            ${{ env.EXTENSION_PATH }}/release
          commit-message: ${{ env.RELEASE_COMMIT_MESSAGE }} ${{ steps.prepare.outputs.version || 'next' }}
          title: ${{ env.RELEASE_COMMIT_MESSAGE }} ${{ steps.prepare.outputs.version || 'next' }}
          body-path: ${{ runner.temp }}/pr-body.md
          # A draft cannot be merged, and a merged draft would be refused at
          # sign time anyway: its dist/ has no release record.
          draft: ${{ steps.prepare.outputs.ready == 'true' && 'false' || 'always-true' }}
      - name: Mark the PR ready for review
        if: steps.prepare.outputs.ready == 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          if [ "$(gh pr view "$PR" --json isDraft -q .isDraft)" = "true" ]; then
            gh pr ready "$PR"
          fi
      - name: Close a release PR the build no longer needs
        if: steps.prepare.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pr in $(gh pr list --head "$RELEASE_BRANCH" --state open --json number -q '.[].number'); do
            gh pr close "$pr" --delete-branch \
              --comment "The build on main is the last release, or one already merged and being submitted, so there is nothing new to release."
          done

  # ── Build workspace deps for this extension ──────────────────────────────
  build-workspace:
    name: Build Workspace Packages
    needs: detect
    if: needs.detect.outputs.release_mode == 'publish'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/pnpm-cache
      - name: Install dependencies
        run: nix develop .#ci --command pnpm install --frozen-lockfile --prefer-offline
        env:
          HUSKY: 0
      - name: Build workspace packages
        run: |
          nix develop .#ci --command pnpm build \
            --filter "...{./extensions/${{ env.EXTENSION_NAME }}}" \
            --concurrency=100%
        env:
          NODE_ENV: production
      - name: Upload workspace dist
        uses: actions/upload-artifact@v7
        with:
          name: workspace-dist
          path: packages/*/dist
          if-no-files-found: warn
          retention-days: 1
      - name: Resolve sign matrix
        id: matrix
        run: |
          matrix=$(jq -cn \
            --arg n   "${{ env.EXTENSION_NAME }}" \
            --arg p   "extensions/${{ env.EXTENSION_NAME }}" \
            --arg pkg "${{ needs.detect.outputs.package_name }}" \
            '{"include":[{"extension_name":$n,"extension_path":$p,"package_name":$pkg}]}')
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  # ── Sign & submit to AMO ──────────────────────────────────────────────────
  sign:
    name: Sign
    needs: [detect, build-workspace]
    if: needs.detect.outputs.release_mode == 'publish'
    uses: ./.github/workflows/_extension-sign.yml
    secrets: inherit
    with:
      matrix: ${{ needs.build-workspace.outputs.matrix }}

  # ── Mark what AMO accepted ────────────────────────────────────────────────
  tag:
    name: Tag Release
    needs: [detect, sign]
    if: needs.detect.outputs.release_mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag the release commit
        run: |
          tag="${EXTENSION_NAME}@$(jq -r .version "extensions/${EXTENSION_NAME}/package.json")"
          git tag "$tag"
          git push origin "refs/tags/$tag"
