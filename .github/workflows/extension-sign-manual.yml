name: Sign Firefox Extension (Manual)
# Manual-only AMO signing gate. Auto-sign on main is suspended while AMO
# compliance footguns are resolved: https://github.com/paulgsc/some-ui/issues/310
#
# Usage:
#   Actions → "Sign Firefox Extension (Manual)" → Run workflow
#   Fill in the extension name and check the compliance confirmation box.
#
# The compliance_confirmed checkbox is a hard gate — the workflow fails
# immediately if it is not checked. This prevents accidental signs before
# all A+B issues in epic #310 are closed.
permissions:
  contents: read
  actions: read
on:
  workflow_dispatch:
    inputs:
      extension:
        description: "Extension directory name (e.g. suspender-ledger)"
        required: true
        type: string
      compliance_confirmed:
        description: >
          I confirm that all A+B issues in
          https://github.com/paulgsc/some-ui/issues/310 are resolved for
          this extension and the pre-sign checklist in
          extensions/docs/amo-compliance.md §11 has been completed.
        required: true
        type: boolean
        default: false

jobs:
  preflight:
    name: Compliance Gate
    runs-on: ubuntu-latest
    steps:
      - name: Fail if compliance not confirmed
        if: ${{ inputs.compliance_confirmed != true }}
        run: |
          echo "::error::compliance_confirmed must be checked before signing."
          echo "::error::Resolve all A+B issues in https://github.com/paulgsc/some-ui/issues/310 first."
          echo "::error::Then complete the pre-sign checklist in extensions/docs/amo-compliance.md §11."
          exit 1

      # `inputs.extension` is free text, so it reaches the shell only as
      # $EXTENSION, never expanded into the script (#2116). `%q` keeps a
      # newline in it from starting a workflow command line in the log.
      - name: Confirm target extension
        env:
          EXTENSION: ${{ inputs.extension }}
          COMPLIANCE_CONFIRMED: ${{ inputs.compliance_confirmed }}
        run: |
          printf 'Signing extension: %q\n' "$EXTENSION"
          echo "Compliance confirmed: $COMPLIANCE_CONFIRMED"

  build-matrix:
    name: Build Sign Matrix
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      # The input must name one of the extensions _extension-detect.yml
      # discovers: a directory under extensions/ with a package.json and a
      # manifest*.json source. Anything else (a path, a shell word, a
      # workspace that ships no manifest) fails here, before a build, and is
      # never echoed back. It arrives as $EXTENSION, not a template (#2116).
      - name: Resolve extension metadata
        id: matrix
        env:
          EXTENSION: ${{ inputs.extension }}
        run: |
          known=()
          for dir in extensions/*/; do
            [ -f "${dir}package.json" ] || continue
            manifest=$(find "$dir" -maxdepth 3 -iname 'manifest*.json' \
              -not -path '*/node_modules/*' -not -path '*/dist/*' | head -1)
            [ -n "$manifest" ] || continue
            known+=("$(basename "$dir")")
          done

          ext=""
          for name in "${known[@]}"; do
            if [ "$name" = "$EXTENSION" ]; then ext="$name"; fi
          done
          if [ -z "$ext" ]; then
            echo "::error::The extension input names no extension. Choose one of: ${known[*]}"
            exit 1
          fi
          ext_path="extensions/${ext}"

          pkg_name=$(jq -r '.name' "${ext_path}/package.json" 2>/dev/null)
          if [ -z "$pkg_name" ] || [ "$pkg_name" = "null" ]; then
            echo "::error::Could not read .name from ${ext_path}/package.json"
            exit 1
          fi

          matrix=$(jq -cn \
            --arg n  "$ext" \
            --arg p  "$ext_path" \
            --arg pkg "$pkg_name" \
            '{"include":[{"extension_name":$n,"extension_path":$p,"package_name":$pkg}]}')

          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Matrix: ${matrix}"

  build-workspace:
    name: Build Workspace Packages
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-ci-setup
        with:
          build: none

      # `pnpm build` carries `--filter='!./crates/*'` (root package.json), so
      # this excludes both extensions and the wasm crates. Only packages/*/dist
      # is uploaded below, so the six wasm-pack builds this used to run
      # produced nothing any later step read.
      - name: Build workspace packages
        run: |
          nix develop .#ci --command pnpm build \
            --filter='!./extensions/**' \
            --concurrency=100%
        env:
          NODE_ENV: production

      - name: Upload workspace dist
        uses: actions/upload-artifact@v7
        with:
          name: workspace-dist
          path: packages/*/dist
          if-no-files-found: warn
          retention-days: 1

  sign:
    name: Sign ${{ inputs.extension }}
    needs: [build-matrix, build-workspace]
    uses: ./.github/workflows/_extension-sign.yml
    secrets: inherit
    with:
      matrix: ${{ needs.build-matrix.outputs.matrix }}
