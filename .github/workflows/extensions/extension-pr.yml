name: Extension PR
on:
  pull_request:
    paths:
      - "extensions/**"
      - "packages/**"
      - ".github/workflows/extensions/**"
      - "pnpm-lock.yaml"
jobs:
  detect:
    uses: ./.github/workflows/extensions/extension-detect.yml
  verify:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    uses: ./.github/workflows/extensions/extension-verify.yml
    with:
      matrix: ${{ needs.detect.outputs.matrix }}
