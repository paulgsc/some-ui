name: Extension Verification
on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v12
      - uses: DeterminateSystems/magic-nix-cache-action@v7
      - name: Verify
        run: |
          nix develop .#ci --command bash -c '
            pnpm install --frozen-lockfile

            pnpm --filter "${{ matrix.extension_name }}" typecheck

            pnpm --filter "${{ matrix.extension_name }}" lint

            pnpm --filter "${{ matrix.extension_name }}" test

            pnpm --filter "${{ matrix.extension_name }}" build

            web-ext lint \
              --source-dir "${{ matrix.extension_path }}/dist" \
              --self-hosted \
              --warnings-as-errors
          '
