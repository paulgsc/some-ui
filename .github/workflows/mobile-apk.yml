name: Mobile APK

# Builds the sideloadable debug APK (`apps/mobile`) and uploads it as a run
# artifact, so a phone can install what this branch actually contains.
#
# Scoped to the mobile staging branch on purpose. That branch is a long-lived
# spine that is not headed for `main` until the on-device experience is
# settled, and no other workflow here runs on a push to it (trunk.yml and
# pages.yml are `main`-only; pr.yml is pull_request-only). A push trigger reads
# this file from the pushed commit, so it runs from the branch alone - nothing
# on `main` has to know it exists. When the branch does land, widen or retire
# this trigger in that same change.
#
# Why CI builds it rather than a laptop or the agent sandbox: Gradle needs the
# Android SDK (`compileSdkVersion` in apps/mobile/android/variables.gradle),
# which `ubuntu-latest` ships preinstalled at $ANDROID_HOME, and which the
# Claude Code sandbox cannot install (dl.google.com is outside its egress
# policy).
on:
  push:
    branches: [ccr-25f1eb44-ep84g6]
    paths:
      - "apps/mobile/**"
      - "apps/www/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile-apk.yml"
      - ".github/workflows/_mobile-review.yml"
      - ".github/actions/**"

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # To read the retained APK the review compares versionCode against, and to
  # delete older APK artifacts once a newer one has passed it.
  actions: write

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/pnpm-cache
      - name: Cache workspace build outputs
        uses: actions/cache@v6
        with:
          path: packages/*/dist
          key: workspace-dist-${{ runner.os }}-${{ hashFiles('packages/**/src/**') }}
          restore-keys: workspace-dist-${{ runner.os }}-
      - name: Install dependencies
        run: |
          nix develop .#ci --command pnpm install \
            --frozen-lockfile \
            --prefer-offline
        env:
          HUSKY: 0
      - uses: ./.github/actions/resume-assets-cache

      # www's build (with the flags `build:web` pins) into apps/www/dist, then
      # `cap sync` copies it and the Capacitor plugins into the Gradle project.
      - name: Build www for the device and sync it into Android
        run: nix develop .#ci --command pnpm --filter @some-ui/mobile bundle
        env:
          NODE_ENV: production

      # The device backend reaches the bundle only through a dynamic import
      # behind VITE_DEVICE_BACKEND, and www's build drops anything it decides
      # has no side effects - silently, with a clean log. An APK without it
      # installs and opens and then fails every request, so check for it by a
      # string only its handlers carry rather than trusting the build.
      - name: Check the device backend is in the bundle
        run: |
          if ! grep -rqF 'subject-device' apps/www/dist/assets; then
            echo "::error::apps/www/dist has no device backend - the APK would have nothing answering file_host"
            exit 1
          fi

      # Outside the nix shell on purpose: Gradle wants the runner's JDK and the
      # preinstalled SDK, neither of which the ci devShell carries.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # One signing key for every build, so each APK installs as an update of
      # the last. Without it every runner signs with a debug key it generated
      # itself, the next APK refuses to install over the previous one, and the
      # only way out is an uninstall - which deletes the phone's database.
      # Failing here, rather than falling back to that key, is the point: a
      # green build must be one the phone can take as an update.
      #
      # Secrets (Settings > Secrets and variables > Actions), made once with
      # the commands in apps/mobile/README.md ("Signing"):
      #   ANDROID_KEYSTORE_BASE64    - the PKCS12 keystore, base64-encoded
      #   ANDROID_KEYSTORE_PASSWORD  - its password (also the key's)
      - name: Install the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD are not set - see apps/mobile/README.md, 'Signing'"
            exit 1
          fi
          keystore="$RUNNER_TEMP/some-ui.keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "SOME_UI_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Assemble debug APK
        working-directory: apps/mobile/android
        env:
          SOME_UI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # Rises with every run, so each APK is an update of the one before.
          SOME_UI_VERSION_CODE: ${{ github.run_number }}
          SOME_UI_VERSION_NAME: 0.1.${{ github.run_number }}+${{ github.sha }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK after its commit
        id: name
        run: |
          short="${GITHUB_SHA::7}"
          out="some-ui-${short}-debug.apk"
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "Built \`$out\` ($(du -h "$out" | cut -f1))." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: some-ui-apk-${{ github.sha }}
          path: ${{ steps.name.outputs.file }}
          if-no-files-found: error
          # A backstop, not the cleanup: the prune job removes every older
          # APK, so this bounds only the newest one's life. After 30 days with
          # no push there is nothing to download until the next.
          retention-days: 30

      # What Play would take: the release build, shrunk by R8, as an APK and
      # as the app bundle Play requires of new apps. Built on every run,
      # after the phone's APK is already uploaded, so release-only breakage
      # turns the run red without costing the phone its build.
      - name: Build release APK and app bundle
        working-directory: apps/mobile/android
        env:
          SOME_UI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SOME_UI_VERSION_CODE: ${{ github.run_number }}
          SOME_UI_VERSION_NAME: 0.1.${{ github.run_number }}+${{ github.sha }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      # Android Lint over the release variant. Report-only: the review
      # summarizes it, and gates on it once apps/mobile/review/policy.json
      # sets lint.gate.
      - name: Android Lint
        continue-on-error: true
        working-directory: apps/mobile/android
        env:
          SOME_UI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SOME_UI_VERSION_CODE: ${{ github.run_number }}
          SOME_UI_VERSION_NAME: 0.1.${{ github.run_number }}+${{ github.sha }}
        run: ./gradlew :app:lintRelease --no-daemon

      - name: Collect the review's inputs
        run: |
          out=apps/mobile/android/app/build
          mkdir review-inputs
          cp "$out/outputs/apk/debug/app-debug.apk" review-inputs/debug.apk
          cp "$out/outputs/apk/release/app-release.apk" review-inputs/release.apk
          cp "$out/outputs/bundle/release/app-release.aab" review-inputs/release.aab
          cp "$out/outputs/mapping/release/mapping.txt" review-inputs/mapping.txt
          cp "$out/reports/lint-results.xml" "$out/reports/lint-results.html" review-inputs/ || true
      - name: Upload the review's inputs
        uses: actions/upload-artifact@v7
        with:
          name: mobile-review-${{ github.sha }}
          path: review-inputs
          if-no-files-found: error
          retention-days: 3

  review:
    name: Play readiness
    needs: apk
    uses: ./.github/workflows/_mobile-review.yml
    with:
      inputs-artifact: mobile-review-${{ github.sha }}

  # Only the newest APK is worth keeping, so a run that passes the review
  # deletes this workflow's older ones: one ~10 MB artifact on GitHub at a
  # time, not one per push. After the review, because the review reads the
  # retained APK to check versionCode only ever rises; and never after a
  # failed or cancelled run, which leaves the previous APK in place.
  prune:
    name: Delete older APK artifacts
    needs: [apk, review]
    runs-on: ubuntu-latest
    steps:
      - name: Delete older APK artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq ".artifacts[]
                  | select(.name | startswith(\"some-ui-apk-\"))
                  | select(.workflow_run.id != $GITHUB_RUN_ID)
                  | select(.expired | not)
                  | .id" |
          while read -r id; do
            echo "deleting artifact $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done
