name: Pages
# Builds and deploys the GitHub Pages site: the tanstack `www` app at the
# site root.
#
# GitHub Pages serves exactly one live deployment per repo, and
# actions/deploy-pages replaces the *entire* artifact on every run - it
# can't merge with whatever a separate workflow deployed earlier. So
# anything else this site serves has to be built here, into the one tree
# build-www uploads; a second workflow deploying to Pages would silently
# wipe out this one's last-deployed content.
#
# A plain `push: branches: [main]` trigger would also mean every merge to
# main rebuilds and redeploys the whole site, even though several PRs often
# land within minutes of each other - each one paying for a full www
# build that the next merge immediately supersedes. So a push to main that
# touches what the site is built from doesn't deploy directly: its run waits
# in the `approve` job on the `pages-release` environment's required
# reviewer, and only approving it - the human "yes, ship what's on main now"
# judgment call - builds and deploys. A newer push cancels a run still
# waiting there, so however many merges land first, the one run you can
# approve is main's newest, and they collapse into one deploy (epic #1615,
# Decision 1).
#
# The Pages site is not a versioned artifact, so there is no version to
# bump. A workflow_dispatch builds and deploys at once without the approval,
# since dispatching is itself someone asking to deploy.
on:
  push:
    branches: [main]
    paths:
      - "apps/www/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/_environment-approval.yml"
      - ".github/actions/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/www/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Optional last-known-good commit SHA to deploy while leaving main unchanged (empty: deploy main's head)"
        type: string
        required: false
permissions:
  contents: read
  pages: write
  id-token: write
# No workflow-level concurrency: a run waiting in `approve` would hold that
# group, so a newer push would queue behind it and approving the waiting run
# would deploy the older commit. Each job below takes its own group instead.
jobs:
  # ── Approve the deploy ──────────────────────────────────────────────────
  approve:
    name: Approve Pages deploy
    if: github.event_name == 'push'
    uses: ./.github/workflows/_environment-approval.yml
    with:
      environment: pages-release
    permissions:
      actions: read

  # ── Build the tanstack app ───────────────────────────────────────────────
  build-www:
    name: Build www (TanStack app)
    needs: approve
    # `approve` is skipped on pull_request and workflow_dispatch, and a job a
    # skipped one sits above is itself skipped unless its `if` says
    # otherwise, so this one and deploy spell out `!cancelled()`.
    # pull_request runs only when its paths above matched, so it always
    # builds the preview.
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.approve.result == 'success') }}
    runs-on: ubuntu-latest
    # A newer queued build replacing an older queued one (the default
    # `queue: single`) is intended here and in
    # pages-deploy: the site holds one deployment, approvals arrive in push
    # order because only main's newest run can be waiting, so the newest
    # request is a superset of the one it replaces and the last request wins.
    # `queue: max` would ship every superseded commit, in an order GitHub
    # does not guarantee, so an older commit could land over a newer one.
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # A re-run remains tied to that run's github.sha. A manual
          # rollback instead checks out the operator-selected known-good
          # tree, without moving or reverting main.
          ref: ${{ inputs.rollback_sha || github.sha }}
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/pnpm-cache
      # No crates/*/dist here, and no crates/**/src/** in the key. www consumes
      # the wasm packages from the npm registry at a pinned version (see
      # packages/ui/*/package.json), not from crates/* as workspace source, so
      # `--filter=www...` below never reaches a crate and nothing would ever
      # populate crates/*/dist in this job. Hashing crate sources into the key
      # was actively harmful: editing any .rs file invalidated the *packages*
      # dist cache and forced a full JS rebuild for a change www cannot see.
      - name: Cache workspace build outputs
        uses: actions/cache@v6
        with:
          path: packages/*/dist
          key: workspace-dist-${{ runner.os }}-${{ hashFiles('packages/**/src/**') }}
          restore-keys: workspace-dist-${{ runner.os }}-
      - name: Install dependencies
        run: |
          nix develop .#ci --command pnpm install \
            --frozen-lockfile \
            --prefer-offline
        env:
          HUSKY: 0

      - uses: ./.github/actions/resume-assets-cache

      # The lines-of-code number in the dashboard header is a snapshot taken
      # here, as the site is built (apps/www/src/lib/loc-report). Best-effort:
      # without it the build ships the tracked placeholder and no widget.
      # Not on pull requests, which build www only to check it, and not on a
      # rollback, whose checkout is an older commit than the history the
      # numbers would count up to today.
      - name: Snapshot lines of code
        if: github.event_name != 'pull_request' && inputs.rollback_sha == ''
        continue-on-error: true
        uses: ./.github/actions/loc-snapshot

      # honeycomb's sfx lives in packages/some-content (pure assets, no build
      # step of its own) and isn't part of www's own public/ dir. It's
      # tiny/curated enough to bake into the static GitHub Pages build (unlike
      # the Docker image, which volume-mounts it at runtime instead - see
      # infra/compose). No-op if the subdir doesn't exist (sfx/ is gitignored
      # and only populated locally).
      #
      # leetype's code-samples dropped out in M20 (#887): exercises carry
      # inline sources now, so no code path fetches a file to start a step.
      - name: Copy content assets into www's public dir
        run: |
          for dir in sfx; do
            src="packages/some-content/public/$dir"
            if [ -d "$src" ]; then
              mkdir -p "apps/www/public/$dir"
              cp -r "$src"/. "apps/www/public/$dir"/
            fi
          done

      - name: Build www and its workspace dependencies
        run: nix develop .#ci --command pnpm turbo build --filter=www... --concurrency=100%
        env:
          NODE_ENV: production
          # GitHub Pages serves this repo under /<repo>/ - www's own
          # Dockerfile/nginx build leaves this unset (defaults to "/").
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # This build deploys no companion data (the copy step above takes
          # only sfx), so every content shim must fall back to
          # its bundled demo seed instead of fetching - see
          # apps/www/src/lib/data-mode. Deliberately its own flag rather than
          # NODE_ENV or Vite's PROD: the Docker image is also a production
          # build, and it *does* serve public/, so neither of those can tell
          # the two apart.
          VITE_STATIC_DATA: "true"
          # Nobody reaches this site from the home network, so it leaves out
          # the LAN-only workspaces entirely - see apps/www/build.profiles.ts.
          SOME_UI_PROFILE: pages
      - name: Add SPA fallback for client-side routing
        # GitHub Pages has no server-side rewrite; a hard refresh or deep
        # link on a client-side route 404s without this. Serving the same
        # shell from 404.html lets the router take over from the URL.
        run: cp apps/www/dist/index.html apps/www/dist/404.html
      # Uploaded here, inside this job's concurrency group, so a run's
      # deploy queues as soon as its own build ends while the next approved
      # run's build is only starting: concurrency does not order jobs, so a
      # separate hop between the two would let an older deploy start after
      # a newer one. Read only by `deploy`, in this same run. 1 is also the
      # action's own default; it is spelled out so the retention check need
      # not know that.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/www/dist
          retention-days: 1
  # ── Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-www
    # Only deploy from main, on an approved push or a workflow_dispatch -
    # never on pull requests, whose builds are previews. The explicit
    # needs.build-www.result check matters here, not just event/ref: a
    # skipped upstream job doesn't reliably skip a job with its own custom
    # `if`, so this can't just rely on build-www having been skipped.
    if: >
      !cancelled() &&
      needs.build-www.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    # Same queueing as build-www, for the same reason.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      # deploy-pages waits for the deployment to go live, so the freshly
      # published tree is readable immediately - no polling/retry needed.
      # Only scripts/check-resume-deploy.mjs is needed here (it has no
      # dependencies of its own), so this checks out just that file rather
      # than the whole repo.
      - name: Check out résumé deploy check
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.rollback_sha || github.sha }}
          sparse-checkout: apps/www/scripts/check-resume-deploy.mjs
          sparse-checkout-cone-mode: false
      - name: Verify /resume/ deployment surface
        run: node apps/www/scripts/check-resume-deploy.mjs "${{ steps.deployment.outputs.page_url }}resume/"
