name: Pages
# Builds and deploys the GitHub Pages site: the tanstack `www` app at the
# site root, Storybook nested under /storybook/.
#
# GitHub Pages serves exactly one live deployment per repo, and
# actions/deploy-pages replaces the *entire* artifact on every run - it
# can't merge with whatever a separate workflow deployed earlier. So this
# is one workflow, not two: build-www and build-storybook each produce a
# plain (non-Pages) artifact, a single assemble job merges both into one
# directory tree, and only that merged tree is ever uploaded as the Pages
# artifact / deployed. Splitting this into per-app workflows would silently
# make each deploy wipe out the other app's last-deployed content.
#
# A plain `push: branches: [main]` trigger would also mean every merge to
# main rebuilds and redeploys the whole site, even though several PRs often
# land within minutes of each other - each one paying for a full www +
# Storybook build that the next merge immediately supersedes. So, patterned
# after wasm-release.yml / www-docker-release.yml: a push to main that
# touches release-worthy paths doesn't deploy directly. It opens/updates a
# standing release PR (branch `release/pages`) instead, and only merging
# that PR - the human "yes, ship what's on main now" judgment call - builds
# and deploys. Multiple merges before someone gets to it collapse into one
# deploy instead of one per PR.
on:
  push:
    branches: [main]
    paths:
      - "apps/www/**"
      - "packages/**"
      - ".storybook/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
      - ".github/actions/**"
      # The release PR's own commit only touches this file (see the
      # release-pr job below) - without it here, merging that PR would
      # never re-trigger the workflow, and the deploy would never fire.
      - ".github/pages-release-marker.txt"
  pull_request:
    branches: [main]
    paths:
      - "apps/www/**"
      - "packages/**"
      - ".storybook/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      publish_only:
        description: "Skip detection/PR and build+deploy the Pages site straight from the current main (use to force a redeploy, or retry a deploy that failed after the release PR merged)"
        type: boolean
        default: false
env:
  RELEASE_COMMIT_MESSAGE: "chore(release): deploy pages site"
  RELEASE_BRANCH: "release/pages"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # ── Detect which builds a PR needs, and what main's push should do ──────
  # The paths above decide whether this workflow runs at all, but they're a
  # union - a PR touching only apps/www/** still matches, and would build
  # Storybook too without the per-path split below. On pull_request, split
  # www vs storybook so each preview build only runs when its own inputs
  # changed.
  #
  # On push (and workflow_dispatch), the per-path split doesn't apply -
  # pages-detect below decides instead whether this push opens/updates the
  # release PR or is the release PR's own merge landing (in which case both
  # builds always run regardless of what changed, since assemble/deploy
  # replace the *entire* Pages artifact each run - see header).
  detect:
    name: Detect Pages Changes
    runs-on: ubuntu-latest
    outputs:
      www: ${{ steps.filter.outputs.www }}
      storybook: ${{ steps.filter.outputs.storybook }}
      release_mode: ${{ steps.pages-detect.outputs.release_mode }}
    steps:
      - uses: actions/checkout@v7
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            www:
              - 'apps/www/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/pages.yml'
              - '.github/actions/**'
            storybook:
              - 'packages/**'
              - '.storybook/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/pages.yml'
              - '.github/actions/**'
      - id: pages-detect
        uses: ./.github/actions/pages-detect
        with:
          event-name: ${{ github.event_name }}
          publish-only: ${{ inputs.publish_only }}
          commit-message: ${{ github.event.head_commit.message }}
          release-commit-message: ${{ env.RELEASE_COMMIT_MESSAGE }}

  # ── Open/update the release PR ──────────────────────────────────────────
  # Re-running this on a later push updates the same PR/branch, so several
  # merges before a maintainer gets to it collapse into one review instead
  # of one deploy each. No changeset/version bump here, unlike
  # wasm-release.yml / www-docker-release.yml's release tracks - the Pages
  # site isn't a versioned artifact, just a standing "deploy what's on main
  # now" gate, so the PR's only content is a marker file to give it a diff.
  release-pr:
    name: Open/Update Pages Release PR
    needs: detect
    if: needs.detect.outputs.release_mode == 'release-pr'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bump Pages release marker
        run: |
          {
            echo "Pending Pages deploy through commit ${{ github.sha }}"
            echo "Updated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .github/pages-release-marker.txt
      - name: Open release PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ${{ env.RELEASE_BRANCH }}
          base: main
          delete-branch: true
          commit-message: ${{ env.RELEASE_COMMIT_MESSAGE }}
          title: ${{ env.RELEASE_COMMIT_MESSAGE }}
          body: >
            Opened automatically because a change reachable from `apps/www`, `packages/**`, or `.storybook/**` landed on `main`. Several PRs landing close together would otherwise each trigger their own Pages build+deploy; this collects them into one. Review and merge via **squash** (the merge commit message drives the deploy step below) to build and deploy the Pages site (www + Storybook).

  # ── Build the tanstack app ───────────────────────────────────────────────
  build-www:
    name: Build www (TanStack app)
    needs: detect
    if: >
      (github.event_name == 'pull_request' && needs.detect.outputs.www == 'true') ||
      (github.event_name != 'pull_request' && needs.detect.outputs.release_mode == 'publish')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/pnpm-cache
        with:
          shell: ci
      - name: Cache workspace build outputs
        uses: actions/cache@v6
        with:
          path: |
            packages/*/dist
            crates/*/dist
          key: workspace-dist-${{ runner.os }}-${{ hashFiles('packages/**/src/**', 'crates/**/src/**') }}
          restore-keys: workspace-dist-${{ runner.os }}-
      - name: Install dependencies
        run: |
          nix develop .#ci --command pnpm install \
            --frozen-lockfile \
            --prefer-offline
        env:
          HUSKY: 0
      # honeycomb's sfx lives in packages/some-content (pure assets, no build
      # step of its own) and isn't part of www's own public/ dir. It's
      # tiny/curated enough to bake into the static GitHub Pages build (unlike
      # the Docker image, which volume-mounts it at runtime instead - see
      # infra/compose). No-op if the subdir doesn't exist (sfx/ is gitignored
      # and only populated locally).
      #
      # leetype's code-samples dropped out in M20 (#887): exercises carry
      # inline sources now, so no code path fetches a file to start a step.
      - name: Copy content assets into www's public dir
        run: |
          for dir in sfx; do
            src="packages/some-content/public/$dir"
            if [ -d "$src" ]; then
              mkdir -p "apps/www/public/$dir"
              cp -r "$src"/. "apps/www/public/$dir"/
            fi
          done

      - name: Build www and its workspace dependencies
        run: nix develop .#ci --command pnpm turbo build --filter=www... --concurrency=100%
        env:
          NODE_ENV: production
          # GitHub Pages serves this repo under /<repo>/ - www's own
          # Dockerfile/nginx build leaves this unset (defaults to "/").
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # This build deploys no companion data (the copy step above takes
          # only sfx), so every content shim must fall back to
          # its bundled demo seed instead of fetching - see
          # apps/www/src/lib/data-mode. Deliberately its own flag rather than
          # NODE_ENV or Vite's PROD: the Docker image is also a production
          # build, and it *does* serve public/, so neither of those can tell
          # the two apart.
          VITE_STATIC_DATA: "true"
      - name: Add SPA fallback for client-side routing
        # GitHub Pages has no server-side rewrite; a hard refresh or deep
        # link on a client-side route 404s without this. Serving the same
        # shell from 404.html lets the router take over from the URL.
        run: cp apps/www/dist/index.html apps/www/dist/404.html
      - name: Upload www build artifact
        uses: actions/upload-artifact@v7
        with:
          name: www-dist
          path: apps/www/dist
          if-no-files-found: error
          retention-days: 1
  # ── Build Storybook ──────────────────────────────────────────────────────
  build-storybook:
    name: Build Storybook
    needs: detect
    if: >
      (github.event_name == 'pull_request' && needs.detect.outputs.storybook == 'true') ||
      (github.event_name != 'pull_request' && needs.detect.outputs.release_mode == 'publish')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/pnpm-cache
        with:
          shell: ci
      - name: Cache workspace build outputs
        uses: actions/cache@v6
        with:
          path: packages/*/dist
          key: workspace-dist-${{ runner.os }}-${{ hashFiles('packages/**/src/**') }}
          restore-keys: workspace-dist-${{ runner.os }}-
      - name: Cache Storybook intermediates
        uses: actions/cache@v6
        with:
          path: |
            node_modules/.cache/storybook
            node_modules/.cache/sb-vite-plugin-externals
          key: storybook-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.storybook/**', 'packages/**/*.stories.*') }}
          restore-keys: storybook-cache-${{ runner.os }}-
      - name: Install dependencies
        run: |
          nix develop .#ci --command pnpm install \
            --frozen-lockfile \
            --prefer-offline
        env:
          HUSKY: 0
      - name: Build workspace packages
        run: nix develop .#ci --command pnpm build --concurrency=100%
        env:
          NODE_ENV: production
      - name: Build Storybook
        run: nix develop .#ci --command pnpm build-storybook
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096
          STORYBOOK_DISABLE_TELEMETRY: 1
          STORYBOOK_BASE_PATH: /${{ github.event.repository.name }}/storybook/
      - name: Upload Storybook build artifact
        uses: actions/upload-artifact@v7
        with:
          name: storybook-dist
          path: ./storybook-static
          if-no-files-found: error
          retention-days: 1
  # ── Assemble the combined site and upload the single Pages artifact ─────
  assemble:
    name: Assemble Pages site
    needs: [build-www, build-storybook]
    runs-on: ubuntu-latest
    steps:
      - name: Download www build
        uses: actions/download-artifact@v8
        with:
          name: www-dist
          path: site
      - name: Download Storybook build
        uses: actions/download-artifact@v8
        with:
          name: storybook-dist
          path: site/storybook
      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site
  # ── Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: assemble
    # Only deploy on the release commit landing on main (a merged release
    # PR, or a forced workflow_dispatch publish_only) - never on ordinary
    # PRs, preview builds, or a push that only opened/updated the release
    # PR (assemble is skipped in that case). The explicit
    # needs.assemble.result check matters here, not just event/ref: a
    # skipped upstream job doesn't reliably skip a job with its own custom
    # `if`, so this can't just rely on assemble having been skipped.
    if: >
      needs.assemble.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
