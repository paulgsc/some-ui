name: Pedagogy
on:
  push:
    branches: [main]
    paths:
      - "level*/**"
      - ".github/workflows/pedagogy.yml"
  pull_request:
    branches: [main]
    paths:
      - "level*/**"
      - ".github/workflows/pedagogy.yml"
jobs:
  test:
    name: Test Level ${{ matrix.level }}
    runs-on: ubuntu-latest
    # Let each level fail independently — a missing level isn't a CI failure.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        level: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: pedagogy-level-${{ matrix.level }}
      - name: Build Level ${{ matrix.level }}
        id: build
        run: |
          if [ -f "level${{ matrix.level }}/Cargo.toml" ]; then
            nix develop .#ci --command cargo build \
              --release \
              --manifest-path "level${{ matrix.level }}/Cargo.toml"
          elif [ -f "level${{ matrix.level }}/Makefile" ]; then
            make -C "level${{ matrix.level }}"
          else
            echo "Level ${{ matrix.level }} not yet implemented — skipping."
            exit 0
          fi
      - name: Test Level ${{ matrix.level }}
        run: |
          if [ -f "level${{ matrix.level }}/Cargo.toml" ]; then
            nix develop .#ci --command cargo test \
              --release \
              --manifest-path "level${{ matrix.level }}/Cargo.toml"
          elif [ -f "level${{ matrix.level }}/run_tests.sh" ]; then
            bash "level${{ matrix.level }}/run_tests.sh"
          fi
      - name: Integration tests (Level 4 only)
        if: matrix.level == 4
        run: |
          if [ -f "tests/integration_tests.sh" ]; then
            bash tests/integration_tests.sh
          fi
  lint:
    name: Pedagogy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: pedagogy-lint
      - name: Fmt + Clippy (all levels)
        run: |
          for level in level*/; do
            if [ -f "${level}Cargo.toml" ]; then
              echo "=== ${level} ==="
              nix develop .#ci --command cargo fmt \
                --manifest-path "${level}Cargo.toml" -- --check
              nix develop .#ci --command cargo clippy \
                --manifest-path "${level}Cargo.toml" -- -D warnings
            fi
          done
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: pedagogy-bench
      - name: Run benchmarks
        id: bench
        run: |
          if [ -f "scripts/run_benchmarks.sh" ]; then
            bash scripts/run_benchmarks.sh
          else
            echo "No benchmark script found — skipping."
          fi
      - name: Comment benchmark results on PR
        if: hashFiles('benchmark_results.txt') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('benchmark_results.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Benchmark Results\n\n\`\`\`\n${results}\n\`\`\``,
            });
