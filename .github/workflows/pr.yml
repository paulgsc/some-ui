name: PR
# Fast, dep-aware CI for pull requests.
#
# Philosophy (see docs/ci-architecture.md):
#   PR CI answers: "does this change break what it touches?"
#   Trunk CI (trunk.yml) answers: "is the whole repo healthy?"
#
# Filtering strategy:
#   turbo --filter=...[HEAD^1] runs lint/typecheck/test for every package
#   whose files changed AND every package that depends on a changed package
#   (transitively). This is dep-graph-aware — dorny/paths-filter is not.
#
#   Rust uses cargo's --workspace for now; a fine-grained Rust workspace
#   filter would require cargo-hakari or similar. Given Rust compile times,
#   full workspace on any Rust touch is acceptable.
#
# What does NOT run on PR:
#   - Artifact builds (Docker, Storybook deploy, AMO signing, WASM publish)
#   - Full trunk health sweep (that's trunk.yml)
#   Extension CI has its own workflow (extension.yml) and is not gated here.
#
# ci-gate is the single required status check. Configure branch protection
# to require only this job, not the individual rust/node jobs (which may be
# skipped when no relevant files changed).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # ── Path detection ──────────────────────────────────────────────────────
  # Coarse-grained: did Rust files change? Node files? CI config?
  # Used only to decide whether to run the Rust job and for the ci-gate
  # logic. Node filtering is handled by turbo, not by this step.
  changes:
    uses: ./.github/workflows/_detect-changes.yml

  # ── Rust CI ────────────────────────────────────────────────────────────
  # Runs on any Rust or CI change. Full workspace — cargo doesn't have
  # a turbo-equivalent dep-aware filter without additional tooling.
  rust:
    name: Rust CI
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/_rust-ci.yml

  # ── Node CI (dep-aware, turbo-filtered) ────────────────────────────────
  # Only runs if Node/TS/CSS files or CI config changed.
  # turbo --filter=...[HEAD^1] scopes work to changed packages + dependents.
  node:
    name: Node CI (filtered)
    needs: changes
    if: needs.changes.outputs.node == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # turbo --filter=[HEAD^1] needs the parent commit to diff against.
          fetch-depth: 2

      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/pnpm-cache

      - name: Install dependencies
        run: nix develop .#ci --command pnpm install --frozen-lockfile --prefer-offline
        env:
          HUSKY: 0

      # Build only the packages that changed or whose dependents changed.
      # The ...[HEAD^1] syntax means: this package and everything that
      # depends on it, filtered to what changed since the last commit.
      #
      # crates/* are excluded explicitly (this step calls turbo directly, so
      # it does not pick up the root `pnpm build` script's filter). A PR that
      # touches a .rs file makes ...[HEAD^1] select that crate, whose `build`
      # script is `wasm-pack build --release` - a ~45s compile per crate, and
      # this job has no cargo-cache to make it cheaper. Nothing in the PR
      # needs the output: packages consume the wasm packages from the npm
      # registry at a pinned version, so no dependent is waiting on that dist.
      # The `rust` job in this same workflow already compiles, clippies and
      # tests the crate, and wasm-release.yml is the only flow that has to
      # turn a crate diff into an actual artifact.
      - name: Build (affected packages)
        run: |
          nix develop .#ci --command pnpm turbo run build \
            --filter=...[HEAD^1] \
            --filter='!./extensions/**' \
            --filter='!./crates/*' \
            --concurrency=100%

      - name: Typecheck (affected packages)
        run: |
          nix develop .#ci --command pnpm turbo run typecheck \
            --filter=...[HEAD^1] \
            --filter='!./extensions/**' \
            --concurrency=100%

      - name: Lint (affected packages)
        run: |
          nix develop .#ci --command pnpm turbo run lint:js \
            --filter=...[HEAD^1] \
            --filter='!./extensions/**' \
            --concurrency=100%

      # Repo-wide invariant, so not turbo-filtered: a manifest that opts out
      # of the catalog is drift regardless of which package changed. Runs
      # without an install (no dependencies of its own) and is cheap enough
      # not to warrant a filter.
      - name: Dependency catalog guardrail
        run: node scripts/check-catalog-drift.mjs

      # Repo-wide invariant like the catalog check above, and not turbo-filtered
      # for the same reason: the client/server boundary is a property of the
      # whole repo, and the snapshot it compares against
      # (packages/contract-harness/routes.server.json) can go stale from a
      # change in the *server* repo that no file here reflects. Only the drift
      # layer runs - it is pure Node string comparison against the checked-in
      # snapshot and needs no file_host. The conformance layer needs a live
      # server and stays a local step; see that package's README.
      - name: Contract drift (client/server boundary)
        run: nix develop .#ci --command pnpm --filter @some-ui/contract-harness contract:drift

      # Unused-export/dependency graph check, same shape as the steps above.
      # A workspace opts in by declaring a `knip` script; turbo only runs the
      # task where the script exists, so widening coverage is a one-line
      # change in that package's manifest rather than an edit here.
      #
      # The script anchors knip at the repo root (`--directory`) and scopes it
      # to the calling package (`--workspace`), because knip invoked with the
      # package as its cwd cannot see the root manifest or knip.json: it then
      # reports every colocated *.test.ts as an unused file and every
      # root-provided binary (tsc, eslint, vitest, …) as unlisted. Anchored,
      # apps/www reports clean; unanchored it reports 23 phantom findings.
      - name: Knip (affected packages)
        run: |
          nix develop .#ci --command pnpm turbo run knip \
            --filter=...[HEAD^1] \
            --filter='!./extensions/**' \
            --concurrency=100%

      # Scoped to CSS files actually touched by this PR, not a full-repo
      # sweep — the repo carries pre-existing stylelint debt outside this
      # diff, and a blanket scan would fail PRs on files they never touched.
      # Extensions are excluded (own CI in extension.yml), matching the
      # other steps in this job.
      - name: Lint styles (changed files)
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 -- '*.css' | grep -v '^extensions/' || true)
          if [ -n "$files" ]; then
            nix develop .#ci --command pnpm exec stylelint --allow-empty-input --ignore-path .prettierignore $files
          else
            echo "No package/app CSS files changed."
          fi

      - name: Prettier (affected packages)
        run: |
          nix develop .#ci --command pnpm turbo run prettier \
            --filter=...[HEAD^1] \
            --filter='!./extensions/**' \
            --concurrency=100%

      - name: Test (affected packages)
        run: |
          nix develop .#ci --command pnpm turbo run test \
            --filter=...[HEAD^1] \
            --filter='!./extensions/**' \
            --concurrency=100%

      # Corpus lint (LTY-FAMILIES A5): "no judgment is allowed unless it can
      # produce its own justification" as a CI failure, the fourth of this
      # repo's data-as-CI-input guardrails (scripts/check-wasm-bindgen-boundary.sh,
      # scripts/check-mutation-boundary.sh, docs/canon/scripts/check-citations.sh
      # are the other three). Turbo-filtered, same shape as the Knip step
      # below: a workspace opts in by declaring a `lint:corpus` script — only
      # packages/ui/leetype declares one today.
      - name: Corpus lint (affected packages)
        run: |
          nix develop .#ci --command pnpm turbo run lint:corpus \
            --filter=...[HEAD^1] \
            --filter='!./extensions/**' \
            --concurrency=100%

      # LTY-PATCH's own guardrail (#1081): "deletions are free" is a claim
      # about the real compiled engine, not the vitest type stub — see
      # scripts/load-real-wasm.ts's doc comment for why the plain `test`
      # step above can never exercise this. Same opt-in shape as the corpus
      # lint step: a workspace opts in by declaring a `test:deletions-are-free`
      # script — only packages/ui/leetype declares one today.
      - name: Deletions-are-free guardrail (affected packages)
        run: |
          nix develop .#ci --command pnpm turbo run test:deletions-are-free \
            --filter=...[HEAD^1] \
            --filter='!./extensions/**' \
            --concurrency=100%

      # public/sw.js is the one file in apps/www that nothing else checks: a
      # plain public/ asset, never bundled, never imported, never type-checked,
      # and unreachable from vitest. This drives it in a real Chromium with a
      # real push, so a typo in it fails here instead of shipping as a study
      # reminder that silently never arrives. Scoped like the CSP step below,
      # because it is a behavioural invariant of specific files rather than a
      # per-package test turbo's dep graph would select.
      - name: E2E — study-nudge service worker (www)
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 -- \
            'apps/www/public/sw.js' \
            'apps/www/tests/study-nudge/**' \
            'apps/www/src/lib/study-nudge/**' || true)
          if [ -n "$files" ]; then
            nix develop .#ci-playwright --command pnpm --filter www test:sw
          else
            echo "No service-worker files changed."
          fi

      # docs/ui-fit calls its Playwright layer "the actual gate", and until #899
      # nothing ran it: it lived behind `pnpm test:ui-fit`, which no workflow
      # invoked, so a panel could paint outside its rect for months with every
      # check green. This wires the part of it that is green.
      #
      # `no-overflow.spec.ts` - the repo-wide story sweep - is deliberately not
      # in this list. It reports 128 stories today (Sandlot, the scheduler's
      # popups, the chat surfaces, topik's change-material dialog …), all of it
      # predating #899, and turning that into a required check would fail every
      # UI PR for work it did not do. It stays a local command until that
      # backlog is worked down; the three specs here are the ones that pass and
      # therefore the ones that can regress.
      #
      # Scoped to PRs that touch UI, because a Storybook build is minutes, not
      # seconds. The registry is in the trigger set on purpose - binding a new
      # key delegates size authority to a component the panel sweep has never
      # measured.
      - name: E2E — content fits its box (panels, launcher, exercise shell)
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 -- \
            'packages/ui/**' \
            'packages/some-content-registry/**' \
            'packages/some-styles/**' \
            'apps/www/src/**' \
            'apps/www/tests/ui-fit/**' \
            '.storybook/**' || true)
          if [ -n "$files" ]; then
            # A repo-wide Storybook build needs a repo-wide package build, so
            # this is NOT turbo-filtered the way the steps above are.
            #
            # STORYBOOK_SCOPE=packages compiles every story under packages/**,
            # and a story reaching a sibling workspace by package name
            # (packages/ui/input's demo-dice -> @some-ui/dice-card) resolves it
            # through node_modules to that package's dist/. "Build (affected
            # packages)" only covers the changed package and its dependents, so
            # any workspace outside that closure has no dist and the build dies
            # on "Rolldown failed to resolve", pointing at a file the PR never
            # touched.
            #
            # This stayed hidden for as long as every UI change dragged
            # apps/www in as a dependent, whose own ^build happens to cover
            # most of the graph. A new leaf package that nothing depends on yet
            # selects a two-package closure and walks straight into it.
            nix develop .#ci --command pnpm turbo run build \
              --filter='./packages/**' \
              --concurrency=100%

            nix develop .#ci --command env CI=1 STORYBOOK_SCOPE=packages \
              pnpm build-storybook -o storybook-static
            nix develop .#ci-playwright --command env STORYBOOK_STATIC=storybook-static \
              pnpm --filter www test:e2e \
                tests/ui-fit/panel-fit.spec.ts \
                tests/ui-fit/launcher-fit.spec.ts \
                tests/ui-fit/exercise-shell-fit.spec.ts
          else
            echo "No UI files changed."
          fi

      # Scoped to the CSP/nginx config surface actually touched by this PR -
      # this is a config invariant (apps/www/nginx.security-headers.conf),
      # not a per-package build/test, so turbo's dep-graph filter doesn't
      # apply the way it does to the steps above. Regression coverage for
      # #660 (www's CSP header blocked WebAssembly instantiation).
      #
      # The spec argument is load-bearing. `test:e2e` is `playwright test`
      # with no filter, so without it this step ran the ENTIRE suite - which
      # includes tests/ui-fit/no-overflow.spec.ts, the sweep the step above
      # deliberately does not run because its backlog predates #899 and would
      # "fail every UI PR for work it did not do". Any PR touching
      # apps/www/Dockerfile therefore inherited ~42 unrelated story overflow
      # failures from packages it never touched. Nothing is skipped by naming
      # the spec: the three ui-fit specs that pass are still enforced above,
      # and no-overflow stays a local command exactly as documented there.
      - name: E2E — CSP regression (www)
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 -- \
            'apps/www/Dockerfile' \
            'apps/www/nginx*.conf' \
            'apps/www/tests/csp/**' \
            'apps/www/playwright.config.ts' || true)
          if [ -n "$files" ]; then
            nix develop .#ci-playwright --command pnpm --filter www test:e2e \
              tests/csp/csp.spec.ts
          else
            echo "No CSP-relevant www files changed."
          fi

  # ── Dependency license audit ────────────────────────────────────────────
  deny:
    name: Deny Checks
    needs: changes
    if: >
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.node == 'true' ||
      needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/_deny-checks.yml
    with:
      rust: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' }}
      node: ${{ needs.changes.outputs.node == 'true' || needs.changes.outputs.ci == 'true' }}

  # ── CI Gate ────────────────────────────────────────────────────────────
  # Always runs. Aggregates results from conditional jobs.
  # Configure branch protection to require THIS job only.
  #
  # Skipped jobs are treated as passing (nothing to check → nothing broke).
  # Failed or cancelled jobs that were required fail the gate.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [changes, rust, node, deny]
    if: always()
    steps:
      - name: Evaluate results
        run: |
          FAILED=false

          RUST_REQUIRED="${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' }}"
          RUST_RESULT="${{ needs.rust.result }}"
          if [ "$RUST_REQUIRED" = "true" ] && [ "$RUST_RESULT" != "success" ]; then
            echo "❌ rust: $RUST_RESULT (required)"
            FAILED=true
          else
            echo "✅ rust: $RUST_RESULT (required: $RUST_REQUIRED)"
          fi

          NODE_REQUIRED="${{ needs.changes.outputs.node == 'true' || needs.changes.outputs.ci == 'true' }}"
          NODE_RESULT="${{ needs.node.result }}"
          if [ "$NODE_REQUIRED" = "true" ] && [ "$NODE_RESULT" != "success" ]; then
            echo "❌ node: $NODE_RESULT (required)"
            FAILED=true
          else
            echo "✅ node: $NODE_RESULT (required: $NODE_REQUIRED)"
          fi

          DENY_RESULT="${{ needs.deny.result }}"
          if [ "$DENY_RESULT" = "failure" ] || [ "$DENY_RESULT" = "cancelled" ]; then
            echo "❌ deny: $DENY_RESULT"
            FAILED=true
          else
            echo "✅ deny: $DENY_RESULT"
          fi

          if [ "$FAILED" = "true" ]; then
            echo ""
            echo "One or more required CI jobs failed."
            exit 1
          fi

          echo ""
          echo "All required checks passed."
