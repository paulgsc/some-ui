name: PR
# Fast, dep-aware CI for pull requests.
#
# Philosophy (see docs/ci-architecture.md):
#   PR CI answers: "does this change break what it touches?"
#   Trunk CI (trunk.yml) answers: "is the whole repo healthy?"
#
# Filtering strategy:
#   turbo --filter=...[HEAD^1] runs lint/typecheck/test for every package
#   whose files changed AND every package that depends on a changed package
#   (transitively). This is dep-graph-aware — dorny/paths-filter is not.
#
#   Rust uses cargo's --workspace for now; a fine-grained Rust workspace
#   filter would require cargo-hakari or similar. Given Rust compile times,
#   full workspace on any Rust touch is acceptable.
#
# What does NOT run on PR:
#   - Artifact builds (Docker, Pages deploy, AMO signing, WASM publish)
#   - Full trunk health sweep (that's trunk.yml)
#   Extension CI has its own workflow (extension.yml) and is not gated here.
#
# ci-gate is the single required status check. Configure branch protection
# to require only this job, not the individual rust/node jobs (which may be
# skipped when no relevant files changed).
#
# Convention — scoped test:e2e invocations (#1137):
#   A package's `test:e2e` script (`playwright test` with no filter) runs
#   that package's ENTIRE e2e suite, including specs that need a build or a
#   server the step never prepared. A step whose name and trigger paths imply
#   a narrow scope — "E2E — CSP regression (www)" below, for example — must
#   pass explicit spec paths to `test:e2e`, or it inherits those and fails
#   PRs for work they never touched. Any new `test:e2e` step in CI must do
#   the same.
#
# Drafts run only CI Gate, which fails (#2823; docs/ci-architecture.md).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # ── Path detection ──────────────────────────────────────────────────────
  # Coarse-grained: did Rust files change? Node files? CI config?
  # Decides which of the Rust, Node and Deny jobs run. Node filtering within
  # a run is handled by turbo, not by this step.
  changes:
    if: github.event.pull_request.draft != true
    uses: ./.github/workflows/_detect-changes.yml

  # ── Rust CI ────────────────────────────────────────────────────────────
  # Runs on any Rust or CI change. Full workspace — cargo doesn't have
  # a turbo-equivalent dep-aware filter without additional tooling.
  rust:
    name: Rust CI
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/_rust-ci.yml

  # ── Node CI (dep-aware, turbo-filtered) ────────────────────────────────
  # Only runs if Node/TS/CSS files or CI config changed.
  # turbo --filter=...[HEAD^1] scopes work to changed packages + dependents.
  #
  # Four jobs that run in parallel, not one. As a single job every step ran
  # in series (about 11.5 min on #1673), though none needs another's result.
  # Each job repeats the setup and the affected build below (~2.5 min: there
  # is no remote turbo cache to share it), so the wall time is the slowest
  # job instead of the sum. That setup and build is one composite action,
  # .github/actions/node-ci-setup, so the four cannot drift onto different
  # builds. CI Gate requires all four. Each reads the repo and nothing else,
  # so its token is read-only (mobile-apk.yml runs the same setup and build
  # on `contents: read`).
  node-checks:
    name: Node CI / typecheck & repo checks
    needs: changes
    if: needs.changes.outputs.node == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # turbo --filter=[HEAD^1] needs the parent commit to diff against.
          fetch-depth: 2

      # Nix, the install and the affected build, shared by all four jobs.
      - uses: ./.github/actions/node-ci-setup

      # Same filter set as node-ci-setup's build, so the `^build` these tasks now
      # declare in turbo.json (#1454) selects only builds that step already
      # ran: cache hits, not extra work. `!./crates/*` changes nothing today
      # (crates have no typecheck or lint:js script, and no package depends on
      # a crate through `workspace:`), but keeping the three filters identical
      # means a future crate script cannot quietly pull wasm-pack in here.
      - name: Typecheck (affected packages)
        run: |
          nix develop .#ci --command pnpm turbo run typecheck \
            --filter=...[HEAD^1] \
            --filter='!./extensions/**' \
            --filter='!./crates/*' \
            --concurrency=100%

      # What each deployable's build ships (apps/www/build.paths.ts;
      # packages/some-vite-config/AUDIENCES.md, "Paths"): builds every profile
      # the way its deployable does and fails on code off that profile's path,
      # which no other check reads the output to see. Same filters as the
      # steps above, so it runs exactly when www or something www builds from
      # changed, and its `^build` is cache hits from node-ci-setup's build.
      - name: Bundle paths (www)
        run: |
          nix develop .#ci --command pnpm turbo run check:bundle-paths \
            --filter=...[HEAD^1] \
            --filter='!./extensions/**' \
            --filter='!./crates/*'

      # Repo-wide invariant, so not turbo-filtered: a manifest that opts out
      # of the catalog is drift regardless of which package changed. Runs
      # without an install (no dependencies of its own) and is cheap enough
      # not to warrant a filter.
      - name: Dependency catalog guardrail
        run: node scripts/check-catalog-drift.mjs

      # scripts/ belongs to no workspace, so no turbo typecheck reaches the
      # guard scripts CI runs; the root tsconfig.json covers them.
      # RSC1: its core-utils prerequisite must build even when no workspace is affected.
      - name: Typecheck root scripts
        run: |
          nix develop .#ci --command pnpm turbo run build --filter=@some-ui/core-utils
          nix develop .#ci --command pnpm typecheck:scripts

      # Repo-wide invariant like the catalog check above: every packages/ui/*
      # workspace declares its build audience (package.json#someUi). The vite
      # plugin enforces the same thing, but only when www builds - which a PR
      # adding a workspace www does not depend on yet never does. Runs the
      # reader's source through tsx, so there is nothing to build first.
      - name: UI workspace audience guardrail
        run: nix develop .#ci --command pnpm check:ui-manifests

      # Repo-wide invariant like the catalog check above, and not turbo-filtered
      # for the same reason: the client/server boundary is a property of the
      # whole repo, and the snapshot it compares against
      # (packages/contract-harness/routes.server.json) can go stale from a
      # change in the *server* repo that no file here reflects. Only the drift
      # layer runs - it is pure Node string comparison against the checked-in
      # snapshot and needs no file_host. The conformance layer needs a live
      # server and stays a local step; see that package's README.
      - name: Contract drift (client/server boundary)
        run: nix develop .#ci --command pnpm --filter @some-ui/contract-harness contract:drift

      # Unused-export/dependency graph check, same shape as the steps above.
      # A workspace opts in by declaring a `knip` script; turbo only runs the
      # task where the script exists, so widening coverage is a one-line
      # change in that package's manifest rather than an edit here.
      #
      # The script anchors knip at the repo root (`--directory`) and scopes it
      # to the calling package (`--workspace`), because knip invoked with the
      # package as its cwd cannot see the root manifest or knip.json: it then
      # reports every colocated *.test.ts as an unused file and every
      # root-provided binary (tsc, eslint, vitest, …) as unlisted. Anchored,
      # apps/www reports clean; unanchored it reports 23 phantom findings.
      - name: Knip (affected packages)
        run: |
          nix develop .#ci --command pnpm turbo run knip \
            --filter=...[HEAD^1] \
            --filter='!./extensions/**' \
            --concurrency=100%

  node-lint:
    name: Node CI / lint & format
    needs: changes
    if: needs.changes.outputs.node == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # turbo --filter=[HEAD^1] needs the parent commit to diff against.
          fetch-depth: 2
      # Nix, the install and the affected build, shared by all four jobs.
      - uses: ./.github/actions/node-ci-setup

      - name: Lint (affected packages)
        run: |
          nix develop .#ci --command pnpm turbo run lint:js \
            --filter=...[HEAD^1] \
            --filter='!./extensions/**' \
            --filter='!./crates/*' \
            --concurrency=100%

      # Scoped to CSS files actually touched by this PR, not a full-repo
      # sweep — the repo carries pre-existing stylelint debt outside this
      # diff, and a blanket scan would fail PRs on files they never touched.
      # Extensions are excluded (own CI in extension.yml), matching the
      # other steps in this job.
      - name: Lint styles (changed files)
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 -- '*.css' | grep -v '^extensions/' || true)
          if [ -n "$files" ]; then
            nix develop .#ci --command pnpm exec stylelint --allow-empty-input --ignore-path .prettierignore $files
          else
            echo "No package/app CSS files changed."
          fi

      - name: Prettier (affected packages)
        run: |
          nix develop .#ci --command pnpm turbo run prettier \
            --filter=...[HEAD^1] \
            --filter='!./extensions/**' \
            --concurrency=100%

  node-test:
    name: Node CI / unit tests
    needs: changes
    if: needs.changes.outputs.node == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # turbo --filter=[HEAD^1] needs the parent commit to diff against.
          fetch-depth: 2
      # Nix, the install and the affected build, shared by all four jobs.
      - uses: ./.github/actions/node-ci-setup

      - name: Test (affected packages)
        run: |
          nix develop .#ci --command pnpm turbo run test \
            --filter=...[HEAD^1] \
            --filter='!./extensions/**' \
            --concurrency=100%

      # Corpus lint (LTY-FAMILIES A5): "no judgment is allowed unless it can
      # produce its own justification" as a CI failure, the fourth of this
      # repo's data-as-CI-input guardrails (scripts/check-wasm-bindgen-boundary.sh,
      # scripts/check-mutation-boundary.sh, docs/canon/scripts/check-citations.sh
      # are the other three). Turbo-filtered, same shape as the Knip step
      # below: a workspace opts in by declaring a `lint:corpus` script — only
      # packages/ui/leetype declares one today.
      - name: Corpus lint (affected packages)
        run: |
          nix develop .#ci --command pnpm turbo run lint:corpus \
            --filter=...[HEAD^1] \
            --filter='!./extensions/**' \
            --concurrency=100%

      # LTY-PATCH's own guardrail (#1081): "deletions are free" is a claim
      # about the real compiled engine, not the vitest type stub — see
      # scripts/load-real-wasm.ts's doc comment for why the plain `test`
      # step above can never exercise this. Same opt-in shape as the corpus
      # lint step: a workspace opts in by declaring a `test:deletions-are-free`
      # script — only packages/ui/leetype declares one today.
      - name: Deletions-are-free guardrail (affected packages)
        run: |
          nix develop .#ci --command pnpm turbo run test:deletions-are-free \
            --filter=...[HEAD^1] \
            --filter='!./extensions/**' \
            --concurrency=100%
      - name: Test release track boundaries (RT1)
        run: nix develop .#ci --command node --test scripts/release/release.test.mjs

  node-e2e:
    name: Node CI / e2e
    needs: changes
    if: needs.changes.outputs.node == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # turbo --filter=[HEAD^1] needs the parent commit to diff against.
          fetch-depth: 2
      # Nix, the install and the affected build, shared by all four jobs.
      - uses: ./.github/actions/node-ci-setup

      # public/sw.js is the one file in apps/www that nothing else checks: a
      # plain public/ asset, never bundled, never imported, never type-checked,
      # and unreachable from vitest. This drives it in a real Chromium with a
      # real push, so a typo in it fails here instead of shipping as a study
      # reminder that silently never arrives. Scoped like the CSP step below,
      # because it is a behavioural invariant of specific files rather than a
      # per-package test turbo's dep graph would select.
      - name: E2E — study-nudge service worker (www)
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 -- \
            'apps/www/public/sw.js' \
            'apps/www/tests/study-nudge/**' \
            'apps/www/src/lib/study-nudge/**' || true)
          if [ -n "$files" ]; then
            nix develop .#ci-playwright --command pnpm --filter www test:sw
          else
            echo "No service-worker files changed."
          fi

      # docs/ui-fit calls its Playwright layer "the actual gate", and until #899
      # nothing ran it: it lived behind `pnpm test:ui-fit`, which no workflow
      # invoked, so a panel could paint outside its rect for months with every
      # check green. This runs its specs.
      #
      # Scoped to PRs that touch UI or what www builds it with. The registry
      # is in the trigger set on purpose - binding a new key delegates size
      # authority to a component the panel sweep has never measured. So are
      # www's build config and the manifests and lockfile: the fixture pages
      # (tests/ui-fit/panel-page, and phone-page for every phone screen the
      # sweeps and the stays-put walks open) are built with www's own Vite
      # config and stylesheets, so a Tailwind, Vite or React bump changes
      # what they measure.
      - name: E2E — content fits its box, and stays put (panels, launcher, exercise shell, incident session, Jobs cards, Studio's phone screens, code card, the weekly call's frame, drag-down indicator, My data, Rust Rounds, take pattern, and every walked phone screen)
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 -- \
            'packages/ui/**' \
            'packages/some-content-registry/**' \
            'packages/some-styles/**' \
            'packages/video-render/src/call*.ts' \
            'infra/render/Dockerfile' \
            'apps/www/src/**' \
            'apps/www/tests/ui-fit/**' \
            'apps/www/vite.config.ts' \
            'apps/www/style.context.ts' \
            'apps/www/build.profiles.ts' \
            'apps/www/index.html' \
            'apps/www/package.json' \
            'apps/www/playwright.config.ts' \
            'package.json' \
            'pnpm-lock.yaml' || true)
          if [ -n "$files" ]; then
            # www's dependencies only: the fixture pages are their own builds
            # (build:fit, build:fit-phone), not www's, so building www itself
            # here is waste.
            nix develop .#ci --command pnpm turbo run build \
              --filter='www^...' \
              --concurrency=100%

            nix develop .#ci --command pnpm --filter www build:fit
            nix develop .#ci --command pnpm --filter www build:fit-phone
            # Run both, then fail on either: a nix failure must not hide
            # whether the call's frame held.
            status=0
            nix develop .#ci-playwright --command \
              pnpm --filter www test:e2e \
                tests/ui-fit/panel-fit.spec.ts \
                tests/ui-fit/launcher-fit.spec.ts \
                tests/ui-fit/exercise-shell-fit.spec.ts \
                tests/ui-fit/incident-fit.spec.ts \
                tests/ui-fit/jobs-status-fit.spec.ts \
                tests/ui-fit/code-card-fit.spec.ts \
                tests/ui-fit/studio-fit.spec.ts \
                tests/ui-fit/pull-fit.spec.ts \
                tests/ui-fit/settings-bar-fit.spec.ts \
                tests/ui-fit/my-data-fit.spec.ts \
                tests/ui-fit/intent-failure-fit.spec.ts \
                tests/ui-fit/rust-rounds-fit.spec.ts \
                tests/ui-fit/take-pattern-fit.spec.ts \
                tests/ui-fit/stays-put.spec.ts \
                tests/ui-fit/stays-put-rounds.spec.ts \
                tests/ui-fit/stays-put-soundbites.spec.ts \
                tests/ui-fit/stays-put-topik.spec.ts \
                tests/ui-fit/stays-put-www.spec.ts || status=$?

            # The weekly call's frame (CF1) is measured in the face home
            # draws it in: inside the Playwright image home's render image is
            # built FROM (infra/render/Dockerfile, read here so the two never
            # differ), whose sans is WenQuanYi Zen Hei. Under nix the frame
            # draws another, wider face the model isn't calibrated on.
            image=$(sed -n 's/^FROM \(mcr\.microsoft\.com\/playwright[^ ]*\).*/\1/p' infra/render/Dockerfile)
            docker run --rm -e CI=true -e HOME=/tmp \
              --user "$(id -u):$(id -g)" \
              -v "$PWD:$PWD" -w "$PWD/apps/www" "$image" \
              node_modules/.bin/playwright test --config playwright.config.ts \
                --trace off tests/ui-fit/call-fit.spec.ts || status=$?
            exit "$status"
          else
            echo "No UI files changed."
          fi

      # Scoped to the CSP/nginx config surface actually touched by this PR -
      # this is a config invariant (apps/www/nginx.security-headers.conf),
      # not a per-package build/test, so turbo's dep-graph filter doesn't
      # apply the way it does to the steps above. Regression coverage for
      # #660 (www's CSP header blocked WebAssembly instantiation).
      #
      # The spec argument is load-bearing: see "scoped test:e2e invocations"
      # at the top of this file.
      - name: E2E — CSP regression (www)
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 -- \
            'apps/www/Dockerfile' \
            'apps/www/nginx*.conf' \
            'apps/www/tests/csp/**' \
            'apps/www/playwright.config.ts' || true)
          if [ -n "$files" ]; then
            nix develop .#ci-playwright --command pnpm --filter www test:e2e \
              tests/csp/csp.spec.ts
          else
            echo "No CSP-relevant www files changed."
          fi

      # What the BUILT app sends when a learner has chosen the device (LA1/LA4,
      # docs/learner-data-authority.md). The unit tests prove each module asks
      # the authority first; only a browser running the output can show that
      # nothing else in the bundle sends. Two builds, because the two claims
      # are about different ones: the lan build with a stand-in file_host
      # (corpus reads only, no cookie, sessions survive a reload with it down),
      # and the Pages build (its connect-src policy is present and enforced).
      #
      # The spec fails, not skips, when a build is missing under CI, so a
      # broken build step cannot turn this into a green run that measured
      # nothing. Scoped to the source that can change what leaves the page.
      - name: E2E — local mode sends nothing operator-bound (www)
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 -- \
            'apps/www/src/**' \
            'apps/www/tests/local-mode/**' \
            'apps/www/vite.config.ts' \
            'apps/www/index.html' \
            'apps/www/resume/index.html' \
            'apps/www/build.profiles.ts' \
            'apps/www/playwright.config.ts' \
            'packages/fetch-kit/**' \
            'packages/server-routes/**' || true)
          if [ -n "$files" ]; then
            nix develop .#ci --command pnpm turbo build --filter=www... --concurrency=100%
            nix develop .#ci --command env \
              SOME_UI_PROFILE=pages VITE_STATIC_DATA=true VITE_BASE_PATH=/some-ui/ \
              pnpm --filter www exec vite build --outDir dist-pages --emptyOutDir
            nix develop .#ci-playwright --command env \
              WWW_DIST_LAN=apps/www/dist WWW_DIST_PAGES=apps/www/dist-pages \
              pnpm --filter www test:e2e tests/local-mode/no-egress.spec.ts
          else
            echo "No files that decide what the built app sends changed."
          fi

      # #1193's own review flagged that this directory - both the sessions
      # badge/completion-summary regression and the session-viewport overflow
      # spec that predates it - ran nowhere in CI: no workflow named either
      # spec, so both could fail indefinitely without blocking a PR. Same
      # shape as the CSP step above (a static-fixture Playwright spec, no
      # build needed), scoped to the source these two specs mirror
      # rather than turbo's dep graph, since neither is a per-package
      # build/test.
      - name: E2E — session-viewport regression (www)
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 -- \
            'apps/www/tests/session-viewport/**' \
            'apps/www/tests/layout-invariants/**' \
            'apps/www/src/routes/_dashboard.tsx' \
            'apps/www/src/routes/_dashboard/sessions/**' \
            'apps/www/src/components/player/**' \
            'apps/www/src/test-support/catalog-worst-case.ts' \
            'packages/activity-catalog/**' \
            'packages/ui/shared/src/components/ui/badge.tsx' \
            'packages/ui/shared/src/components/ui/button.tsx' \
            'apps/www/tsconfig.json' \
            'apps/www/playwright.config.ts' || true)
          if [ -n "$files" ]; then
            nix develop .#ci-playwright --command pnpm --filter www test:e2e \
              tests/session-viewport/no-overflow-scroll.spec.ts \
              tests/session-viewport/sessions-badge-containment.spec.ts
          else
            echo "No session-viewport-relevant www files changed."
          fi

      # A Codex review on #1294 found this suite ran nowhere in CI - every
      # e2e step in this job scopes `test:e2e` to explicit spec paths (see
      # the convention note at the top of this file), and this spec was
      # never named, so the pager/bounded-composer regressions it covers
      # could return with every required check still green. Unlike every
      # other step here, this spec drives the actual running app rather
      # than the panel page or a static fixture - `tests/composer/
      # harness.ts` spawns `vite` itself and waits for it, so no separate
      # server-start step is needed. Scoped to the composer, dashboard shell,
      # and fitted-page surfaces the spec actually exercises.
      - name: E2E — composer regression (www)
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 -- \
            'apps/www/src/components/composer/**' \
            'apps/www/src/routes/_dashboard.tsx' \
            'apps/www/src/routes/_dashboard/sessions/new.tsx' \
            'packages/react-hooks/src/lib/use-fitted-page/**' \
            'apps/www/tests/composer/**' \
            'apps/www/playwright.config.ts' || true)
          if [ -n "$files" ]; then
            nix develop .#ci-playwright --command pnpm --filter www test:e2e \
              tests/composer/pager.spec.ts
          else
            echo "No composer-relevant www files changed."
          fi

      # The burn-in recorder (STUDIO ST15, #2273): nothing else drives the page
      # the renderer records from. What it checks is in the spec's header.
      - name: E2E — burn-in recorder (www)
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 -- \
            'packages/ui/burn-ins/**' \
            'packages/video-render/**' \
            'apps/www/tests/record/**' \
            'apps/www/src/lib/web-surface/burn-ins/**' \
            'apps/www/playwright.config.ts' \
            'flake.nix' \
            'flake.lock' \
            'nix/video/**' || true)
          if [ -n "$files" ]; then
            nix develop .#ci --command pnpm turbo build --filter=www... --concurrency=100%
            nix develop .#ci-playwright --command pnpm --filter www test:e2e \
              tests/record/short.spec.ts
          else
            echo "No burn-in or renderer files changed."
          fi

      # HYPER1 (#2724): HyperFrames draws a composition to the same bytes
      # twice with the pins in packages/video-motion/src/pin.ts, on the nix
      # shell's Chromium and ffmpeg. Scoped to the workspace, the renderer it
      # imports, and the lockfile and flake, which pin HyperFrames, Chromium and
      # ffmpeg. Uploads nothing. Five runs; one that differs prints where, per
      # frame (#2739).
      - name: E2E — HyperFrames renders the same bytes twice (video-motion)
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 -- \
            'packages/video-motion/**' \
            'packages/video-render/**' \
            'extensions/suspender-ledger/**' \
            'pnpm-lock.yaml' \
            'flake.nix' \
            'flake.lock' \
            'nix/video/**' || true)
          if [ -n "$files" ]; then
            nix develop .#ci --command pnpm turbo run build \
              --filter='@some-ui/video-motion^...' \
              --concurrency=100%
            nix develop .#ci-playwright --command \
              pnpm --filter @some-ui/video-motion motion prove sample --runs 5
            # HYPER2 (#2725): a composition scene beside a card, through the
            # renderer, drawn twice from nothing. In a copy: it writes there.
            cp -r packages/video-motion/sample/video "$RUNNER_TEMP/video"
            nix develop .#ci-playwright --command \
              pnpm --filter @some-ui/video-motion motion video "$RUNNER_TEMP/video" --prove
            # HYPER3 (#2726): Suspender Ledger 0.3.1's promo, from its data in
            # paulgsc/testing at a pinned commit: the popup walked once in its
            # sandbox, then the promo rendered twice from nothing.
            data="$RUNNER_TEMP/promo-data"
            mkdir -p "$data"
            for file in release sample; do
              curl -fsSL -o "$data/$file.json" \
                "https://raw.githubusercontent.com/paulgsc/testing/853627e77d31499e81d16b3f48d9ae77b3237f46/promo/suspender-ledger/0.3.1/$file.json"
            done
            # HYPER4 (#2727): its series pins the sound kit, made here as
            # home makes it, so a changed cue fails the render.
            nix develop .#ci-playwright --command \
              pnpm --filter @some-ui/video-render render sounds --out "$RUNNER_TEMP/brand/sounds"
            nix develop .#ci-playwright --command \
              pnpm --filter @some-ui/video-motion motion promo "$data" --out "$RUNNER_TEMP/promo" --brand "$RUNNER_TEMP/brand" --prove
          else
            echo "No files a composition's render reads changed."
          fi

      # MIC9 (#2379): the real recorder (packages/voice-capture's recorder.ts:
      # getUserMedia, MediaRecorder, the level meter), which every other test
      # replaces. Chromium plays a committed clip as its microphone, the page
      # plays each case on the real take kit and then on the simulated
      # microphone, and a case fails when the two end differently. Scoped to
      # the package, intent-kit (the recorder's opening waits through its
      # callForeign), and the lockfile and flake, which pin Playwright and the
      # Chromium it drives (_detect-changes.yml lists the clips under `node`
      # and flake.lock under `ci`, so this job runs for both). Its page is its
      # own Vite build, so only voice-capture's dependencies are built here.
      # The spec path is passed, per "scoped test:e2e invocations" above.
      # Uploads nothing.
      - name: E2E — the real recorder agrees with the simulated microphone (voice-capture)
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 -- \
            'packages/voice-capture/**' \
            'packages/intent-kit/**' \
            'pnpm-lock.yaml' \
            'flake.lock' || true)
          if [ -n "$files" ]; then
            nix develop .#ci --command pnpm turbo run build \
              --filter='@some-ui/voice-capture^...' \
              --concurrency=100%
            nix develop .#ci-playwright --command \
              pnpm --filter @some-ui/voice-capture test:e2e \
                tests/real-microphone/real-microphone.spec.ts
          else
            echo "No files the real recorder's suite runs on changed."
          fi

  # ── The render image's build (RI3) ───────────────────────────────────
  # infra/render/build.sh, the Dockerfile's whole build, from the Dockerfile's
  # own base image (its FROM line) and the same `COPY . .` of this checkout,
  # which has no dist/. The context passes through the image's own
  # infra/render/Dockerfile.dockerignore, copied beside the generated
  # Dockerfile, where BuildKit reads it in place of the root .dockerignore.
  # Only the ffmpeg layer is left out. Runs on the paths that publish the
  # image. Nothing else builds the stage through the image's filters alone,
  # so without it a broken image shows first on `main`. Pushes nothing and
  # stores nothing.
  render-stage:
    name: Render image / the stage builds from nothing (RI3)
    needs: changes
    if: needs.changes.outputs.render == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build the image's packages and its stage
        run: |
          set -euo pipefail
          base=$(sed -n 's/^FROM //p' infra/render/Dockerfile)
          printf '%s\n' \
            "FROM $base" \
            'WORKDIR /opt/some-ui' \
            'COPY . .' \
            'RUN corepack enable && sh infra/render/build.sh && test -f apps/www/out/stage/index.html' \
            > "$RUNNER_TEMP/stage.Dockerfile"
          cp infra/render/Dockerfile.dockerignore "$RUNNER_TEMP/stage.Dockerfile.dockerignore"
          docker build --file "$RUNNER_TEMP/stage.Dockerfile" .

  # ── Dependency license audit ────────────────────────────────────────────
  deny:
    name: Deny Checks
    needs: changes
    if: >
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.node == 'true' ||
      needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/_deny-checks.yml
    with:
      rust: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' }}
      node: ${{ needs.changes.outputs.node == 'true' || needs.changes.outputs.ci == 'true' }}

  # ── Repo guards (repo-wide) ────────────────────────────────────────────
  # Every repo-wide guard, one named step each (docs/ci-architecture.md). No
  # `changes` gate: each invariant spans every workspace and file type, and
  # several read files no path filter covers. The scripts run on Node's
  # built-in type stripping, with no full install.
  #
  # No step may carry `if:` or `continue-on-error:`: check:policy-docs counts
  # a Held by check only from such a step.
  #
  # Full history: commit-trailers needs every commit, and it brings
  # origin/<base>, which every `--base` reads. origin/<base> is the base's tip
  # now: a commit main gained after the event and the branch merged in is
  # main's, not the PR's.
  guards:
    name: Repo guards
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # CN1 (docs/canon/scripts/check-citations.sh): every canon lives in
      # docs/canon and every cited canon path resolves. Bash and git only.
      - name: Check canon citations
        run: bash docs/canon/scripts/check-citations.sh
      - name: Self-test the canon check
        run: bash docs/canon/scripts/check-citations.test.sh

      - uses: ./.github/actions/nix-setup

      # At most one *.test.* per source directory, none in a src/routes/ tree
      # outside __tests__/ (#772, #1475). A script rather than an ESLint rule
      # because the verdict for one file depends on its siblings, which
      # `eslint --cache` cannot see (packages/eslint/src/test-layout.ts).
      - name: Check test layout
        run: nix develop .#ci --command node scripts/check-test-layout.ts

      # Artifact retention (CLAUDE.md "Workflow storage") and the RS1
      # fingerprint and RS2 branch-name checks (CLAUDE.md "Cross-repo coupling").
      - name: Check workflows
        run: nix develop .#ci --command node scripts/check-workflows.ts

      # CLAUDE.md, "Gray-area invariants": every declaration has its parts, no
      # ID is reused or dropped, debt labels name their issue and do not grow,
      # the paths and headings CLAUDE.md, REVIEW.md and AGENTS.md name exist,
      # each Held by line's check runs here, and AGENTS.md's digest matches
      # REVIEW.md. A script rather than an ESLint rule because it reads other
      # files (packages/eslint/src/policy-docs.ts).
      - name: Check the policy documents
        env:
          BASE_REF: ${{ github.base_ref }}
        run: nix develop .#ci --command node scripts/check-policy-docs.ts --base "origin/$BASE_REF"

      # ST37 (#2637, #2976): docs/calls/, one file per call named for its id,
      # each in shape, and that the record only grew since the base's
      # (packages/eslint/src/calls.ts).
      - name: Check the calls record
        env:
          BASE_REF: ${{ github.base_ref }}
        run: nix develop .#ci --command node scripts/check-calls.ts --base "origin/$BASE_REF"

      # docs/operational-assurance.md: the ledger's shape, proofs and issues,
      # that every server route module is placed, and the ratchet against the
      # base branch's ledger, so a promise is never weakened without an
      # amendment.
      - name: Check the assurance ledger
        env:
          BASE_REF: ${{ github.base_ref }}
        run: nix develop .#ci --command node scripts/check-assurance.ts --base "origin/$BASE_REF"

      # GC1 (scripts/check-branch-rules.ts); also daily in branch-rules.yml.
      - name: Check that main still requires its checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix develop .#ci --command node scripts/check-branch-rules.ts

      # CLAUDE.md, "The phone and the desktop web are separate surfaces": the
      # Apple-only tokens in packages/eslint/src/android-only.ts appear in no
      # source, markup or path name, a workflow included.
      - name: Check the Android-only tokens
        run: nix develop .#ci --command node scripts/check-android-only.ts

      # GES5 (packages/ui/shared/src/lib/pager): on the phone, a touch or
      # pointer handler lives only in the shared pager's runtime and the
      # pull's, and a PageControls comes with the pager
      # (packages/eslint/src/gestures.ts).
      - name: Check the phone's gestures
        run: nix develop .#ci --command node scripts/check-gestures.ts

      # scripts/check-commit-trailers.ts over every commit the PR adds; the
      # commit-msg hook runs it only where husky is installed.
      - name: Check every commit's trailers
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: nix develop .#ci --command node scripts/check-commit-trailers.ts "origin/$BASE_REF..$HEAD_SHA"

      # scripts/sync-toolchain.sh --check: either side can move alone (a
      # flake.lock bump, a hand edit of .nvmrc), and a hand edit of a copy is
      # the drift this exists to catch. It only evaluates the flake.
      - name: Check toolchain pins match the flake
        run: scripts/sync-toolchain.sh --check

      - uses: ./.github/actions/pnpm-cache
      # Why not node-ci-setup: it installs the whole workspace, and R1, F1 and
      # HS3 below need only the TypeScript parser, from this one package.
      - name: Install the eslint kit
        run: nix develop .#ci --command pnpm install --frozen-lockfile --prefer-offline --filter @some-ui/eslint-kit

      # R1 (docs/monorepo-boundaries.md, "Inside a React package"): every React
      # module that awaits or chains a promise is listed in
      # scripts/react-coordination.allowlist with its exact count.
      - name: Check React coordination
        env:
          BASE_REF: ${{ github.base_ref }}
        run: nix develop .#ci --command node scripts/check-react-coordination.ts --base "origin/$BASE_REF"
      # F1 (docs/monorepo-boundaries.md, "A port translates: the foreign
      # boundary"): the same kind of count, over waits on foreign APIs.
      - name: Check the foreign boundary
        env:
          BASE_REF: ${{ github.base_ref }}
        run: nix develop .#ci --command node scripts/check-foreign-boundary.ts --base "origin/$BASE_REF"
      # HS3 (docs/ui-fit/README.md, "2j"): the same kind of count, over error
      # and status lines a phone surface mounts on a condition.
      - name: Check that a tap moves nothing
        env:
          BASE_REF: ${{ github.base_ref }}
        run: nix develop .#ci --command node scripts/check-stays-put.ts --base "origin/$BASE_REF"
      # WS1 (docs/ci-architecture.md, "Inputs reach the shell as data"): the
      # manual sign workflow runs its extension input only as data. Here, not
      # only in node-test, whose affected-package filter skips a change to the
      # workflow alone.
      - name: Check the manual sign workflow's input
        run: nix develop .#ci --command pnpm --filter @some-ui/eslint-kit exec vitest run tests/extension-sign-inputs.test.ts

  # ── CI Gate ────────────────────────────────────────────────────────────
  # A job whose `needs` fails is skipped, not failed, so the gate judges each
  # result itself. `allowed-skips`: the jobs whose `if:` skips them for an
  # unchanged area. `changes` must succeed: if it fails, everything gated on
  # it skips.
  #
  # `always()`, not `!cancelled()`: a skipped required check counts as
  # passed, so a gate that skipped on a cancelled run would read green on the
  # current head. The cost is a red gate on a head a newer push superseded.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        rust,
        node-checks,
        node-lint,
        node-test,
        node-e2e,
        render-stage,
        deny,
        guards,
      ]
    if: always()
    permissions: {}
    steps:
      # See `on:`.
      - name: Drafts are not verified
        if: github.event.pull_request.draft
        run: |
          echo "::error::Draft pull request: CI runs once it is marked ready for review."
          exit 1
      - uses: re-actors/alls-green@v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: rust, node-checks, node-lint, node-test, node-e2e, render-stage, deny
