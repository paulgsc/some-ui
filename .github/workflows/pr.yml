name: PR
# Fast, dep-aware CI for pull requests.
#
# Philosophy (see docs/ci-architecture.md):
#   PR CI answers: "does this change break what it touches?"
#   Trunk CI (trunk.yml) answers: "is the whole repo healthy?"
#
# Filtering strategy:
#   turbo --filter=...[HEAD^1] runs lint/typecheck/test for every package
#   whose files changed AND every package that depends on a changed package
#   (transitively). This is dep-graph-aware — dorny/paths-filter is not.
#
#   Rust uses cargo's --workspace for now; a fine-grained Rust workspace
#   filter would require cargo-hakari or similar. Given Rust compile times,
#   full workspace on any Rust touch is acceptable.
#
# What does NOT run on PR:
#   - Artifact builds (Docker, Pages deploy, AMO signing, WASM publish)
#   - Full trunk health sweep (that's trunk.yml)
#   Extension CI has its own workflow (extension.yml) and is not gated here.
#
# ci-gate is the single required status check. Configure branch protection
# to require only this job, not the individual rust/node jobs (which may be
# skipped when no relevant files changed).
#
# Convention — scoped test:e2e invocations (#1137):
#   A package's `test:e2e` script (`playwright test` with no filter) runs
#   that package's ENTIRE e2e suite, including specs that need a build or a
#   server the step never prepared. A step whose name and trigger paths imply
#   a narrow scope — "E2E — CSP regression (www)" below, for example — must
#   pass explicit spec paths to `test:e2e`, or it inherits those and fails
#   PRs for work they never touched. Any new `test:e2e` step in CI must do
#   the same.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # ── Path detection ──────────────────────────────────────────────────────
  # Coarse-grained: did Rust files change? Node files? CI config?
  # Used only to decide whether to run the Rust job and for the ci-gate
  # logic. Node filtering is handled by turbo, not by this step.
  changes:
    uses: ./.github/workflows/_detect-changes.yml

  # ── Rust CI ────────────────────────────────────────────────────────────
  # Runs on any Rust or CI change. Full workspace — cargo doesn't have
  # a turbo-equivalent dep-aware filter without additional tooling.
  rust:
    name: Rust CI
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/_rust-ci.yml

  # ── Node CI (dep-aware, turbo-filtered) ────────────────────────────────
  # Only runs if Node/TS/CSS files or CI config changed.
  # turbo --filter=...[HEAD^1] scopes work to changed packages + dependents.
  #
  # Four jobs that run in parallel, not one. As a single job every step ran
  # in series (about 11.5 min on #1673), though none needs another's result.
  # Each job repeats the setup and the affected build below (~2.5 min: there
  # is no remote turbo cache to share it), so the wall time is the slowest
  # job instead of the sum. That setup and build is one composite action,
  # .github/actions/node-ci-setup, so the four cannot drift onto different
  # builds. CI Gate requires all four. Each reads the repo and nothing else,
  # so its token is read-only (mobile-apk.yml runs the same setup and build
  # on `contents: read`).
  node-checks:
    name: Node CI / typecheck & repo checks
    needs: changes
    if: needs.changes.outputs.node == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # turbo --filter=[HEAD^1] needs the parent commit to diff against.
          fetch-depth: 2

      # Nix, the install and the affected build, shared by all four jobs.
      - uses: ./.github/actions/node-ci-setup

      # Same filter set as node-ci-setup's build, so the `^build` these tasks now
      # declare in turbo.json (#1454) selects only builds that step already
      # ran: cache hits, not extra work. `!./crates/*` changes nothing today
      # (crates have no typecheck or lint:js script, and no package depends on
      # a crate through `workspace:`), but keeping the three filters identical
      # means a future crate script cannot quietly pull wasm-pack in here.
      - name: Typecheck (affected packages)
        run: |
          nix develop .#ci --command pnpm turbo run typecheck \
            --filter=...[HEAD^1] \
            --filter='!./extensions/**' \
            --filter='!./crates/*' \
            --concurrency=100%

      # What each deployable's build ships (apps/www/build.paths.ts;
      # packages/some-vite-config/AUDIENCES.md, "Paths"): builds every profile
      # the way its deployable does and fails on code off that profile's path,
      # which no other check reads the output to see. Same filters as the
      # steps above, so it runs exactly when www or something www builds from
      # changed, and its `^build` is cache hits from node-ci-setup's build.
      - name: Bundle paths (www)
        run: |
          nix develop .#ci --command pnpm turbo run check:bundle-paths \
            --filter=...[HEAD^1] \
            --filter='!./extensions/**' \
            --filter='!./crates/*'

      # Repo-wide invariant, so not turbo-filtered: a manifest that opts out
      # of the catalog is drift regardless of which package changed. Runs
      # without an install (no dependencies of its own) and is cheap enough
      # not to warrant a filter.
      - name: Dependency catalog guardrail
        run: node scripts/check-catalog-drift.mjs

      # Repo-wide invariant like the catalog check above: every packages/ui/*
      # workspace declares its build audience (package.json#someUi). The vite
      # plugin enforces the same thing, but only when www builds - which a PR
      # adding a workspace www does not depend on yet never does. Runs the
      # reader's source through tsx, so there is nothing to build first.
      - name: UI workspace audience guardrail
        run: nix develop .#ci --command pnpm check:ui-manifests

      # Repo-wide invariant like the catalog check above, and not turbo-filtered
      # for the same reason: the client/server boundary is a property of the
      # whole repo, and the snapshot it compares against
      # (packages/contract-harness/routes.server.json) can go stale from a
      # change in the *server* repo that no file here reflects. Only the drift
      # layer runs - it is pure Node string comparison against the checked-in
      # snapshot and needs no file_host. The conformance layer needs a live
      # server and stays a local step; see that package's README.
      - name: Contract drift (client/server boundary)
        run: nix develop .#ci --command pnpm --filter @some-ui/contract-harness contract:drift

      # Unused-export/dependency graph check, same shape as the steps above.
      # A workspace opts in by declaring a `knip` script; turbo only runs the
      # task where the script exists, so widening coverage is a one-line
      # change in that package's manifest rather than an edit here.
      #
      # The script anchors knip at the repo root (`--directory`) and scopes it
      # to the calling package (`--workspace`), because knip invoked with the
      # package as its cwd cannot see the root manifest or knip.json: it then
      # reports every colocated *.test.ts as an unused file and every
      # root-provided binary (tsc, eslint, vitest, …) as unlisted. Anchored,
      # apps/www reports clean; unanchored it reports 23 phantom findings.
      - name: Knip (affected packages)
        run: |
          nix develop .#ci --command pnpm turbo run knip \
            --filter=...[HEAD^1] \
            --filter='!./extensions/**' \
            --concurrency=100%

  node-lint:
    name: Node CI / lint & format
    needs: changes
    if: needs.changes.outputs.node == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # turbo --filter=[HEAD^1] needs the parent commit to diff against.
          fetch-depth: 2
      # Nix, the install and the affected build, shared by all four jobs.
      - uses: ./.github/actions/node-ci-setup

      - name: Lint (affected packages)
        run: |
          nix develop .#ci --command pnpm turbo run lint:js \
            --filter=...[HEAD^1] \
            --filter='!./extensions/**' \
            --filter='!./crates/*' \
            --concurrency=100%

      # Scoped to CSS files actually touched by this PR, not a full-repo
      # sweep — the repo carries pre-existing stylelint debt outside this
      # diff, and a blanket scan would fail PRs on files they never touched.
      # Extensions are excluded (own CI in extension.yml), matching the
      # other steps in this job.
      - name: Lint styles (changed files)
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 -- '*.css' | grep -v '^extensions/' || true)
          if [ -n "$files" ]; then
            nix develop .#ci --command pnpm exec stylelint --allow-empty-input --ignore-path .prettierignore $files
          else
            echo "No package/app CSS files changed."
          fi

      - name: Prettier (affected packages)
        run: |
          nix develop .#ci --command pnpm turbo run prettier \
            --filter=...[HEAD^1] \
            --filter='!./extensions/**' \
            --concurrency=100%

  node-test:
    name: Node CI / unit tests
    needs: changes
    if: needs.changes.outputs.node == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # turbo --filter=[HEAD^1] needs the parent commit to diff against.
          fetch-depth: 2
      # Nix, the install and the affected build, shared by all four jobs.
      - uses: ./.github/actions/node-ci-setup

      - name: Test (affected packages)
        run: |
          nix develop .#ci --command pnpm turbo run test \
            --filter=...[HEAD^1] \
            --filter='!./extensions/**' \
            --concurrency=100%

      # Corpus lint (LTY-FAMILIES A5): "no judgment is allowed unless it can
      # produce its own justification" as a CI failure, the fourth of this
      # repo's data-as-CI-input guardrails (scripts/check-wasm-bindgen-boundary.sh,
      # scripts/check-mutation-boundary.sh, docs/canon/scripts/check-citations.sh
      # are the other three). Turbo-filtered, same shape as the Knip step
      # below: a workspace opts in by declaring a `lint:corpus` script — only
      # packages/ui/leetype declares one today.
      - name: Corpus lint (affected packages)
        run: |
          nix develop .#ci --command pnpm turbo run lint:corpus \
            --filter=...[HEAD^1] \
            --filter='!./extensions/**' \
            --concurrency=100%

      # LTY-PATCH's own guardrail (#1081): "deletions are free" is a claim
      # about the real compiled engine, not the vitest type stub — see
      # scripts/load-real-wasm.ts's doc comment for why the plain `test`
      # step above can never exercise this. Same opt-in shape as the corpus
      # lint step: a workspace opts in by declaring a `test:deletions-are-free`
      # script — only packages/ui/leetype declares one today.
      - name: Deletions-are-free guardrail (affected packages)
        run: |
          nix develop .#ci --command pnpm turbo run test:deletions-are-free \
            --filter=...[HEAD^1] \
            --filter='!./extensions/**' \
            --concurrency=100%

  node-e2e:
    name: Node CI / e2e
    needs: changes
    if: needs.changes.outputs.node == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # turbo --filter=[HEAD^1] needs the parent commit to diff against.
          fetch-depth: 2
      # Nix, the install and the affected build, shared by all four jobs.
      - uses: ./.github/actions/node-ci-setup

      # public/sw.js is the one file in apps/www that nothing else checks: a
      # plain public/ asset, never bundled, never imported, never type-checked,
      # and unreachable from vitest. This drives it in a real Chromium with a
      # real push, so a typo in it fails here instead of shipping as a study
      # reminder that silently never arrives. Scoped like the CSP step below,
      # because it is a behavioural invariant of specific files rather than a
      # per-package test turbo's dep graph would select.
      - name: E2E — study-nudge service worker (www)
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 -- \
            'apps/www/public/sw.js' \
            'apps/www/tests/study-nudge/**' \
            'apps/www/src/lib/study-nudge/**' || true)
          if [ -n "$files" ]; then
            nix develop .#ci-playwright --command pnpm --filter www test:sw
          else
            echo "No service-worker files changed."
          fi

      # docs/ui-fit calls its Playwright layer "the actual gate", and until #899
      # nothing ran it: it lived behind `pnpm test:ui-fit`, which no workflow
      # invoked, so a panel could paint outside its rect for months with every
      # check green. This runs all three of its specs.
      #
      # Scoped to PRs that touch UI or what www builds it with. The registry
      # is in the trigger set on purpose - binding a new key delegates size
      # authority to a component the panel sweep has never measured. So are
      # www's build config and the manifests and lockfile: the panel page
      # (tests/ui-fit/panel-page) is built with www's own Vite config and
      # stylesheets, so a Tailwind, Vite or React bump changes what it
      # measures.
      - name: E2E — content fits its box (panels, launcher, exercise shell)
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 -- \
            'packages/ui/**' \
            'packages/some-content-registry/**' \
            'packages/some-styles/**' \
            'apps/www/src/**' \
            'apps/www/tests/ui-fit/**' \
            'apps/www/vite.config.ts' \
            'apps/www/style.context.ts' \
            'apps/www/build.profiles.ts' \
            'apps/www/index.html' \
            'apps/www/package.json' \
            'apps/www/playwright.config.ts' \
            'package.json' \
            'pnpm-lock.yaml' || true)
          if [ -n "$files" ]; then
            # www's dependencies only: the panel page is its own build
            # (build:fit), not www's, so building www itself here is waste.
            nix develop .#ci --command pnpm turbo run build \
              --filter='www^...' \
              --concurrency=100%

            nix develop .#ci --command pnpm --filter www build:fit
            nix develop .#ci-playwright --command \
              pnpm --filter www test:e2e \
                tests/ui-fit/panel-fit.spec.ts \
                tests/ui-fit/launcher-fit.spec.ts \
                tests/ui-fit/exercise-shell-fit.spec.ts
          else
            echo "No UI files changed."
          fi

      # Scoped to the CSP/nginx config surface actually touched by this PR -
      # this is a config invariant (apps/www/nginx.security-headers.conf),
      # not a per-package build/test, so turbo's dep-graph filter doesn't
      # apply the way it does to the steps above. Regression coverage for
      # #660 (www's CSP header blocked WebAssembly instantiation).
      #
      # The spec argument is load-bearing: see "scoped test:e2e invocations"
      # at the top of this file.
      - name: E2E — CSP regression (www)
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 -- \
            'apps/www/Dockerfile' \
            'apps/www/nginx*.conf' \
            'apps/www/tests/csp/**' \
            'apps/www/playwright.config.ts' || true)
          if [ -n "$files" ]; then
            nix develop .#ci-playwright --command pnpm --filter www test:e2e \
              tests/csp/csp.spec.ts
          else
            echo "No CSP-relevant www files changed."
          fi

      # What the BUILT app sends when a learner has chosen the device (LA1/LA4,
      # docs/learner-data-authority.md). The unit tests prove each module asks
      # the authority first; only a browser running the output can show that
      # nothing else in the bundle sends. Two builds, because the two claims
      # are about different ones: the lan build with a stand-in file_host
      # (corpus reads only, no cookie, sessions survive a reload with it down),
      # and the Pages build (its connect-src policy is present and enforced).
      #
      # The spec fails, not skips, when a build is missing under CI, so a
      # broken build step cannot turn this into a green run that measured
      # nothing. Scoped to the source that can change what leaves the page.
      - name: E2E — local mode sends nothing operator-bound (www)
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 -- \
            'apps/www/src/**' \
            'apps/www/tests/local-mode/**' \
            'apps/www/vite.config.ts' \
            'apps/www/index.html' \
            'apps/www/resume/index.html' \
            'apps/www/build.profiles.ts' \
            'apps/www/playwright.config.ts' \
            'packages/fetch-kit/**' \
            'packages/server-routes/**' || true)
          if [ -n "$files" ]; then
            nix develop .#ci --command pnpm turbo build --filter=www... --concurrency=100%
            nix develop .#ci --command env \
              SOME_UI_PROFILE=pages VITE_STATIC_DATA=true VITE_BASE_PATH=/some-ui/ \
              pnpm --filter www exec vite build --outDir dist-pages --emptyOutDir
            nix develop .#ci-playwright --command env \
              WWW_DIST_LAN=apps/www/dist WWW_DIST_PAGES=apps/www/dist-pages \
              pnpm --filter www test:e2e tests/local-mode/no-egress.spec.ts
          else
            echo "No files that decide what the built app sends changed."
          fi

      # #1193's own review flagged that this directory - both the sessions
      # badge/completion-summary regression and the session-viewport overflow
      # spec that predates it - ran nowhere in CI: no workflow named either
      # spec, so both could fail indefinitely without blocking a PR. Same
      # shape as the CSP step above (a static-fixture Playwright spec, no
      # build needed), scoped to the source these two specs mirror
      # rather than turbo's dep graph, since neither is a per-package
      # build/test.
      - name: E2E — session-viewport regression (www)
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 -- \
            'apps/www/tests/session-viewport/**' \
            'apps/www/tests/layout-invariants/**' \
            'apps/www/src/routes/_dashboard.tsx' \
            'apps/www/src/routes/_dashboard/sessions/**' \
            'apps/www/src/components/player/**' \
            'apps/www/src/test-support/catalog-worst-case.ts' \
            'packages/activity-catalog/**' \
            'packages/ui/shared/src/components/ui/badge.tsx' \
            'packages/ui/shared/src/components/ui/button.tsx' \
            'apps/www/tsconfig.json' \
            'apps/www/playwright.config.ts' || true)
          if [ -n "$files" ]; then
            nix develop .#ci-playwright --command pnpm --filter www test:e2e \
              tests/session-viewport/no-overflow-scroll.spec.ts \
              tests/session-viewport/sessions-badge-containment.spec.ts
          else
            echo "No session-viewport-relevant www files changed."
          fi

      # A Codex review on #1294 found this suite ran nowhere in CI - every
      # e2e step in this job scopes `test:e2e` to explicit spec paths (see
      # the convention note at the top of this file), and this spec was
      # never named, so the pager/bounded-composer regressions it covers
      # could return with every required check still green. Unlike every
      # other step here, this spec drives the actual running app rather
      # than the panel page or a static fixture - `tests/composer/
      # harness.ts` spawns `vite` itself and waits for it, so no separate
      # server-start step is needed. Scoped to the composer, dashboard shell,
      # and fitted-page surfaces the spec actually exercises.
      - name: E2E — composer regression (www)
        run: |
          files=$(git diff --name-only --diff-filter=ACMR HEAD^1 -- \
            'apps/www/src/components/composer/**' \
            'apps/www/src/routes/_dashboard.tsx' \
            'apps/www/src/routes/_dashboard/sessions/new.tsx' \
            'packages/react-hooks/src/lib/use-fitted-page/**' \
            'apps/www/tests/composer/**' \
            'apps/www/playwright.config.ts' || true)
          if [ -n "$files" ]; then
            nix develop .#ci-playwright --command pnpm --filter www test:e2e \
              tests/composer/pager.spec.ts
          else
            echo "No composer-relevant www files changed."
          fi

  # ── Dependency license audit ────────────────────────────────────────────
  deny:
    name: Deny Checks
    needs: changes
    if: >
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.node == 'true' ||
      needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/_deny-checks.yml
    with:
      rust: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' }}
      node: ${{ needs.changes.outputs.node == 'true' || needs.changes.outputs.ci == 'true' }}

  # ── CI Gate ────────────────────────────────────────────────────────────
  # Always runs. Aggregates results from conditional jobs.
  # Configure branch protection to require THIS job only.
  #
  # Skipped jobs are treated as passing (nothing to check → nothing broke).
  # Failed or cancelled jobs that were required fail the gate.
  # ── Test layout (repo-wide) ────────────────────────────────────────────
  # At most one *.test.* per source directory, none in a src/routes/ tree
  # outside __tests__/ (#772, #1475). Its own job, with no `changes` gate:
  # the invariant spans every workspace, and the node job above is skipped for
  # an extensions-only PR, exactly where a stray test can land (bot-found on
  # #1531). No install: the script runs on Node's built-in type stripping. A script
  # rather than an ESLint rule because the verdict for one file depends on its
  # siblings, which `eslint --cache` cannot see (packages/eslint/src/test-layout.ts).
  test-layout:
    name: Test layout guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup
      - name: Check test layout
        run: nix develop .#ci --command node --no-warnings scripts/check-test-layout.ts

  # ── React coordination (repo-wide) ─────────────────────────────────────
  # R1 (docs/monorepo-boundaries.md, "Inside a React package"): every React
  # module that awaits or chains a promise is listed in
  # scripts/react-coordination.allowlist with its exact count. No `changes`
  # gate, for test-layout's reason: a React module can land in an
  # extensions-only PR, and the allowlist sits under scripts/, which no path
  # filter covers. Unlike test-layout it needs the TypeScript parser, so it
  # installs the one workspace that declares it (seconds), not the repo.
  react-coordination:
    name: React coordination guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/pnpm-cache
      - name: Install the eslint kit
        run: nix develop .#ci --command pnpm install --frozen-lockfile --prefer-offline --filter @some-ui/eslint-kit
      - name: Check React coordination
        run: nix develop .#ci --command node --no-warnings scripts/check-react-coordination.ts
      # F1 (docs/monorepo-boundaries.md, "A port translates: the foreign
      # boundary"): the same kind of count, over waits on foreign APIs.
      - name: Check the foreign boundary
        run: nix develop .#ci --command node --no-warnings scripts/check-foreign-boundary.ts

  # ── Workflow guards (repo-wide) ────────────────────────────────────────
  # Artifact retention (CLAUDE.md "Workflow storage") and the RS1 fingerprint
  # and RS2 branch-name checks (CLAUDE.md "Cross-repo coupling"). No `changes`
  # gate for the same reason as test-layout: a workflow edit rides along with
  # any kind of PR. No install: Node's built-in type stripping, like above.
  workflows:
    name: Workflow guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup
      - name: Check workflows
        run: nix develop .#ci --command node --no-warnings scripts/check-workflows.ts

  # ── Toolchain pins (repo-wide) ─────────────────────────────────────────
  # .nvmrc, package.json's packageManager and the www Dockerfile's base image
  # are copies of the Node and pnpm versions the flake provides
  # (nix/node/default.nix), written by scripts/sync-toolchain.sh. No `changes`
  # gate: either side can move alone (a flake.lock bump, a hand edit of
  # .nvmrc), and a hand edit of a copy is the drift this exists to catch. No
  # install: it only evaluates the flake.
  toolchain:
    name: Toolchain pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup
      - name: Check toolchain pins match the flake
        run: scripts/sync-toolchain.sh --check

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        rust,
        node-checks,
        node-lint,
        node-test,
        node-e2e,
        deny,
        test-layout,
        react-coordination,
        workflows,
        toolchain,
      ]
    if: always()
    steps:
      - name: Evaluate results
        run: |
          FAILED=false

          RUST_REQUIRED="${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' }}"
          RUST_RESULT="${{ needs.rust.result }}"
          if [ "$RUST_REQUIRED" = "true" ] && [ "$RUST_RESULT" != "success" ]; then
            echo "❌ rust: $RUST_RESULT (required)"
            FAILED=true
          else
            echo "✅ rust: $RUST_RESULT (required: $RUST_REQUIRED)"
          fi

          NODE_REQUIRED="${{ needs.changes.outputs.node == 'true' || needs.changes.outputs.ci == 'true' }}"
          for pair in \
            "node-checks:${{ needs.node-checks.result }}" \
            "node-lint:${{ needs.node-lint.result }}" \
            "node-test:${{ needs.node-test.result }}" \
            "node-e2e:${{ needs.node-e2e.result }}"; do
            job="${pair%%:*}"
            result="${pair#*:}"
            if [ "$NODE_REQUIRED" = "true" ] && [ "$result" != "success" ]; then
              echo "❌ $job: $result (required)"
              FAILED=true
            else
              echo "✅ $job: $result (required: $NODE_REQUIRED)"
            fi
          done

          LAYOUT_RESULT="${{ needs.test-layout.result }}"
          if [ "$LAYOUT_RESULT" != "success" ]; then
            echo "❌ test-layout: $LAYOUT_RESULT (always required)"
            FAILED=true
          else
            echo "✅ test-layout: $LAYOUT_RESULT"
          fi

          COORDINATION_RESULT="${{ needs.react-coordination.result }}"
          if [ "$COORDINATION_RESULT" != "success" ]; then
            echo "❌ react-coordination: $COORDINATION_RESULT (always required)"
            FAILED=true
          else
            echo "✅ react-coordination: $COORDINATION_RESULT"
          fi

          WORKFLOWS_RESULT="${{ needs.workflows.result }}"
          if [ "$WORKFLOWS_RESULT" != "success" ]; then
            echo "❌ workflows: $WORKFLOWS_RESULT (always required)"
            FAILED=true
          else
            echo "✅ workflows: $WORKFLOWS_RESULT"
          fi

          TOOLCHAIN_RESULT="${{ needs.toolchain.result }}"
          if [ "$TOOLCHAIN_RESULT" != "success" ]; then
            echo "❌ toolchain: $TOOLCHAIN_RESULT (always required)"
            FAILED=true
          else
            echo "✅ toolchain: $TOOLCHAIN_RESULT"
          fi

          DENY_RESULT="${{ needs.deny.result }}"
          if [ "$DENY_RESULT" = "failure" ] || [ "$DENY_RESULT" = "cancelled" ]; then
            echo "❌ deny: $DENY_RESULT"
            FAILED=true
          else
            echo "✅ deny: $DENY_RESULT"
          fi

          if [ "$FAILED" = "true" ]; then
            echo ""
            echo "One or more required CI jobs failed."
            exit 1
          fi

          echo ""
          echo "All required checks passed."
