name: Release
# Node package intents and publication have their own branch and workspace.
# A merged version PR publishes by its version transitions, not its title.
on:
  push:
    branches: [main]
    paths:
      - "packages/**/package.json"
      - "apps/*/package.json"
      - "docs/canon/package.json"
      - "scripts/release/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      publish_only:
        description: "Retry publishing current Node package versions without creating a version PR"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-node
  cancel-in-progress: false
  queue: max
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      release_mode: ${{ steps.detect.outputs.release_mode }}
      publish_packages: ${{ steps.detect.outputs.publish_packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/release/track.mjs node detect

  release-pr:
    needs: detect
    if: github.event_name == 'workflow_dispatch' && needs.detect.outputs.release_mode == 'release-pr'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: ./.github/actions/node-ci-setup
        with:
          build: none
      - name: Version only Node packages
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix develop .#ci --command node scripts/release/track.mjs node version
      - name: Open release PR
        if: steps.version.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        env:
          HUSKY: "0"
        with:
          branch: changeset-release/node
          base: main
          delete-branch: true
          commit-message: "chore(release): version Node packages"
          title: "chore(release): version Node packages"
          body: "Consumes Node package changesets only. Merging publishes the changed Node versions; WASM and Docker intents remain with their own tracks."

  publish:
    needs: detect
    if: needs.detect.outputs.release_mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-ci-setup
        with:
          build: none
      - name: Build Node packages
        run: nix develop .#ci --command pnpm build --concurrency=100%
      - name: Authenticate to npm
        run: printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
      - name: Publish only this track's released versions
        env:
          PUBLISH_PACKAGES: ${{ needs.detect.outputs.publish_packages }}
          GH_TOKEN: ${{ github.token }}
        run: nix develop .#ci --command node scripts/release/track.mjs node publish
