name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    name: Changesets Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/node-ci-setup
        with:
          build: none
      # `pnpm build` excludes crates/* (root package.json). This is the
      # changesets release for the Node packages; the wasm packages have their
      # own publish track in wasm-release.yml, which builds each changed crate
      # with wasm-pack and restores the dist into the crate directory before
      # running `changeset publish`. In steady state `.changeset/` on main
      # therefore never holds a wasm entry for this workflow to publish - if
      # one is ever added by hand, dispatch wasm-release.yml instead, so the
      # tarball ships with a dist built for that exact version.
      - name: Build packages
        run: nix develop .#ci --command pnpm build --concurrency=100%
      # changesets/action v2 leaves npm auth to the workflow; v1 wrote this
      # file from NPM_TOKEN. `nix develop` keeps HOME, so the CLI reads it.
      - name: Authenticate to npm
        run: printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
      # CS1: the action's major pairs with the Changesets CLI's; see
      # packages/eslint/src/workflow-guards.ts.
      - name: Create Release PR or Publish
        uses: changesets/action@v2.1.2
        with:
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          publish-script: nix develop .#ci --command npx changeset publish
        env:
          NODE_ENV: production
