name: Resume Docker Release
# Publishes home's résumé render service, `pgathondu/resume-render`
# (packages/ui/resume/Dockerfile, scripts/serve.mjs), from main once the image
# to be pushed has rendered a résumé. Home pulls it by digest instead of
# building it from a checkout (RELEASE R8, paulgsc/server#853; C352).
#
# The image builds from packages/ui/resume alone (its Dockerfile copies only
# that directory's scripts/ and src/), so those paths are the whole trigger.
on:
  push:
    branches: [main]
    paths:
      - "packages/ui/resume/**"
      - ".github/workflows/resume-docker-release.yml"
  # A publish of main as it is (a failed push, say).
  workflow_dispatch:
env:
  DOCKERHUB_IMAGE: "pgathondu/resume-render"
permissions:
  contents: read
# One publish at a time, none cancelled: a cancelled run's push is lost. Two
# queued runs can swap, leaving `:latest` a commit behind; home pins by digest.
concurrency:
  group: resume-docker-release
  cancel-in-progress: false
  queue: max
jobs:
  # ── Build, prove, push ──────────────────────────────────────────────────
  # Built once and loaded, proved as home runs it (no network, a read-only
  # root, no capabilities), and that same image is pushed: a second build
  # could differ from what was proved. No layer cache: the build is a base
  # pull, one apk install and the pinned typst and fonts, a few minutes cold.
  publish:
    name: Build, prove & push the resume-render image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag resume-render:proof \
            packages/ui/resume
      # The faux PII is the worst case `pnpm build` already proves every layout
      # with (scripts/fixtures/faux-pii.json). The request goes from inside the
      # container, since with no network nothing outside can reach its port.
      - name: Prove a render
        run: |
          docker run -d --name resume-proof --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges:true \
            resume-render:proof
          trap 'docker logs resume-proof; docker rm -f resume-proof >/dev/null' EXIT
          docker exec -i resume-proof node --input-type=module -e '
            import { readFileSync } from "node:fs"
            import { piiTemplates, variants } from "./scripts/typst.mjs"
            const pii = JSON.parse(readFileSync("scripts/fixtures/faux-pii.json", "utf8"))
            const url = "http://127.0.0.1:3100"
            for (let i = 0; ; i++) {
              try { if ((await fetch(`${url}/health`)).ok) break } catch {}
              if (i === 30) throw new Error("the service never answered /health")
              await new Promise((r) => setTimeout(r, 1000))
            }
            const response = await fetch(`${url}/render`, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ variant: variants[0], template: piiTemplates[0], pii }),
            })
            const pdf = Buffer.from(await response.arrayBuffer())
            if (!response.ok) throw new Error(`render answered ${response.status}`)
            if (pdf.subarray(0, 5).toString() !== "%PDF-") throw new Error("render returned no PDF")
            console.log(`rendered ${pdf.length} bytes`)
          '
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push
        run: |
          docker tag resume-render:proof "$DOCKERHUB_IMAGE:$GITHUB_SHA"
          docker tag resume-render:proof "$DOCKERHUB_IMAGE:latest"
          docker push "$DOCKERHUB_IMAGE:$GITHUB_SHA"
          docker push "$DOCKERHUB_IMAGE:latest"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$DOCKERHUB_IMAGE:$GITHUB_SHA")
          echo "Pushed \`$digest\` from $GITHUB_SHA (home pins this digest)." | tee -a "$GITHUB_STEP_SUMMARY"
      # U1 (paulgsc/server#791): ask server's release-lock.yml to look, so the
      # image just pushed reaches home's release with no pin edited by hand. It
      # carries only a reason: the run reads Docker Hub itself (RL2). It uses
      # SERVER_ROUTES_DISPATCH_TOKEN, the route snapshot's token, which now
      # serves this call too; this step does not touch that workflow (RS1). A
      # missing token fails the job, so the owner hears the release was not
      # asked; the image is already pushed, and a dispatch of release-lock.yml
      # by hand catches up.
      - name: Ask server's release to look
        env:
          GH_TOKEN: ${{ secrets.SERVER_ROUTES_DISPATCH_TOKEN }}
          REASON: "pgathondu/resume-render:${{ github.sha }} published by some-ui ${{ github.workflow }}"
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=Release not asked::SERVER_ROUTES_DISPATCH_TOKEN is not set; dispatch paulgsc/server's release-lock.yml by hand."
            exit 1
          fi
          gh workflow run release-lock.yml --repo paulgsc/server --ref main -f reason="$REASON"
          echo "Asked paulgsc/server's release-lock.yml to look: $REASON" | tee -a "$GITHUB_STEP_SUMMARY"
