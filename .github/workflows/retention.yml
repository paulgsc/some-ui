name: Retention
# The retention state machine (packages/eslint/src/retention.ts; CLAUDE.md,
# "Workflow storage") over every artifact and Actions cache. It runs after
# each workflow that uploads a family kept across runs, so a new copy prunes
# the old at once, and hourly for the rest: consumed artifacts and caches,
# among them a merged PR's, whose ref is then no longer live. Each sweep plans
# from the whole current state, so one cancelled or skipped loses nothing.
# Hourly, not after every push: a sweep reads about 70 pages of the API, and
# the token's 1,000 requests an hour are the whole repo's.
#
# It deletes, at most 300 items a sweep, and stops below the rate floor
# (scripts/retention.ts); the next sweep continues. On a pull request that
# changes its own files it only reports, which is how a change is tried
# before merge, since workflow_run fires only from main.
on:
  workflow_run:
    workflows:
      - Mobile APK
      - Extension Release
      - Sign Firefox Extension (Manual)
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/retention.yml
      - scripts/retention.ts
      - packages/eslint/src/retention.ts
permissions:
  actions: write
  contents: read
  pull-requests: read
concurrency:
  group: retention-${{ github.event_name == 'pull_request' && github.ref || 'sweep' }}
  cancel-in-progress: false
jobs:
  sweep:
    name: Sweep artifacts and caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/retention.ts
            packages/eslint/src/retention.ts
            .nvmrc
          sparse-checkout-cone-mode: false
      # setup-node rather than the nix shell: magic-nix-cache would write
      # cache entries on every sweep, the largest family this sweeps.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Sweep
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RETENTION_MODE: ${{ github.event_name == 'pull_request' && 'report' || 'delete' }}
          RETENTION_MAX_DELETIONS: 300
        run: node scripts/retention.ts
