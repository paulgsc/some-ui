name: Scratch queue single
# SCRATCH (#1617): shows whether a pending run survives a newer push under
# queue: single. Removed before merge.
on:
  pull_request:
    branches: [main]
permissions: {}
concurrency:
  group: scratch-queue-single
  cancel-in-progress: false

jobs:
  hold:
    runs-on: ubuntu-latest
    steps:
      - run: echo "head ${{ github.event.pull_request.head.sha }}"; sleep 75
