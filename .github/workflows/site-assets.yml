name: Site Assets
# The public site's media that CI can render (PAGES #3401, C1059): each job
# renders some of the landing's slot assets on sample data and uploads them as
# `site-assets-<kind>-<sha>`, laid out by key (`stills/page-filter.png`,
# `clips/extensions/hook.mp4`; the show's faces, C1183). pages.yml fetches the
# newest of each kind into the build at its next deploy; a slot with none
# keeps its drawn placeholder. Snips Capture uploads the Android faces the
# same way. Nothing here is committed (C1029), and nothing here reads the
# owner's records: Page Filter is shot on a page of ours, the promo walks
# Suspender Ledger's sample, and the `dashboards` job draws the server's own
# dashboards on sample telemetry (the owner on #3401, 2026-11-23): never
# home's numbers, and no key.
on:
  push:
    branches: [main]
    paths:
      - "extensions/some-filter/**"
      - "packages/video-motion/**"
      - "apps/www/src/landing/show.ts"
      - "apps/www/scripts/show-faces.ts"
      - "packages/video-render/**"
      - ".github/workflows/site-assets.yml"
  workflow_dispatch:
  # Twice a month, so while these runs succeed the newest of each kind
  # outlives no 30 days even when nothing it is made from changes, and the
  # server's dashboards, read from paulgsc/server's main, are at most two
  # weeks behind it (a dispatch catches up at once). A month
  # of failed runs, or GitHub pausing an idle repository's schedules, lets
  # it lapse: the landing then draws placeholders, and pages.yml's summary
  # lists what it found.
  schedule:
    - cron: "41 5 3,17 * *"

permissions:
  contents: read

concurrency:
  group: site-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  page-filter:
    name: Page Filter's gap still
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-ci-setup
        with:
          build: none
          resume-assets: "false"
      - name: Build Page Filter for Chromium
        run: |
          nix develop .#ci --command pnpm turbo run build \
            --filter='@some-extension/filter^...' --concurrency=100%
          nix develop .#ci --command pnpm --filter @some-extension/filter build:chromium
      # A light page of ours with one widget in a closed shadow root, as it
      # is and under Page Filter (extensions/some-filter/tests/stills).
      - name: Photograph the gap
        run: |
          nix develop .#ci-playwright --command pnpm --filter @some-extension/filter \
            still:gap "$RUNNER_TEMP/site-assets/stills/page-filter.png"
      # Retention: pages.yml reads the newest of this family at the next
      # deploy, which waits on an approval and can come weeks after this
      # push. 30 days outlives that gap; its family keeps one
      # (packages/eslint/src/retention.ts). Once it is gone the landing
      # draws the gap's placeholder until a push or a dispatch renders it
      # again.
      - name: Upload the still
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-assets-page-filter-${{ github.sha }}
          path: ${{ runner.temp }}/site-assets
          if-no-files-found: error
          retention-days: 30

  extensions:
    name: The extensions faces
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-ci-setup
        with:
          build: none
          resume-assets: "false"
      # Suspender Ledger 0.3.1's promo (HYPER3), as pr.yml proves it: its
      # release and sample from paulgsc/testing at a pinned commit, the
      # popup walked in its sandbox on that sample, the sound kit made here.
      - name: Render Suspender Ledger's promo
        run: |
          nix develop .#ci --command pnpm turbo run build \
            --filter='@some-ui/video-motion^...' --concurrency=100%
          data="$RUNNER_TEMP/promo-data"
          mkdir -p "$data"
          for file in release sample; do
            curl -fsSL -o "$data/$file.json" \
              "https://raw.githubusercontent.com/paulgsc/testing/853627e77d31499e81d16b3f48d9ae77b3237f46/promo/suspender-ledger/0.3.1/$file.json"
          done
          nix develop .#ci-playwright --command \
            pnpm --filter @some-ui/video-render render sounds --out "$RUNNER_TEMP/brand/sounds"
          nix develop .#ci-playwright --command \
            pnpm --filter @some-ui/video-motion motion promo "$data" --out "$RUNNER_TEMP/promo" --brand "$RUNNER_TEMP/brand"
          # The landing show's Extensions faces (C1183): the promo's shots
          # as silent cuts and its walk's stills, as the show names them
          # (apps/www/scripts/show-faces.ts). The landing plays no sound
          # (C1064): each cut drops its sound track, and the script refuses
          # one that still has one.
          nix develop .#ci-playwright --command \
            pnpm --filter www exec tsx scripts/show-faces.ts extensions \
            "$RUNNER_TEMP/promo" "$RUNNER_TEMP/site-assets"
      # Retention: pages.yml reads the newest of this family at the next
      # deploy, which waits on an approval and can come weeks after this
      # push. 30 days outlives that gap; its family keeps one. Once it is
      # gone the landing draws the clip's title card until a push or a
      # dispatch renders it again.
      - name: Upload the show's Extensions faces
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-assets-extensions-${{ github.sha }}
          path: ${{ runner.temp }}/site-assets
          if-no-files-found: error
          retention-days: 30

  # The server's dashboards on sample telemetry (the owner on #3401,
  # 2026-11-23, moving C1071): paulgsc/server's jsonnet compiled by the
  # dashboard-builder image its release pins, as its CI does; a throwaway
  # Prometheus loaded with one made-up week
  # (packages/video-motion/src/walk/dashboard-telemetry.ts) and a throwaway
  # Grafana over it, both the images that release pins, reachable only from
  # this runner; then the `home-server` and `home-cores` walks
  # (packages/video-motion/scripts/dashboards-on-sample.sh). The same server
  # commit gives the same pictures. No key, no home and no mailbox: the
  # server's checkout is public and read with this run's read-only token.
  dashboards:
    name: The server's dashboards, on sample data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # pages.yml reads only a run that succeeded, so a failure here (the
    # server's main, an image pull, a Grafana that did not start) must not
    # hide the other jobs' media: the run still succeeds, this job shows red
    # in it, and the landing keeps the last stills it fetched.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: paulgsc/server
          ref: main
          path: server-checkout
          persist-credentials: false
      - uses: ./.github/actions/node-ci-setup
        with:
          build: none
          resume-assets: "false"
      # The server episode's stills, as the show names them
      # (apps/www/scripts/show-faces.ts, from the walk's own screens: the
      # episode names no cut, so no video is rendered; a cut added to it
      # needs the walkthrough rendered here first, as Snips Capture does),
      # and the cores gap's still, the second walk's one screen.
      - name: Draw the dashboards on sample telemetry
        run: |
          nix develop .#ci --command pnpm turbo run build \
            --filter='@some-ui/video-motion^...' --concurrency=100%
          nix develop .#ci-playwright --command pnpm --filter @some-ui/video-motion exec \
            bash scripts/dashboards-on-sample.sh "$GITHUB_WORKSPACE/server-checkout" "$RUNNER_TEMP/walks"
          nix develop .#ci-playwright --command \
            pnpm --filter www exec tsx scripts/show-faces.ts server \
            "$RUNNER_TEMP/walks/walk-home-server" "$RUNNER_TEMP/site-assets"
          mkdir -p "$RUNNER_TEMP/site-assets/stills"
          cp "$RUNNER_TEMP/walks/walk-home-cores/snips/01.png" "$RUNNER_TEMP/site-assets/stills/cores.png"
          echo "Drawn from paulgsc/server at $(git -C server-checkout rev-parse HEAD), on sample telemetry." >> "$GITHUB_STEP_SUMMARY"
      # The job is continue-on-error, so the run stays green when this fails:
      # say it on the run, where the run's summary and its annotations show
      # it, and the landing keeps the last stills until theirs expire.
      - name: Say the dashboards were not drawn
        if: failure()
        run: |
          echo "::error title=Server dashboards not drawn::The server's dashboards were not drawn in this run; the landing keeps the last stills fetched, until their artifact expires 30 days after it was made."
          echo "- **The server's dashboards were not drawn in this run.** The landing keeps the last stills, until their artifact expires." >> "$GITHUB_STEP_SUMMARY"
      # Retention: pages.yml reads the newest of this family at the next
      # deploy, which waits on an approval and can come weeks after this
      # push. 30 days outlives that gap; its family keeps one
      # (packages/eslint/src/retention.ts). Once it is gone the landing draws
      # the server episode's skeletons and the cores card's drawing until a
      # push or a dispatch draws them again.
      - name: Upload the server's stills
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-assets-server-${{ github.sha }}
          path: ${{ runner.temp }}/site-assets
          if-no-files-found: error
          retention-days: 30
