name: Deploy Storybook to GitHub Pages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: storybook-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # -------------------------------------------------
      # Checkout
      # -------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
      # -------------------------------------------------
      # Nix Environment (Single Source of Truth)
      # -------------------------------------------------
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v7
      # -------------------------------------------------
      # pnpm Store Cache
      # -------------------------------------------------
      - name: Get pnpm store path (inside nix shell)
        id: pnpm-store
        run: |
          nix develop .#ci --command bash -c \
          'echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: >
            ${{ runner.os }}-pnpm- ${{ hashFiles('pnpm-lock.yaml') }}

          restore-keys: |
            ${{ runner.os }}-pnpm-
      # -------------------------------------------------
      # Workspace Build Output Cache
      # -------------------------------------------------
      - name: Cache workspace build outputs
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
          key: >
            ${{ runner.os }}-workspace- ${{ hashFiles('packages/**/src/**/*') }}

          restore-keys: |
            ${{ runner.os }}-workspace-
      # -------------------------------------------------
      # Storybook Cache (All relevant paths)
      # -------------------------------------------------
      - name: Cache Storybook
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/storybook
            node_modules/.cache/sb-vite-plugin-externals
            packages/*/node_modules/.cache/storybook
          key: >
            ${{ runner.os }}-storybook- ${{ hashFiles('pnpm-lock.yaml') }}- ${{ hashFiles('.storybook/**/*') }}- ${{ hashFiles('packages/**/*.{ts,tsx,js,jsx,mdx}') }}

          restore-keys: |
            ${{ runner.os }}-storybook-
      # -------------------------------------------------
      # Install Dependencies
      # -------------------------------------------------
      - name: Install dependencies
        run: |
          nix develop .#ci --command pnpm install \
            --frozen-lockfile \
            --prefer-offline
        env:
          HUSKY_SKIP_INSTALL: 1
      # -------------------------------------------------
      # Build Workspace Libraries
      # -------------------------------------------------
      - name: Build workspace packages
        run: nix develop .#ci --command pnpm build
        env:
          NODE_ENV: production
      # -------------------------------------------------
      # Build Storybook (Heavy Step)
      # -------------------------------------------------
      - name: Build Storybook
        run: nix develop .#ci --command pnpm run build-storybook
        env:
          NODE_ENV: production
          NODE_OPTIONS: "--max-old-space-size=4096"
          STORYBOOK_DISABLE_TELEMETRY: 1
          STORYBOOK_BASE_PATH: /${{ github.event.repository.name }}/
      # -------------------------------------------------
      # Upload Pages Artifact
      # -------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./storybook-static
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
