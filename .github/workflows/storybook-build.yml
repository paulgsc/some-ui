name: Storybook
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - '.storybook/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/storybook-build.yml'
      - '.github/workflows/_detect-changes.yml'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.storybook/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/storybook-build.yml'
      - '.github/workflows/_detect-changes.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: false
jobs:
  changes:
    uses: ./.github/workflows/_detect-changes.yml
  build:
    name: Build Storybook
    needs: changes
    # Run on storybook changes, node changes (component updates), or CI changes.
    # Always run on workflow_dispatch.
    if: |
      github.event_name == 'workflow_dispatch'
      || needs.changes.outputs.storybook == 'true'
      || needs.changes.outputs.node == 'true'
      || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/pnpm-cache
        with:
          shell: ci
      - name: Cache workspace build outputs
        uses: actions/cache@v5
        with:
          path: packages/*/dist
          key: workspace-dist-${{ runner.os }}-${{ hashFiles('packages/**/src/**') }}
          restore-keys: workspace-dist-${{ runner.os }}-
      - name: Cache Storybook intermediates
        uses: actions/cache@v5
        with:
          path: |
            node_modules/.cache/storybook
            node_modules/.cache/sb-vite-plugin-externals
          key: storybook-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.storybook/**', 'packages/**/*.stories.*') }}
          restore-keys: storybook-cache-${{ runner.os }}-
      - name: Install dependencies
        run: |
          nix develop .#ci --command pnpm install \
            --frozen-lockfile \
            --prefer-offline
        env:
          HUSKY: 0
      - name: Build workspace packages
        run: nix develop .#ci --command pnpm build
        env:
          NODE_ENV: production
      - name: Build Storybook
        run: nix develop .#ci --command pnpm build-storybook
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096
          STORYBOOK_DISABLE_TELEMETRY: 1
          STORYBOOK_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./storybook-static
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    # Only deploy on pushes to main — not PRs, not workflow_dispatch previews.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
