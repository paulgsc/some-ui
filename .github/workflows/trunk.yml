name: Trunk
# Full-workspace health check on every push to main.
#
# This workflow runs the complete test/lint/typecheck suite across ALL
# workspaces with no filtering. A failure here means the trunk is broken
# and should be treated as a production incident — investigate and fix
# or revert before the next merge.
#
# Expensive artifact builds (Pages/Storybook deploy, AMO signing, WASM
# publish) are NOT triggered from here — they live in their own
# path-filtered workflows (pages.yml, extension.yml, wasm-release.yml) and
# run on push to main independently.
#
on:
  push:
    branches: [main]
  # Allow manual re-runs to verify trunk is green after a hotfix.
  workflow_dispatch:
jobs:
  # ── Full Rust suite ─────────────────────────────────────────────────────
  rust:
    name: Rust CI (full workspace)
    uses: ./.github/workflows/_rust-ci.yml
  # ── Full Node suite ─────────────────────────────────────────────────────
  # No turbo filter — runs across all packages including extensions.
  # This catches breakage in workspaces that PRs didn't touch.
  node:
    name: Node CI (full workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/pnpm-cache
      - name: Install dependencies
        run: nix develop .#ci --command pnpm install --frozen-lockfile --prefer-offline
        env:
          HUSKY: 0
      # "All packages" means all *Node* packages. `pnpm build` is
      # `turbo run build --filter='!./crates/*'` (root package.json) - the
      # crates/* wasm workspaces are excluded on purpose. Their `build` script
      # is `wasm-pack build --release`, and this job has no cargo-cache, so
      # every push to main was compiling six Rust dependency trees from cold
      # here. That is not lost coverage: the `rust` job above already runs
      # `cargo build --workspace --locked` plus clippy and the full test suite
      # over the same crates, and wasm-release.yml is what turns them into
      # published npm packages.
      - name: Build all packages
        run: nix develop .#ci --command pnpm build --concurrency=100%
      - name: Typecheck all packages
        run: nix develop .#ci --command pnpm typecheck --concurrency=100%
      - name: Lint all packages
        run: nix develop .#ci --command pnpm lint:js --concurrency=100%
      - name: Prettier all packages
        run: nix develop .#ci --command pnpm prettier --concurrency=100%
      # ci-playwright, unlike the steps above. `test` (= `turbo test`) fans
      # out to the 21 workspaces with a `test` script; 20 are Vitest, and
      # exactly one, @some-extension/common, is Playwright/Chromium. The
      # plain `ci` shell explicitly ships no Playwright ("No GUI libs, no
      # dev ergonomics, no Playwright" — see its own comment in flake.nix),
      # so Playwright fell back to its own npm-managed browser download,
      # which is unavailable/incomplete in this sandboxed CI environment —
      # not a timeout, an outright "Executable doesn't exist". `ci-playwright`
      # provisions a Nix-patched Chromium and exports
      # PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH/PLAYWRIGHT_BROWSERS_PATH/
      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD (nix/playwright/default.nix) —
      # but that alone isn't sufficient here: this step runs the task via
      # `turbo test`, and turbo's default strict env mode strips ambient
      # env vars from the child task process unless a task explicitly lists
      # them in `passThroughEnv` (see turbo.json's `test` task). Both parts
      # are required together. @some-extension/common's suite is invisible
      # to PR CI (excluded from pr.yml's node job and from extension.yml's
      # matrix, since it ships no manifest*.json), so this was the only
      # place the resulting failure could ever surface (#1136). Verified
      # locally: `turbo run test --filter=@some-extension/common` fails
      # with the exact "Executable doesn't exist" error without
      # passThroughEnv declared, and passes once it is.
      - name: Test all packages
        run: nix develop .#ci-playwright --command pnpm test --concurrency=100%
  # ── Full dependency audit ───────────────────────────────────────────────
  deny:
    name: Deny Checks (full)
    uses: ./.github/workflows/_deny-checks.yml
    with:
      rust: true
      node: true
  # ── Trunk health gate ───────────────────────────────────────────────────
  # Single aggregation point. Wire up branch status / Slack notifications
  # to this job rather than individual jobs.
  trunk-gate:
    name: Trunk Gate
    runs-on: ubuntu-latest
    needs: [rust, node, deny]
    if: always()
    steps:
      - name: Evaluate trunk health
        run: |
          FAILED=false

          for job_result in \
            "rust:${{ needs.rust.result }}" \
            "node:${{ needs.node.result }}" \
            "deny:${{ needs.deny.result }}"; do
            name="${job_result%%:*}"
            result="${job_result##*:}"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "❌ $name: $result"
              FAILED=true
            else
              echo "✅ $name: $result"
            fi
          done

          if [ "$FAILED" = "true" ]; then
            echo ""
            echo "Trunk is broken. Investigate and fix or revert before next merge."
            exit 1
          fi

          echo ""
          echo "Trunk is healthy."

# ── Optional: notify on failure ─────────────────────────────────────
# Uncomment and configure SLACK_WEBHOOK_URL repository secret to
# get notified when trunk breaks.
#
