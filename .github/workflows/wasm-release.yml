name: WASM Release
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.lock"
      - ".github/workflows/wasm-release.yml"
  workflow_dispatch:
    inputs:
      publish_only:
        description: "Rebuild and publish crates at their current package.json version, without creating new changesets (use to backfill a version that was bumped but never published)"
        type: boolean
        default: false
env:
  RELEASE_COMMIT_MESSAGE: "chore(release): update WASM packages"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: wasm-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # ── Detect changed crates ────────────────────────────────────────────────
  # A wasm crate is any crates/*/ dir with both Cargo.toml (buildable) and
  # package.json (npm-publishable) - discovered at runtime rather than
  # hardcoded, so a new crate opts in just by having both files. No compiled
  # detector binary: a plain bash diff is enough, so this doesn't pay for a
  # cargo build on every push just to decide what to build ("save the
  # penguins" - a shell script can answer this without spending CI minutes).
  detect:
    name: Detect Changed WASM Crates
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      is_release_commit: ${{ steps.detect.outputs.is_release_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changed wasm crates
        id: detect
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          mapfile -t all_crates < <(
            for d in crates/*/; do
              [ -f "${d}Cargo.toml" ] && [ -f "${d}package.json" ] && basename "$d"
            done
          )

          BASE="${{ github.event.before }}"
          base_missing=false
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            base_missing=true
          fi

          # Is this a rebuild-and-publish pass rather than a detect-new-
          # changes pass? Two cases:
          #  - This push *is* the changesets release commit landing on main
          #    (the Version PR was just merged). That commit only touches
          #    crates/*/package.json and CHANGELOG.md, which match this
          #    workflow's trigger paths - so it still needs to run, but
          #    minting another changeset for every bumped crate here would
          #    loop forever (see git blame on this file).
          #  - A maintainer dispatched with publish_only=true, to backfill a
          #    version that's already committed but never made it to npm
          #    (e.g. because this exact loop-prevention guard also ate the
          #    publish step before this fix).
          is_release_commit=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish_only }}" = "true" ]; then
            is_release_commit=true
          elif [ "${{ github.event_name }}" != "workflow_dispatch" ] && \
               [[ "$HEAD_COMMIT_MESSAGE" == "$RELEASE_COMMIT_MESSAGE"* ]]; then
            is_release_commit=true
          fi
          echo "is_release_commit=${is_release_commit}" >> "$GITHUB_OUTPUT"

          if [ "$is_release_commit" = "true" ]; then
            # Rebuild exactly the crates this release commit bumped -
            # nothing from the PR's own workflow run survives (dist
            # artifacts are scoped to that run), so `release` below has
            # nothing to publish unless we rebuild it here.
            if [ "$base_missing" = "true" ]; then
              changed_crates=("${all_crates[@]}")
            else
              mapfile -t changed_files < <(git diff --name-only "$BASE" "${{ github.sha }}")
              changed_crates=()
              for crate in "${all_crates[@]}"; do
                if printf '%s\n' "${changed_files[@]}" | grep -qx "crates/${crate}/package.json"; then
                  changed_crates+=("$crate")
                fi
              done
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$base_missing" = "true" ]; then
            changed_crates=("${all_crates[@]}")
          else
            mapfile -t changed_files < <(git diff --name-only "$BASE" "${{ github.sha }}")

            # Cargo.lock touches the whole workspace's dependency graph - rebuild everything.
            if printf '%s\n' "${changed_files[@]}" | grep -qx 'Cargo.lock'; then
              changed_crates=("${all_crates[@]}")
            else
              changed_crates=()
              for crate in "${all_crates[@]}"; do
                if printf '%s\n' "${changed_files[@]}" | grep -q "^crates/${crate}/"; then
                  changed_crates+=("$crate")
                fi
              done
            fi
          fi

          include="[]"
          for crate in "${changed_crates[@]:-}"; do
            [ -z "$crate" ] && continue
            # Crates normally inherit their version via
            # `version.workspace = true` rather than declaring their own -
            # fall back to the workspace root's version in that case.
            if grep -qx 'version.workspace = true' "crates/${crate}/Cargo.toml"; then
              version=$(grep -m1 '^version[[:space:]]*=' Cargo.toml | sed -E 's/version[[:space:]]*=[[:space:]]*"(.*)"/\1/')
            else
              version=$(grep -m1 '^version[[:space:]]*=' "crates/${crate}/Cargo.toml" | sed -E 's/version[[:space:]]*=[[:space:]]*"(.*)"/\1/')
            fi
            include=$(jq -c --arg name "$crate" --arg version "$version" '. + [{"crate_name": $name, "version": $version}]' <<<"$include")
          done

          matrix=$(jq -c -n --argjson include "$include" '{include: $include}')
          count=$(jq '.include | length' <<<"$matrix")

          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
  # ── Build changed crates ─────────────────────────────────────────────────
  build:
    name: Build WASM — ${{ matrix.crate_name }}
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: wasm-${{ matrix.crate_name }}
      # No pnpm install here on purpose: wasm-pack build below only needs
      # the Rust/cargo toolchain from the nix devshell, and nothing later in
      # this job touches node_modules. A workspace-wide pnpm install would
      # also be broken on the release commit itself - changesets has just
      # bumped consumer package.json files (e.g. packages/ui/input) to pin
      # the crate version this job is about to build, and pnpm-lock.yaml
      # can't reflect that until it's regenerated.
      # Each crate's own package.json wraps this same invocation under
      # different script names (wasm:prod, build, ...) - calling wasm-pack
      # directly here keeps the matrix build uniform regardless of which
      # script name a given crate happens to use locally.
      - name: Build WASM package
        run: |
          nix develop .#ci --command wasm-pack build \
            --target web \
            --release \
            --out-dir dist \
            "crates/${{ matrix.crate_name }}"
      # Skipped on the release commit itself: those crates are already
      # versioned by the changeset that requested this bump, so minting
      # another one here would leave `.changeset/` non-empty forever and
      # `release` below would keep opening version PRs instead of publishing.
      - name: Create changeset
        id: changeset
        if: needs.detect.outputs.is_release_commit != 'true'
        run: |
          PACKAGE_NAME=$(jq -r .name "crates/${{ matrix.crate_name }}/package.json")
          VERSION="${{ matrix.version }}"
          CHANGESET_ID="${{ matrix.crate_name }}-$(date +%s)"
          CHANGESET_FILE=".changeset/${CHANGESET_ID}.md"

          cat > "$CHANGESET_FILE" << EOF
          ---
          "${PACKAGE_NAME}": patch
          ---

          Update WASM package for ${{ matrix.crate_name }} to version ${VERSION}
          EOF

          echo "file=${CHANGESET_FILE}" >> "$GITHUB_OUTPUT"
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-dist-${{ matrix.crate_name }}
          path: crates/${{ matrix.crate_name }}/dist
          if-no-files-found: error
      # The build job's checkout is a separate, ephemeral working tree from
      # the release job's - a changeset file written here never reaches
      # `release` unless it travels as an artifact like the dist output does.
      - name: Upload changeset
        if: needs.detect.outputs.is_release_commit != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: wasm-changeset-${{ matrix.crate_name }}
          path: ${{ steps.changeset.outputs.file }}
          if-no-files-found: error
  # ── Publish via changesets ───────────────────────────────────────────────
  release:
    name: Changesets WASM Release
    needs: [detect, build]
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/pnpm-cache
        with:
          shell: ci
      - name: Download all WASM dist artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wasm-dist-*
          path: dist/wasm
          merge-multiple: false
      - name: Download all WASM changesets
        uses: actions/download-artifact@v8
        with:
          pattern: wasm-changeset-*
          path: .changeset
          merge-multiple: true
      - name: Restore dist artifacts into each crate directory
        run: |
          set -euo pipefail
          for artifact_dir in dist/wasm/wasm-dist-*; do
            crate_name=$(basename "$artifact_dir" | sed 's/^wasm-dist-//')
            rm -rf "crates/${crate_name}/dist"
            mv "$artifact_dir" "crates/${crate_name}/dist"
          done
      # This only needs the root project's own devDependencies (changesets
      # and friends) to run `npx changeset publish` below - nothing here
      # needs the rest of the workspace installed. That's not just an
      # optimization: a full install is actually broken at this point in the
      # pipeline. On the release commit, changesets has already bumped
      # consumer package.json files (e.g. extensions/some-conveyor pinning
      # "@some-ui/polyhedron": "0.0.4") to a version that doesn't exist on
      # npm yet - this job is what's about to publish it. Those are plain
      # semver pins, not `workspace:`, so pnpm won't link them locally; any
      # whole-workspace resolution (even with --no-frozen-lockfile, even
      # just to compute a fresh lockfile) fails with ERR_PNPM_NO_MATCHING_VERSION
      # before ever reaching the publish step. `--filter .` scopes
      # resolution to the root package, and `--no-lockfile` skips the
      # workspace-wide lockfile pnpm would otherwise insist on computing.
      - name: Install dependencies
        run: |
          nix develop .#ci --command pnpm --filter . install \
            --no-lockfile \
            --prefer-offline
        env:
          HUSKY: 0
      - name: Create Release PR or Publish
        uses: changesets/action@v1.4.9
        with:
          commit: ${{ env.RELEASE_COMMIT_MESSAGE }}
          title: ${{ env.RELEASE_COMMIT_MESSAGE }}
          version: nix develop .#ci --command scripts/wasm-changeset-version.sh
          publish: nix develop .#ci --command npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          NODE_ENV: production
