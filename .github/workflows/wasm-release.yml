name: WASM Release
on:
  push:
    branches: [main]
    paths:
      - "wasm-sources/**"
      - "Cargo.lock"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  detect:
    name: Detect Changed WASM Crates
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: wasm-detect-bin
          target-dir: .github/scripts/target
      - name: Build WASM detector binary
        run: |
          nix develop .#ci --command cargo build \
            --release \
            --manifest-path .github/scripts/Cargo.toml \
            --target-dir .github/scripts/target \
            -p wasm-detect
      - name: Emit matrix
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            export FORCE_BUILD=1
            echo "" | .github/scripts/target/release/wasm-detect > matrix.json
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ -z "$BASE" ]; then
              export FORCE_BUILD=1
              echo "" | .github/scripts/target/release/wasm-detect > matrix.json
            else
              git diff --name-only "$BASE" "$HEAD" \
                | .github/scripts/target/release/wasm-detect > matrix.json
            fi
          fi

          MATRIX=$(jq -c . matrix.json)
          COUNT=$(jq '.include | length' matrix.json)
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
  build:
    name: Build WASM — ${{ matrix.crate_name }}
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: wasm-${{ matrix.crate_name }}
      - uses: ./.github/actions/pnpm-cache
        with:
          shell: ci
      - name: Install dependencies
        run: |
          nix develop .#ci --command pnpm install \
            --frozen-lockfile \
            --prefer-offline
        env:
          HUSKY: 0
      # wasm-pack is in the ci nix shell (rust.deps includes wasm-pack).
      - name: Build WASM package
        run: |
          nix develop .#ci --command wasm-pack build \
            --scope your-scope \
            --target web \
            --out-dir "../../dist/wasm/${{ matrix.crate_name }}" \
            "wasm-sources/${{ matrix.crate_name }}"
      - name: Create changeset
        run: |
          PACKAGE_NAME="@your-scope/wasm-${{ matrix.crate_name }}"
          VERSION="${{ matrix.version }}"
          CHANGESET_ID="${{ matrix.crate_name }}-$(date +%s)"

          cat > ".changeset/${CHANGESET_ID}.md" << EOF
          ---
          "${PACKAGE_NAME}": patch
          ---

          Update WASM package for ${{ matrix.crate_name }} to version ${VERSION}
          EOF
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-dist-${{ matrix.crate_name }}
          path: dist/wasm/${{ matrix.crate_name }}
          if-no-files-found: error
  release:
    name: Changesets WASM Release
    needs: [detect, build]
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/pnpm-cache
        with:
          shell: ci
      - name: Download all WASM dist artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wasm-dist-*
          path: dist/wasm
          merge-multiple: true
      - name: Install dependencies
        run: |
          nix develop .#ci --command pnpm install \
            --frozen-lockfile \
            --prefer-offline
        env:
          HUSKY: 0
      - name: Create Release PR or Publish
        uses: changesets/action@v1.4.9
        with:
          commit: "chore(release): update WASM packages"
          title: "chore(release): update WASM packages"
          publish: nix develop .#ci --command npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          NODE_ENV: production
