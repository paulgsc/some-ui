name: WASM Release
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "scripts/release/**"
      - ".github/workflows/wasm-release.yml"
  workflow_dispatch:
    inputs:
      publish_only:
        description: "Rebuild and publish crates at their current package.json version, without creating new changesets (use to backfill a version that was bumped but never published)"
        type: boolean
        default: false
env:
  RELEASE_COMMIT_MESSAGE: "chore(release): update WASM packages"
permissions:
  contents: write
  pull-requests: write
# Every publish event keeps its place in the queue. Detection suppresses an
# older source run when main already carries a later version of that crate.
concurrency:
  group: wasm-release
  cancel-in-progress: false
  queue: max
jobs:
  # A crate version transition publishes that crate; source changes request
  # a version PR. One push may contain both, independently of its commit title.
  detect:
    name: Detect Changed WASM Crates
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      has_sources: ${{ steps.detect.outputs.has_sources }}
      has_releases: ${{ steps.detect.outputs.has_releases }}
      publish_packages: ${{ steps.detect.outputs.publish_packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refresh main for superseded source runs
        run: git fetch --quiet origin main:refs/remotes/origin/main
      - id: detect
        env:
          CHECK_LATEST: "true"
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/release/track.mjs wasm detect
  # ── Build changed crates ─────────────────────────────────────────────────
  build:
    name: Build WASM — ${{ matrix.crate_name }}
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/cargo-cache
        with:
          key-suffix: wasm-${{ matrix.crate_name }}
      # wasm-pack needs Rust, not an installed Node workspace. Its dist is
      # consumed by this run's publish job, whose package scope is explicit.
      - name: Build WASM package
        run: |
          nix develop .#ci --command wasm-pack build \
            --target web \
            --release \
            --out-dir dist \
            "crates/${{ matrix.crate_name }}"
      # Already-versioned crates publish; only source-only crates mint intents.
      - name: Create changeset
        id: changeset
        if: matrix.mode == 'source'
        run: |
          PACKAGE_NAME=$(jq -r .name "crates/${{ matrix.crate_name }}/package.json")
          CHANGESET_ID="${{ matrix.crate_name }}-$(date +%s)"
          CHANGESET_FILE=".changeset/${CHANGESET_ID}.md"

          cat > "$CHANGESET_FILE" << EOF
          ---
          "${PACKAGE_NAME}": patch
          ---

          Update WASM source for ${{ matrix.crate_name }}
          EOF

          echo "file=${CHANGESET_FILE}" >> "$GITHUB_OUTPUT"
      # Read only by `publish` below, in this same run; the default kept every
      # run's copy for 90 days. Past a day, "Re-run failed jobs" on `publish`
      # finds nothing to download: use "Re-run all jobs", which rebuilds it, or
      # a publish_only dispatch for a release commit whose publish failed.
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-dist-${{ matrix.crate_name }}
          path: crates/${{ matrix.crate_name }}/dist
          if-no-files-found: error
          retention-days: 1
      # The build job's checkout is a separate, ephemeral working tree from
      # the consuming job's - a changeset file written here never reaches
      # `release-pr` unless it travels as an artifact like the dist output does.
      # A day, like the dist artifact above and for the same reason.
      - name: Upload changeset
        if: matrix.mode == 'source'
        uses: actions/upload-artifact@v7
        with:
          name: wasm-changeset-${{ matrix.crate_name }}
          path: ${{ steps.changeset.outputs.file }}
          if-no-files-found: error
          retention-days: 1
  # ── Publish via changesets ───────────────────────────────────────────────
  publish:
    name: Publish WASM packages
    needs: [detect, build]
    if: needs.detect.outputs.has_releases == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-setup
      - uses: ./.github/actions/pnpm-cache
      - name: Download all WASM dist artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wasm-dist-*
          path: dist/wasm
          merge-multiple: false
      # actions/download-artifact nests each artifact under its own name
      # only when more than one matches the pattern; a lone match is
      # extracted straight into `path`. Globbing for `wasm-dist-*`
      # directories therefore found nothing the first time this workflow
      # had to release a single crate on its own (run 30422724972), and the
      # unexpanded glob was handed to `mv`. The detect job already knows
      # exactly which crates were built, so take the list from there and
      # accept either layout rather than inferring it from the filesystem.
      - name: Restore dist artifacts into each crate directory
        env:
          BUILT_CRATES: ${{ needs.detect.outputs.matrix }}
        run: |
          set -euo pipefail

          mapfile -t crate_names < <(jq -r '.include[].crate_name' <<<"$BUILT_CRATES")

          for crate_name in "${crate_names[@]}"; do
            nested="dist/wasm/wasm-dist-${crate_name}"

            if [ -d "$nested" ]; then
              source_dir="$nested"
            elif [ "${#crate_names[@]}" -eq 1 ] && [ -d "dist/wasm" ]; then
              source_dir="dist/wasm"
            else
              echo "::error::no dist artifact found for ${crate_name} (looked for ${nested})"
              exit 1
            fi

            rm -rf "crates/${crate_name}/dist"
            mv "$source_dir" "crates/${crate_name}/dist"
          done
      # Publishing needs the root CLI and changelog dependencies only. Package
      # dists above are already built, so this leg never installs consumers.
      # Why not node-ci-setup: its install is the whole workspace's, frozen.
      - name: Install dependencies
        run: |
          nix develop .#ci --command pnpm --filter . install \
            --no-lockfile \
            --prefer-offline
        env:
          HUSKY: 0
      # The CLI reads npm auth from HOME, which nix develop preserves.
      - name: Authenticate to npm
        run: printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
      - name: Publish only this track's released versions
        env:
          PUBLISH_PACKAGES: ${{ needs.detect.outputs.publish_packages }}
          GH_TOKEN: ${{ github.token }}
        run: nix develop .#ci --command node scripts/release/track.mjs wasm publish

  release-pr:
    name: Open/update WASM release PR
    needs: [detect, build]
    if: needs.detect.outputs.has_sources == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: ./.github/actions/node-ci-setup
        with:
          build: none
          resume-assets: "false"
      - name: Download source-change intents
        uses: actions/download-artifact@v8
        with:
          pattern: wasm-changeset-*
          path: .changeset
          merge-multiple: true
      - name: Read the standing WASM release request
        id: pending
        run: |
          branch=changeset-release/wasm
          remote=$(git ls-remote --heads origin "refs/heads/$branch")
          if [ -n "$remote" ]; then
            git fetch --quiet origin "+refs/heads/$branch:refs/remotes/origin/$branch"
            echo "ref=refs/remotes/origin/$branch" >> "$GITHUB_OUTPUT"
          fi
      - name: Version only WASM packages
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIOUS_RELEASE_REF: ${{ steps.pending.outputs.ref }}
        run: nix develop .#ci --command node scripts/release/track.mjs wasm version
      - name: Open release PR
        if: steps.version.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        env:
          HUSKY: "0"
        with:
          branch: changeset-release/wasm
          base: main
          delete-branch: true
          commit-message: ${{ env.RELEASE_COMMIT_MESSAGE }}
          title: ${{ env.RELEASE_COMMIT_MESSAGE }}
          body: "Versions WASM packages only. Merging publishes the changed versions; consumer dependency pins are adopted separately after publication."
