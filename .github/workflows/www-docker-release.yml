name: WWW Docker Release
# Publishes the tanstack `www` app's Docker image to Docker Hub
# (paulgsc/www — see infra/compose/www.yml).
#
# apps/www sits at the wide end of this monorepo's dependency graph: nearly
# every workspace package (and, transitively, several wasm crates) can end up
# in its build. A workspace dependency bumping its
# own version is a poor publish trigger on its own — it very often carries
# no user-visible change to www at all. So this workflow doesn't build+push
# straight off a green build. It mirrors the changesets idiom already used
# elsewhere in this repo (release.yml, wasm-release.yml): detect a change
# reachable from www, accumulate it into a standing release PR, and only
# build+push the image once a human merges that PR. The merge is the
# judgment call detection can't make on its own.
#
# Node, WASM and Docker have distinct branches and scoped Changesets
# workspaces (scripts/release/policy.json). Only a www version transition
# publishes this image; other tracks' bookkeeping requests no new Docker PR.
on:
  push:
    branches: [main]
    paths:
      - "apps/www/**"
      - "packages/**"
      - "crates/**"
      - "pnpm-lock.yaml"
      - "scripts/release/**"
      - ".github/workflows/www-docker-release.yml"
  workflow_dispatch:
    inputs:
      publish_only:
        description: "Skip detection/PR and build+push straight from the current apps/www package.json version (use to retry a publish that failed after the release PR merged)"
        type: boolean
        default: false
env:
  RELEASE_COMMIT_MESSAGE: "chore(release): publish www docker image"
  RELEASE_BRANCH: "changeset-release/www-docker"
  DOCKERHUB_IMAGE: "pgathondu/www"
permissions:
  contents: read
# `queue: max`: every run waits its turn. Under the default, a newer push
# replaces the one pending run, and a replaced run is lost either way: a
# release commit's publish has nothing to re-trigger it but a publish_only
# dispatch, and an ordinary push's run is the only one that compares that
# push's range (`github.event.before`). Runs still go one at a time. GitHub
# does not guarantee FIFO, so two queued runs can swap; an ordinary run that
# starts after a newer release skips (www-detect/detect.sh).
concurrency:
  group: www-docker-release
  cancel-in-progress: false
  queue: max
jobs:
  # ── Detect whether www's build graph actually changed ───────────────────
  # Patterned after wasm-release.yml's detect job (explicit outputs) rather
  # than dorny/paths-filter: paths-filter isn't dependency-graph-aware (see
  # pr.yml), and a plain `apps/www/**` filter would miss the transitive
  # workspace-dependency bumps that are the whole reason this workflow opens
  # a PR instead of publishing directly. No strategy.matrix here, unlike
  # wasm-release.yml's per-crate matrix — there's exactly one image to build.
  #
  # The shared policy detects version transitions and semantic source changes;
  # www-detect then checks whether those sources reach www's build graph.
  detect:
    name: Detect www Changes
    runs-on: ubuntu-latest
    outputs:
      release_mode: ${{ steps.detect.outputs.release_mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/node-ci-setup
        with:
          build: none
          resume-assets: "false"
      - id: detect
        uses: ./.github/actions/www-detect
        with:
          event-name: ${{ github.event_name }}
          publish-only: ${{ inputs.publish_only }}
          base-sha: ${{ github.event.before }}
          head-sha: ${{ github.sha }}
  # ── Open/update the release PR ──────────────────────────────────────────
  # Runs `@changesets/cli` directly (not changesets/action - see header) to
  # bump apps/www's version + CHANGELOG, then opens a PR on a dedicated
  # branch. Re-running this on a later push updates the same PR/branch, so
  # multiple dependency bumps before a maintainer gets to it collapse into
  # one review instead of one PR each.
  release-pr:
    name: Open/Update www Release PR
    needs: detect
    if: needs.detect.outputs.release_mode == 'release-pr'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/node-ci-setup
        with:
          build: none
          resume-assets: "false"
      - name: Write changeset
        run: |
          cat > ".changeset/www-docker-$(date +%s).md" << 'EOF'
          ---
          "www": patch
          ---

          www's build graph changed - the app itself or one of its workspace
          dependencies was touched since the last Docker publish. Most
          dependency bumps don't change www's actual behaviour, so this
          needs a human read of the diff: merge (squash) this PR to build
          and push an updated `paulgsc/www` image to Docker Hub, or close it
          if the change doesn't warrant a new image.
          EOF
      - name: Apply version bump and changelog
        uses: ./.github/actions/www-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Open release PR
        uses: peter-evans/create-pull-request@v8
        # WR1: the commit runs with the git hooks off (check:workflows).
        env:
          HUSKY: "0"
        with:
          branch: ${{ env.RELEASE_BRANCH }}
          base: main
          delete-branch: true
          commit-message: ${{ env.RELEASE_COMMIT_MESSAGE }}
          title: ${{ env.RELEASE_COMMIT_MESSAGE }}
          body: >
            Opened automatically because a change reachable from `apps/www` landed on `main`. Review the diff and merge when the change warrants an image (the www version transition drives publishing) to build and push `${{ env.DOCKERHUB_IMAGE }}`.

  # ── Build + push the image ──────────────────────────────────────────────
  # Only runs once the release PR above has actually been merged (or a
  # maintainer forced it via workflow_dispatch publish_only). No pnpm here -
  # the Dockerfile's own build stages are self-contained. Nix is here only to
  # run the lines-of-code snapshot script, below.
  publish:
    name: Build & Push Docker Image
    needs: detect
    if: needs.detect.outputs.release_mode == 'publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The lines-of-code number in the dashboard header is a snapshot taken
      # here, as the image is built (apps/www/src/lib/loc-report). It is written
      # into the workspace, which is the Docker build's context; the history it
      # reads is cloned outside it. This job runs no pnpm, so Nix is here for the
      # script's Node and nothing else.
      # Best-effort: without it the image ships the tracked placeholder and no
      # widget.
      - uses: ./.github/actions/nix-setup
      - name: Snapshot lines of code
        continue-on-error: true
        uses: ./.github/actions/loc-snapshot
      - name: Read version
        id: version
        run: echo "version=$(jq -r .version apps/www/package.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # WI1: the image serves the app when run bare, before anything is
      # pushed. #2652 shipped an empty conf.d/default.conf that every request
      # was refused by, unseen because compose renders its own template over it.
      # Built once here and loaded; the push below reuses this builder's cache.
      # No build-record artifact: nothing reads it, and it kept 90 days.
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: apps/www/Dockerfile
          load: true
          push: false
          cache-from: type=gha
          tags: www:serve-check
      - name: Serve the image bare (WI1)
        run: |
          docker run -d --name www-serve-check -p 8080:80 www:serve-check
          served=no
          for _ in $(seq 1 20); do
            if curl -fsS -o index.html http://127.0.0.1:8080/a/deep/link; then
              served=yes
              break
            fi
            sleep 1
          done
          docker logs www-serve-check
          docker rm -f www-serve-check
          [ "$served" = yes ] || { echo "The image refused a request on :80."; exit 1; }
          grep -q '<div id="app"' index.html || { echo "The image served something other than the app's index.html."; exit 1; }
      # No build-record artifact: nothing reads it, and it kept 90 days.
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: apps/www/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
      # U1: asks home's release to look at what was just pushed.
      - name: Ask server's release to look
        uses: ./.github/actions/release-lock-dispatch
        with:
          token: ${{ secrets.SERVER_ROUTES_DISPATCH_TOKEN }}
          reason: "pgathondu/www:${{ steps.version.outputs.version }} published by some-ui"
