# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[workspace]
resolver = "2"

members = ["crates/pkg_cloner", "crates/some-bricks", "crates/some-crossword", "crates/viewport-rotation", "crates/some-hexagon", "crates/hangul-game-core", "crates/leetype_wasm", "crates/polyhedron"]

exclude = []

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(wasm_bindgen_unstable_test_coverage)'] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1

[workspace.package]
version = "0.0.0"
authors = ["pgdev"]
repository = "https://github.com/paulgsc/some-ui"
homepage = "https://maishatu.com/"
license = "MIT"
edition = "2021"

[workspace.dependencies]
clap = { version = "4.5.8", features = ["derive", "env"] }
once_cell = "1.17.1"
regex = "1.7.0"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.93"
tracing = "0.1.44"
