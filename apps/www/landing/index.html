<!doctype html>
<!--
  The public site's front page (PAGES, #3401; C1055): a CV. A template of the
  Pages build only (vite.config.ts, `publicSite`), which fills the two markers
  below with what render-public-site.ts rendered from src/landing
  (`SITE_FILE`) before the build, and writes it as the output's index.html.
  No script: everything here is drawn from the résumé's data and the
  landing's words when the site is built.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--site:head-->
    <style>
      :root {
        --fg: #2a2118;
        --muted: #6e604f;
        --line: #eadfcd;
        --accent: #a35a0b;
        --bg: #fdf8f0;
        --card: #fff;
        --stage: #f3e4cc;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          16px/1.6 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      a {
        color: var(--accent);
      }
      .top {
        border-bottom: 1px solid var(--line);
        background: var(--card);
      }
      .top .in {
        max-width: 1080px;
        margin: 0 auto;
        padding: 36px 28px 30px;
        display: flex;
        align-items: center;
        gap: 28px;
        flex-wrap: wrap;
      }
      .photo {
        width: 132px;
        height: 132px;
        border-radius: 50%;
        overflow: hidden;
        flex: none;
        background: var(--stage);
        border: 1px solid var(--line);
        margin: 0;
      }
      .photo svg,
      .photo img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }
      .who {
        flex: 1;
        min-width: 240px;
      }
      h1 {
        font-size: 2.3rem;
        line-height: 1.1;
        margin: 0;
      }
      .role {
        font-size: 1.15rem;
        color: var(--muted);
        margin: 0.35rem 0 0.9rem;
      }
      .contact {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem 1.1rem;
        align-items: center;
        font-weight: 500;
      }
      .btn {
        background: var(--accent);
        color: #fff;
        padding: 0.45rem 1rem;
        border-radius: 6px;
        text-decoration: none;
      }
      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 28px 28px 72px;
      }
      .lede {
        font-size: 1.08rem;
        max-width: 64ch;
        margin: 0 0 26px;
      }
      .section-title {
        font-size: 1.25rem;
        margin: 2.4rem 0 0.9rem;
      }
      .lede + .section-title {
        margin-top: 0;
      }
      /* The show (C1180-C1183). Laid flat unless WIDE_MOTION (render.ts):
         each episode, its scenes' copy, and each scene's two faces as cards.
         Where it moves, the stage instead (below). */
      .stage {
        display: none;
      }
      .episode {
        margin: 0 0 28px;
      }
      .episode h3 {
        margin: 0 0 10px;
        font-size: 1.2rem;
      }
      .scene-flat {
        margin: 0 0 22px;
      }
      .scene-flat h4 {
        margin: 0 0 4px;
        font-size: 1.02rem;
      }
      .scene-flat > p {
        margin: 0.2rem 0;
        max-width: 64ch;
      }
      /* A scene's two faces are a pair, not a gallery: a tall clip stays
         a size a reader takes in at once. */
      .scene-flat .grid {
        margin-top: 12px;
        max-width: 36rem;
      }
      .kicker {
        margin: 0 0 0.3rem;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }
      /* A face's title card: what its screen shows when the build has no
         clip or still for it, and under a clip a reader who prefers less
         motion doesn't see. */
      .title-card {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 18px;
        text-align: center;
        color: #f3e4cc;
        font-size: 1.3rem;
        font-weight: 600;
        line-height: 1.2;
      }
      /* A slot's clip or still, whole inside its screen or filling its
         card exactly: never cropped, never something to click. Its own box
         is the screen's dark, so the title card under it never shows
         through. */
      .media {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        background: #111217;
        pointer-events: none;
      }
      /* A card's words, below its picture. */
      .caption {
        padding: 12px 16px 14px;
      }
      .caption h3 {
        margin: 0;
        font-size: 1.08rem;
      }
      .caption p {
        margin: 0.2rem 0;
        font-size: 0.95rem;
      }
      /* The clip still loads and plays out of sight (autoplay outranks
         preload, and a video takes no media-chosen source): stopping it
         would take a script, which this page has none of. */
      @media (prefers-reduced-motion: reduce) {
        video.media {
          display: none;
        }
      }
      /* Cards laid flat sit in justified rows (C1064): each takes its
         picture's own shape (--ar, from the file, render.ts), asks its row
         for a width in proportion (--r), and so every card in a row shares
         one picture height and no picture is cropped or padded. A narrow
         window gives each card a row of its own. Words sit below the
         picture, so a row's cards keep their own height. */
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-items: flex-start;
      }
      .card,
      .face {
        border-radius: 12px;
        overflow: hidden;
        background: var(--card);
        box-shadow: 0 0 0 1px var(--line);
      }
      .card {
        flex: calc(var(--r) * 100) 1 calc(var(--r) * 300px);
      }
      .pic,
      .screen {
        position: relative;
        aspect-ratio: var(--ar);
      }
      .pic {
        background: var(--stage);
      }
      .screen {
        background: #111217;
      }
      /* WIDE_MOTION: the stage. The copy block (an episode a face, about Y)
         beside the episode's pair of cubes (a scene a face, about X), the
         pairs stacked in one place, each in view for its episode. Every
         move is a track on the show's one clock (timeline.ts), named in the
         head; here each track's element gets that clock's duration. Each
         block breathes a little, and the whole show holds still under the
         pointer. */
      @media (width >= 900px) and (prefers-reduced-motion: no-preference) {
        .flat {
          display: none;
        }
        .stage {
          display: grid;
          grid-template-columns: minmax(0, 1.35fr) repeat(2, minmax(0, 1fr));
          gap: 20px;
          align-items: start;
        }
        /* The copy is as tall as its longest scene needs; the cubes stay
           square beside it. */
        .block--copy {
          grid-area: 1 / 1;
          align-self: stretch;
          min-height: 19rem;
        }
        .pair {
          grid-area: 1 / 2 / 2 / 4;
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 20px;
        }
        /* Every track on the one clock, started just past the copy block's
           first turn (--show-start, render.ts), so the show opens on its
           first episode, not on the last one leaving. */
        .tk {
          animation-delay: var(--show-start);
          animation-duration: var(--show);
          animation-iteration-count: infinite;
          animation-fill-mode: both;
        }
        .block {
          animation: breathe 11s ease-in-out infinite;
        }
        .pair .block:nth-child(2) {
          animation-delay: -3.7s;
        }
        .block--copy {
          animation-delay: -7.3s;
        }
        .show:hover .tk,
        .show:hover .block {
          animation-play-state: paused;
        }
        .ring {
          container-type: inline-size;
          height: 100%;
          perspective: 1400px;
        }
        .ring--cube {
          --faces: 4;
          aspect-ratio: 1;
        }
        .block .ring .ring-turn {
          --depth: calc(50cqi / tan(180deg / var(--faces)));
          position: relative;
          height: 100%;
          transform-style: preserve-3d;
          transform: translateZ(calc(-1 * var(--depth)));
        }
        .ring .face {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          backface-visibility: hidden;
        }
        .ring--copy .face {
          transform: rotateY(calc(var(--i) * 360deg / var(--faces)))
            translateZ(var(--depth));
        }
        .ring--cube .face {
          transform: rotateX(calc(var(--i) * -90deg)) translateZ(var(--depth));
        }
        .ring--cube .screen {
          flex: 1;
          min-height: 0;
          aspect-ratio: auto;
        }
        .ring--cube .title-card {
          font-size: clamp(1rem, 7cqi, 1.4rem);
        }
        .band {
          padding: 8px 12px 10px;
        }
        .band-title {
          margin: 0;
          font-size: min(0.95rem, 5cqi);
          font-weight: 600;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .band-title span {
          display: inline-block;
          max-width: 100%;
          overflow: hidden;
          text-overflow: ellipsis;
          vertical-align: bottom;
        }
        .copy {
          padding: 20px 24px;
        }
        .copy .headline {
          margin: 0 0 0.6rem;
          font-size: clamp(1.05rem, 5cqi, 1.5rem);
          font-weight: 700;
          line-height: 1.2;
          background: linear-gradient(
            90deg,
            var(--fg) 0%,
            var(--fg) 35%,
            var(--accent) 50%,
            var(--fg) 65%,
            var(--fg) 100%
          );
          background-size: 300% 100%;
          background-clip: text;
          color: transparent;
          animation: sheen 14s linear infinite;
        }
        /* A scene's copy, one over another, each shown in its own time. */
        .scenes {
          position: relative;
          flex: 1;
        }
        .scene {
          position: absolute;
          inset: 0;
        }
        .scene-title {
          margin: 0 0 0.35rem;
          font-weight: 600;
        }
        .scene-title span {
          display: inline-block;
        }
        .line {
          margin: 0 0 0.3rem;
          font-size: min(0.95rem, 4.2cqi);
          line-height: 1.45;
        }
      }
      @keyframes breathe {
        50% {
          transform: scale(1.015);
        }
      }
      @keyframes sheen {
        from {
          background-position: 100% 0;
        }
        to {
          background-position: 0% 0;
        }
      }
      .drawing {
        position: absolute;
        inset: 0;
      }
      .note {
        position: absolute;
        right: 8px;
        top: 8px;
        max-width: 40%;
        z-index: 1;
        margin: 0;
        font-size: 0.7rem;
        background: rgba(42, 33, 24, 0.82);
        color: #fff;
        padding: 2px 8px;
        border-radius: 999px;
      }
      .drawing--filter {
        display: grid;
        grid-template-rows: 1fr 1fr;
      }
      .drawing--filter .page {
        position: relative;
      }
      .drawing--filter .light {
        background: #fafafa;
      }
      .drawing--filter .dark {
        background: #1b1d22;
      }
      .drawing--filter .part {
        position: absolute;
        left: 45%;
        top: 22%;
        width: 40%;
        height: 56%;
        border-radius: 6px;
        background: #fff;
        border: 1px solid #ddd;
      }
      .drawing--filter .part.white {
        border: 3px solid #f2a33a;
      }
      .drawing--cores {
        background: #111217;
        padding: 18px 16px 36px;
      }
      .drawing--cores svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .cores-line {
        stroke: #888;
        stroke-dasharray: 5 5;
        fill: none;
      }
      .busy {
        fill: rgba(50, 116, 217, 0.4);
        stroke: #5794f2;
        stroke-width: 2;
      }
      .waiting {
        fill: rgba(224, 117, 45, 0.6);
      }
      h2 {
        font-size: 0.85rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 3rem 0 1rem;
      }
      h2.section-title {
        letter-spacing: 0;
        text-transform: none;
        color: var(--fg);
      }
      .two {
        display: grid;
        grid-template-columns: 3fr 2fr;
        gap: 40px;
      }
      .job {
        margin-bottom: 1.1rem;
      }
      .job h3 {
        margin: 0;
        font-size: 1rem;
      }
      .when {
        color: var(--muted);
        font-size: 0.88rem;
      }
      .job p,
      .job ul {
        margin: 0.2rem 0;
      }
      .job ul {
        padding-left: 1.1rem;
      }
      footer {
        margin-top: 3rem;
        color: var(--muted);
        font-size: 0.85rem;
      }
      @media (max-width: 900px) {
        .two {
          grid-template-columns: 1fr;
        }
        .two {
          gap: 0;
        }
        h1 {
          font-size: 2rem;
        }
        .top .in {
          padding: 28px 20px 24px;
          gap: 18px;
        }
        .photo {
          width: 96px;
          height: 96px;
        }
        main {
          padding: 22px 20px 56px;
        }
      }
    </style>
  </head>
  <body>
    <!--site:body-->
  </body>
</html>
