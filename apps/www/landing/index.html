<!doctype html>
<!--
  The public site's front page (PAGES, #3401; C1055): a CV. A template of the
  Pages build only (vite.config.ts, `publicSite`), which fills the two markers
  below with what render-public-site.ts rendered from src/landing
  (`SITE_FILE`) before the build, and writes it as the output's index.html.
  No script: everything here is drawn from the résumé's data and the
  landing's words when the site is built.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--site:head-->
    <style>
      :root {
        --fg: #2a2118;
        --muted: #6e604f;
        --line: #eadfcd;
        --accent: #a35a0b;
        --bg: #fdf8f0;
        --card: #fff;
        --stage: #f3e4cc;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          16px/1.6 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      a {
        color: var(--accent);
      }
      .top {
        border-bottom: 1px solid var(--line);
        background: var(--card);
      }
      .top .in {
        max-width: 1080px;
        margin: 0 auto;
        padding: 36px 28px 30px;
        display: flex;
        align-items: center;
        gap: 28px;
        flex-wrap: wrap;
      }
      .photo {
        width: 132px;
        height: 132px;
        border-radius: 50%;
        overflow: hidden;
        flex: none;
        background: var(--stage);
        border: 1px solid var(--line);
        margin: 0;
      }
      .photo svg,
      .photo img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }
      .who {
        flex: 1;
        min-width: 240px;
      }
      h1 {
        font-size: 2.3rem;
        line-height: 1.1;
        margin: 0;
      }
      .role {
        font-size: 1.15rem;
        color: var(--muted);
        margin: 0.35rem 0 0.9rem;
      }
      .contact {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem 1.1rem;
        align-items: center;
        font-weight: 500;
      }
      .btn {
        background: var(--accent);
        color: #fff;
        padding: 0.45rem 1rem;
        border-radius: 6px;
        text-decoration: none;
      }
      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 28px 28px 72px;
      }
      .lede {
        font-size: 1.08rem;
        max-width: 64ch;
        margin: 0 0 26px;
      }
      .section-title {
        font-size: 1.25rem;
        margin: 2.4rem 0 0.9rem;
      }
      .lede + .section-title {
        margin-top: 0;
      }
      /* The projects' cube (C1110): one pane whose faces are the projects,
         turned face to face by the keyframes render.ts draws for their
         number (cubeTurn, in the head). A face is a square: its screen,
         where the clip or still sits whole on the dark, then its words
         below, never over it. The faces stand on a regular prism of
         --faces sides (a cube at four), its apothem from the pane's own
         width, so the front face is exactly the pane. Hovering holds the
         turn, so a reader can stop on a face. */
      .cube {
        container-type: inline-size;
        width: min(100%, 34rem);
        margin: 0 auto;
        perspective: 1800px;
      }
      .cube-turn {
        --apothem: calc(-50cqi / tan(180deg / var(--faces)));
        position: relative;
        aspect-ratio: 1;
        transform-style: preserve-3d;
        transform: translateZ(var(--apothem));
        animation: cube-turn var(--cycle) ease-in-out infinite;
      }
      /* On a narrow pane the words take more lines: the faces stand taller
         so their screens keep room. */
      @container (max-width: 30rem) {
        .cube-turn {
          aspect-ratio: 4 / 5;
        }
      }
      .cube:hover .cube-turn {
        animation-play-state: paused;
      }
      .face {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        border-radius: 12px;
        overflow: hidden;
        background: var(--card);
        box-shadow: 0 0 0 1px var(--line);
        backface-visibility: hidden;
        transform: rotateY(calc(var(--i) * 360deg / var(--faces)))
          translateZ(calc(50cqi / tan(180deg / var(--faces))));
      }
      .screen {
        position: relative;
        flex: 1;
        min-height: 0;
        background: #111217;
      }
      /* A face's title card: what the face shows when the build has no
         clip or still for it, and under a clip a reader who prefers less
         motion doesn't see. */
      .title-card {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 18px;
        text-align: center;
        color: #f3e4cc;
        font-size: clamp(1.2rem, 7cqi, 2rem);
        font-weight: 600;
        line-height: 1.2;
      }
      /* A slot's clip or still, whole inside its screen (the face) or
         filling its card exactly (a gap's, which takes the still's shape):
         never cropped, never something to click. Its own box is the
         screen's dark, so the title card under it never shows through. */
      .media {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        background: #111217;
        pointer-events: none;
      }
      /* A card's words, below its picture. */
      .caption {
        padding: 12px 16px 14px;
      }
      .caption h3 {
        margin: 0;
        font-size: 1.08rem;
      }
      .caption p {
        margin: 0.2rem 0;
        font-size: 0.95rem;
      }
      .caption .stack {
        color: var(--muted);
        font-size: 0.85rem;
        margin: 0.1rem 0 0.3rem;
      }
      /* A short, wide window (a phone held sideways) can't hold a square
         face: each face is twice as wide as it is tall, its words beside
         its screen. */
      @media (orientation: landscape) and (max-height: 500px) and (prefers-reduced-motion: no-preference) {
        .cube {
          width: min(100%, 44rem);
        }
        .cube-turn {
          aspect-ratio: 2 / 1;
        }
        .face {
          flex-direction: row;
        }
        .screen,
        .caption {
          flex: 1 1 50%;
        }
        .caption {
          align-self: center;
        }
      }
      /* A reader who prefers less motion sees no turn: the faces lie flat,
         side by side, each with its words, and every clip gives way to its
         title card. The clip still loads and plays out of sight (autoplay
         outranks preload, and a video takes no media-chosen source):
         stopping it would take a script, which this page has none of. */
      @media (prefers-reduced-motion: reduce) {
        .cube {
          width: 100%;
          perspective: none;
        }
        .cube-turn {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
          gap: 20px;
          aspect-ratio: auto;
          transform: none;
          animation: none;
        }
        .face {
          position: relative;
          transform: none;
        }
        .screen {
          flex: none;
          aspect-ratio: 4 / 3;
        }
        video.media {
          display: none;
        }
      }
      /* The gaps' cards in justified rows (C1064): each takes its still's
         own shape (--ar, from the file, render.ts), asks its row for a
         width in proportion (--r), and so every card in a row shares one
         picture height and no picture is cropped or padded. A narrow window
         gives each card a row of its own. A card's words sit below its
         picture (C1110), so a row's cards keep their own height. */
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-items: flex-start;
      }
      .card {
        flex: calc(var(--r) * 100) 1 calc(var(--r) * 300px);
        border-radius: 12px;
        overflow: hidden;
        background: var(--card);
        box-shadow: 0 0 0 1px var(--line);
      }
      .pic {
        position: relative;
        aspect-ratio: var(--ar);
        background: var(--stage);
      }
      .drawing {
        position: absolute;
        inset: 0;
      }
      .note {
        position: absolute;
        right: 8px;
        top: 8px;
        max-width: 40%;
        z-index: 1;
        margin: 0;
        font-size: 0.7rem;
        background: rgba(42, 33, 24, 0.82);
        color: #fff;
        padding: 2px 8px;
        border-radius: 999px;
      }
      .drawing--filter {
        display: grid;
        grid-template-rows: 1fr 1fr;
      }
      .drawing--filter .page {
        position: relative;
      }
      .drawing--filter .light {
        background: #fafafa;
      }
      .drawing--filter .dark {
        background: #1b1d22;
      }
      .drawing--filter .part {
        position: absolute;
        left: 45%;
        top: 22%;
        width: 40%;
        height: 56%;
        border-radius: 6px;
        background: #fff;
        border: 1px solid #ddd;
      }
      .drawing--filter .part.white {
        border: 3px solid #f2a33a;
      }
      .drawing--cores {
        background: #111217;
        padding: 18px 16px 36px;
      }
      .drawing--cores svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .cores-line {
        stroke: #888;
        stroke-dasharray: 5 5;
        fill: none;
      }
      .busy {
        fill: rgba(50, 116, 217, 0.4);
        stroke: #5794f2;
        stroke-width: 2;
      }
      .waiting {
        fill: rgba(224, 117, 45, 0.6);
      }
      h2 {
        font-size: 0.85rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 3rem 0 1rem;
      }
      h2.section-title {
        letter-spacing: 0;
        text-transform: none;
        color: var(--fg);
      }
      .two {
        display: grid;
        grid-template-columns: 3fr 2fr;
        gap: 40px;
      }
      .job {
        margin-bottom: 1.1rem;
      }
      .job h3 {
        margin: 0;
        font-size: 1rem;
      }
      .when {
        color: var(--muted);
        font-size: 0.88rem;
      }
      .job p,
      .job ul {
        margin: 0.2rem 0;
      }
      .job ul {
        padding-left: 1.1rem;
      }
      footer {
        margin-top: 3rem;
        color: var(--muted);
        font-size: 0.85rem;
      }
      @media (max-width: 900px) {
        .two {
          grid-template-columns: 1fr;
        }
        .two {
          gap: 0;
        }
        h1 {
          font-size: 2rem;
        }
        .top .in {
          padding: 28px 20px 24px;
          gap: 18px;
        }
        .photo {
          width: 96px;
          height: 96px;
        }
        main {
          padding: 22px 20px 56px;
        }
      }
    </style>
  </head>
  <body>
    <!--site:body-->
  </body>
</html>
