<!doctype html>
<!--
  The public site's front page (PAGES, #3401; C1055): a CV. A template of the
  Pages build only (vite.config.ts, `publicSite`), which fills the two markers
  below with what render-public-site.ts rendered from src/landing
  (`SITE_FILE`) before the build, and writes it as the output's index.html.
  No script: everything here is drawn from the résumé's data and the
  landing's words when the site is built.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--site:head-->
    <style>
      :root {
        --fg: #2a2118;
        --muted: #6e604f;
        --line: #eadfcd;
        --accent: #a35a0b;
        --bg: #fdf8f0;
        --card: #fff;
        --stage: #f3e4cc;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          16px/1.6 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      a {
        color: var(--accent);
      }
      .top {
        border-bottom: 1px solid var(--line);
        background: var(--card);
      }
      .top .in {
        max-width: 1080px;
        margin: 0 auto;
        padding: 36px 28px 30px;
        display: flex;
        align-items: center;
        gap: 28px;
        flex-wrap: wrap;
      }
      .photo {
        width: 132px;
        height: 132px;
        border-radius: 50%;
        overflow: hidden;
        flex: none;
        background: var(--stage);
        border: 1px solid var(--line);
        margin: 0;
      }
      .photo svg,
      .photo img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }
      .who {
        flex: 1;
        min-width: 240px;
      }
      h1 {
        font-size: 2.3rem;
        line-height: 1.1;
        margin: 0;
      }
      .role {
        font-size: 1.15rem;
        color: var(--muted);
        margin: 0.35rem 0 0.9rem;
      }
      .contact {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem 1.1rem;
        align-items: center;
        font-weight: 500;
      }
      .btn {
        background: var(--accent);
        color: #fff;
        padding: 0.45rem 1rem;
        border-radius: 6px;
        text-decoration: none;
      }
      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 28px 28px 72px;
      }
      .lede {
        font-size: 1.08rem;
        max-width: 64ch;
        margin: 0 0 26px;
      }
      .section-title {
        font-size: 1.25rem;
        margin: 2.4rem 0 0.9rem;
      }
      .lede + .section-title {
        margin-top: 0;
      }
      /* Cards in justified rows (C1064): each card takes its picture's own
         shape (--ar, from the file, render.ts), asks its row for a width in
         proportion (--r), and so every card in a row shares one height and
         no picture is cropped or padded. A narrow window gives each card a
         row of its own. */
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }
      /* flex-grow is the shape scaled up, so a row's cards always fill it
         and keep their shared height. The outline is a shadow, not a
         border, so the card's box is the picture's exact shape. The picture
         and its words share one grid cell: the picture sets the card's
         height, and words taller than it grow the card past it rather than
         being cut off, so no shape of asset and no width can clip them. A
         row's cards keep their own height (flex-start), so one card's words
         never pad another. */
      .grid {
        align-items: flex-start;
      }
      .card {
        position: relative;
        display: grid;
        flex: calc(var(--r) * 100) 1 calc(var(--r) * 300px);
        border-radius: 12px;
        overflow: hidden;
        background: var(--stage);
        box-shadow: 0 0 0 1px var(--line);
        isolation: isolate;
      }
      .pic,
      .overlay {
        grid-area: 1 / 1;
      }
      .pic {
        position: relative;
        align-self: start;
        aspect-ratio: var(--ar);
      }
      /* The card's placeholder and its picture, under its words. */
      .ground,
      .drawing,
      .media {
        position: absolute;
        inset: 0;
        z-index: 0;
      }
      .ground--server {
        background: #111217;
      }
      /* A slot's clip or still is the card's background (C1064): filling
         the card, never something to click. */
      .media {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        pointer-events: none;
      }
      /* A reader who prefers less motion sees the placeholder under it. The
         clip still loads and plays out of sight (autoplay outranks preload,
         and a video takes no media-chosen source): stopping it would take a
         script, which this page has none of. */
      @media (prefers-reduced-motion: reduce) {
        video.media {
          display: none;
        }
      }
      /* The card's words over its picture, on a scrim dark enough that white
         text reads on any frame. */
      .overlay {
        position: relative;
        align-self: end;
        z-index: 1;
        padding: 48px 18px 16px;
        color: #fff;
        /* Clear above the words, and at least 0.86 dark from where they
           begin, so white text reads at 10:1 or better on a white frame. */
        background: linear-gradient(
          to bottom,
          rgba(17, 18, 23, 0) 0,
          rgba(17, 18, 23, 0.86) 44px,
          rgba(17, 18, 23, 0.9) 100%
        );
      }
      /* A gap's words sit at its left, so what its picture shows, at the
         right (the widget that stays white), is never under them. */
      .overlay--side {
        align-self: stretch;
        justify-self: start;
        width: 58%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 18px;
        /* As dark under the words as the bottom scrim, fading only in
           the padding past their right edge. */
        background: linear-gradient(
          to right,
          rgba(17, 18, 23, 0.9) 0,
          rgba(17, 18, 23, 0.86) calc(100% - 18px),
          rgba(17, 18, 23, 0) 100%
        );
      }
      /* On a narrow screen a gap's picture is too short to hold its words
         beside what it shows: the words go under it, in the same card, and
         the picture keeps its own shape. */
      @media (max-width: 600px) {
        .card[data-slot="still"] .overlay {
          grid-area: 2 / 1;
          width: auto;
          background: #111217;
        }
      }
      .card h3 {
        margin: 0;
        font-size: 1.08rem;
      }
      .card p {
        margin: 0.2rem 0;
        font-size: 0.95rem;
      }
      .card .stack {
        color: #e6e0d6;
        font-size: 0.85rem;
        margin: 0.15rem 0 0.4rem;
      }
      /* The overlay's entrance: one class (rise, render.ts) to take off. */
      .rise {
        animation: rise 0.6s ease-out both;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .rise {
          animation: none;
        }
      }
      .note {
        position: absolute;
        right: 8px;
        top: 8px;
        max-width: 40%;
        z-index: 1;
        margin: 0;
        font-size: 0.7rem;
        background: rgba(42, 33, 24, 0.82);
        color: #fff;
        padding: 2px 8px;
        border-radius: 999px;
      }
      .drawing--filter {
        display: grid;
        grid-template-rows: 1fr 1fr;
      }
      .drawing--filter .page {
        position: relative;
      }
      .drawing--filter .light {
        background: #fafafa;
      }
      .drawing--filter .dark {
        background: #1b1d22;
      }
      .drawing--filter .part {
        position: absolute;
        left: 45%;
        top: 22%;
        width: 40%;
        height: 56%;
        border-radius: 6px;
        background: #fff;
        border: 1px solid #ddd;
      }
      .drawing--filter .part.white {
        border: 3px solid #f2a33a;
      }
      .drawing--cores {
        background: #111217;
        padding: 18px 16px 36px;
      }
      .drawing--cores svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .cores-line {
        stroke: #888;
        stroke-dasharray: 5 5;
        fill: none;
      }
      .busy {
        fill: rgba(50, 116, 217, 0.4);
        stroke: #5794f2;
        stroke-width: 2;
      }
      .waiting {
        fill: rgba(224, 117, 45, 0.6);
      }
      h2 {
        font-size: 0.85rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 3rem 0 1rem;
      }
      h2.section-title {
        letter-spacing: 0;
        text-transform: none;
        color: var(--fg);
      }
      .two {
        display: grid;
        grid-template-columns: 3fr 2fr;
        gap: 40px;
      }
      .job {
        margin-bottom: 1.1rem;
      }
      .job h3 {
        margin: 0;
        font-size: 1rem;
      }
      .when {
        color: var(--muted);
        font-size: 0.88rem;
      }
      .job p,
      .job ul {
        margin: 0.2rem 0;
      }
      .job ul {
        padding-left: 1.1rem;
      }
      footer {
        margin-top: 3rem;
        color: var(--muted);
        font-size: 0.85rem;
      }
      @media (max-width: 900px) {
        .two {
          grid-template-columns: 1fr;
        }
        .two {
          gap: 0;
        }
        h1 {
          font-size: 2rem;
        }
        .top .in {
          padding: 28px 20px 24px;
          gap: 18px;
        }
        .photo {
          width: 96px;
          height: 96px;
        }
        main {
          padding: 22px 20px 56px;
        }
      }
    </style>
  </head>
  <body>
    <!--site:body-->
  </body>
</html>
