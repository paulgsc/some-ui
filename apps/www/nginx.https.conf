# The www image's one server block. apps/www/Dockerfile copies this file to
# /etc/nginx/templates/default.conf.template, and the base nginx:alpine image's
# docker-entrypoint.d/20-envsubst-on-templates.sh renders it to
# /etc/nginx/conf.d/default.conf when the container starts, filling in the two
# per-host values below from the environment. The image declares both with
# defaults, so a bare `docker run` serves the app, and a deployment sets them
# without any file of this repo on the host (RELEASE R8, paulgsc/server#853):
#
# - FILE_HOST_UPSTREAM: where paulgsc/server's `file_host` answers.
# - RESUME_UPSTREAM: where the résumé render service answers.
#
# Rendering writes conf.d at start, so the container's conf.d must be writable
# (a tmpfs under a read-only root); otherwise nginx serves nothing.
#
# Plain HTTP only: Caddy on the host terminates TLS and proxies here
# (docs/study-nudge.md, "Secure context").
#
# /api/file-host/ is the study nudge's route to paulgsc/server's `file_host`:
# sessions, push subscriptions, and the snooze the service worker POSTs.
# file_host serves plain HTTP on 3000, and an http:// fetch from an HTTPS page
# is mixed content, blocked before it reaches the network; this same-origin
# path sidesteps that.
#
# /api/resume/ is the same-origin route to the résumé render service
# (packages/ui/resume/scripts/serve.mjs, infra/compose/resume.yml), which
# publishes no port of its own. The LAN build's /resume-build page posts
# contact details here and gets the PDF back. The request body is the PII:
# nothing here logs it, and no client address is forwarded.
#
# Both upstreams go through a variable, with Docker's embedded DNS as the
# resolver: a literal proxy_pass is resolved once at config load, and nginx
# refuses to start with "host not found in upstream" when the service is down,
# which would take the whole app with it instead of costing only that route.
#
# What this proxy tells file_host, and what it does not (privacy stage A):
# - Host and X-Forwarded-Proto only. X-Real-IP and X-Forwarded-For are set to
#   "" on purpose: an empty value makes nginx drop the header entirely, a
#   client-supplied one included. file_host reads X-Forwarded-For only to admit
#   WebSocket upgrades, which this proxy does not carry, so forwarding the
#   client address served nothing and handed another process an address with
#   every session write.
# - /api/file-host/api/v1/tabs is answered 404 here. Stop-gap: file_host's tabs
#   captures are unauthenticated and the learning app does not use them; the
#   permanent fix is a separate decision. The route has no allowlist otherwise.
# - `access_log off;` in the server block: the stock nginx image would log each
#   request's address, full request line, referrer and user agent to stdout.
#   `error_log` is left on deliberately - nginx's error log still carries the
#   client address and request line when an upstream fails, and it cannot be
#   made address-free without dropping nginx's own errors. Bounding how long
#   what remains lives is the deployment's `logging:` block.
# apps/www/src/lib/serving-privacy/__tests__/nginx-privacy.test.ts pins all
# three, and that the image serves this file and no other.
#
# Kept in step by hand with FILE_HOST_PROXY_PATH in apps/www/src/lib/file-host-config
# and the `server.proxy` entries in apps/www/vite.config.ts.
server {
    listen 80;
    # The only server block, so nginx's default for every Host, Caddy's
    # www.home.maishatu.com included.
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # No access log: see the header comment. error_log is deliberately kept.
    access_log off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Stop-gap: file_host's tabs captures (/api/v1/tabs...) are unauthenticated
    # and the learning app does not use them, so they are not reachable through
    # this proxy. The permanent fix is a separate decision. ^~ with a longer
    # prefix than /api/file-host/ below, so nginx's longest-prefix rule picks
    # this one for any tabs path; it sits above the proxy so a reader meets it
    # first.
    location ^~ /api/file-host/api/v1/tabs {
        return 404;
    }

    # ^~ so this prefix wins over the static-asset regex location above no
    # matter what extensions get added to it.
    location ^~ /api/file-host/ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $file_host_upstream "${FILE_HOST_UPSTREAM}";

        rewrite ^/api/file-host/(.*)$ /$1 break;
        proxy_pass http://$file_host_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # "" makes nginx omit these headers altogether, a client-supplied copy
        # included: file_host gets no client address from this proxy.
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ^~ /api/resume/ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $resume_upstream "${RESUME_UPSTREAM}";

        rewrite ^/api/resume/(.*)$ /$1 break;
        proxy_pass http://$resume_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";

        # A few short strings; the service refuses more than 8 KB itself.
        client_max_body_size 16k;
        proxy_connect_timeout 5s;
        # A render is typst plus two checks, about half a second, and the
        # service runs one at a time.
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
    }

    include /etc/nginx/security-headers.conf;
}
