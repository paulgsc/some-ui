# Mounted as an envsubst template (see infra/compose/www.yml) that becomes
# /etc/nginx/conf.d/default.conf for local development. Not baked into the
# image: CI/production Docker builds have no local mkcert certs, so the
# image itself (see Dockerfile) stays plain-HTTP-only and cert-agnostic.
# This file adds a 443 listener that
# terminates TLS with the same mkcert certs `vite dev` already uses
# (apps/www/vite.config.ts / certs/nixos.local+3*.pem), so getUserMedia
# (mic access, e.g. the interview app) sees a secure context over the LAN.
#
# `include /etc/nginx/security-headers.conf` below resolves even though this
# file replaces default.conf via a bind mount: security-headers.conf is
# COPY'd into the image by the Dockerfile itself, not part of conf.d, so it
# survives the mount untouched. `include /etc/nginx/tts-proxy.conf` is the
# other half of the same trick from the other direction - that one is bind
# mounted alongside this file by infra/compose/www.yml, because it is only
# meaningful next to the compose stack that runs the TTS container.
#
# The TTS route is included in both listeners even though only the HTTPS one
# strictly needs it (see nginx.tts-proxy.conf): apps/www only defaults to it
# over HTTPS, but VITE_TTS_ENDPOINT=/api/tts/v1/audio/speech should not
# quietly 404 depending on which port the page came in on. /api/file-host/
# below is in both listeners for the same reason.
#
# /api/file-host/ is the study nudge's route to paulgsc/server's `file_host`:
# sessions, push subscriptions, and the snooze the service worker POSTs. It is
# the same mixed-content problem the TTS route solves - file_host serves plain
# HTTP on 3000 and an http:// fetch from this file's 443 listener is blocked
# before it reaches the network - except that here the HTTPS listener is not one
# deployment among several, it is the only one that can run the feature at all:
# service workers, Notification and PushManager are gated on a secure context.
#
# Unlike the TTS container, file_host is another repository's process and is
# normally run on the host rather than on some-ui-network, so $file_host_upstream
# below is templated from FILE_HOST_UPSTREAM (infra/compose/www.yml), which
# defaults to the Docker host gateway. infra/compose/www.yml also maps
# host.docker.internal to that gateway (Docker Desktop already does; Linux
# needs the extra_hosts entry there). If you do run file_host as a compose
# service on shared-dev-network instead, infra/compose/monitoring.yml
# overrides FILE_HOST_UPSTREAM to that service's name - no edit needed here.
#
# Kept in step by hand with FILE_HOST_PROXY_PATH in apps/www/src/lib/file-host-config
# and the `server.proxy` entry in apps/www/vite.config.ts.
server {
    listen 80;
    server_name localhost nixos.local;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # ^~ so this prefix wins over the static-asset regex location above no
    # matter what extensions get added to it. The upstream goes through a
    # variable with Docker's embedded DNS as the resolver, exactly as
    # nginx.tts-proxy.conf does: a literal proxy_pass is resolved once at
    # config load, and nginx refuses to start with "host not found in
    # upstream" when file_host is down - which would take the whole app with
    # it instead of costing only sessions and reminders.
    location ^~ /api/file-host/ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $file_host_upstream "${FILE_HOST_UPSTREAM}";

        rewrite ^/api/file-host/(.*)$ /$1 break;
        proxy_pass http://$file_host_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    include /etc/nginx/tts-proxy.conf;
    include /etc/nginx/security-headers.conf;
}

server {
    listen 443 ssl;
    server_name nixos.local;

    ssl_certificate     /etc/nginx/certs/nixos.local+3.pem;
    ssl_certificate_key /etc/nginx/certs/nixos.local+3-key.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # ^~ so this prefix wins over the static-asset regex location above no
    # matter what extensions get added to it. The upstream goes through a
    # variable with Docker's embedded DNS as the resolver, exactly as
    # nginx.tts-proxy.conf does: a literal proxy_pass is resolved once at
    # config load, and nginx refuses to start with "host not found in
    # upstream" when file_host is down - which would take the whole app with
    # it instead of costing only sessions and reminders.
    location ^~ /api/file-host/ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $file_host_upstream "${FILE_HOST_UPSTREAM}";

        rewrite ^/api/file-host/(.*)$ /$1 break;
        proxy_pass http://$file_host_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    include /etc/nginx/tts-proxy.conf;
    include /etc/nginx/security-headers.conf;
}
