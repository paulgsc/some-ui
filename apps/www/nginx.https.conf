# Mounted as an envsubst template (see infra/compose/www.yml) that becomes
# /etc/nginx/conf.d/default.conf for local development. Not baked into the
# image, which (see Dockerfile) stays plain-HTTP-only.
#
# Plain HTTP only: Caddy on the host terminates TLS and proxies here
# (docs/study-nudge.md, "Secure context").
#
# `include /etc/nginx/security-headers.conf` below resolves even though this
# file replaces default.conf via a bind mount: security-headers.conf is
# COPY'd into the image by the Dockerfile itself, not part of conf.d, so it
# survives the mount untouched. `include /etc/nginx/tts-proxy.conf` is the
# other half of the same trick from the other direction - that one is bind
# mounted alongside this file by infra/compose/www.yml, because it is only
# meaningful next to the compose stack that runs the TTS container.
#
# /api/file-host/ is the study nudge's route to paulgsc/server's `file_host`:
# sessions, push subscriptions, and the snooze the service worker POSTs. It is
# the same mixed-content problem the TTS route solves - file_host serves plain
# HTTP on 3000 and an http:// fetch from an HTTPS page is blocked before it
# reaches the network.
#
# Unlike the TTS container, file_host is another repository's process, so
# $file_host_upstream below is templated from FILE_HOST_UPSTREAM
# (infra/compose/www.yml), which defaults to the Docker host gateway for
# file_host run directly on the host. infra/compose/www.yml also maps
# host.docker.internal to that gateway (Docker Desktop already does; Linux
# needs the extra_hosts entry there). A container-run file_host on
# shared-dev-network that only `expose`s its port is a FILE_HOST_UPSTREAM
# override (its service name) plus the monitoring-network membership already
# on this service - not an edit here either way.
#
# What this proxy tells file_host, and what it does not (privacy stage A):
# - Host and X-Forwarded-Proto only. X-Real-IP and X-Forwarded-For are set to
#   "" on purpose: an empty value makes nginx drop the header entirely, a
#   client-supplied one included. file_host reads X-Forwarded-For only to admit
#   WebSocket upgrades, which this proxy does not carry, so forwarding the
#   client address served nothing and handed another process an address with
#   every session write.
# - /api/file-host/api/v1/tabs is answered 404 here. Stop-gap: file_host's tabs
#   captures are unauthenticated and the learning app does not use them; the
#   permanent fix is a separate decision. The route has no allowlist otherwise.
# - `access_log off;` in the server block (the Dockerfile's server block does
#   the same): the stock nginx image would log each request's address, full
#   request line, referrer and user agent to stdout. `error_log` is left on
#   deliberately - nginx's error log still carries the client address and
#   request line when an upstream fails, and it cannot be made address-free
#   without dropping nginx's own errors.
# apps/www/src/lib/serving-privacy/__tests__/nginx-privacy.test.ts pins all
# three, so a "tidy-up" cannot quietly bring any of them back.
#
# Kept in step by hand with FILE_HOST_PROXY_PATH in apps/www/src/lib/file-host-config
# and the `server.proxy` entry in apps/www/vite.config.ts.
server {
    listen 80;
    # The only server block, so nginx's default for every Host, Caddy's
    # www.home.maishatu.com included.
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # No access log: see the header comment. error_log is deliberately kept.
    access_log off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Stop-gap: file_host's tabs captures (/api/v1/tabs...) are unauthenticated
    # and the learning app does not use them, so they are not reachable through
    # this proxy. The permanent fix is a separate decision. ^~ with a longer
    # prefix than /api/file-host/ below, so nginx's longest-prefix rule picks
    # this one for any tabs path; it sits above the proxy so a reader meets it
    # first.
    location ^~ /api/file-host/api/v1/tabs {
        return 404;
    }

    # ^~ so this prefix wins over the static-asset regex location above no
    # matter what extensions get added to it. The upstream goes through a
    # variable with Docker's embedded DNS as the resolver, exactly as
    # nginx.tts-proxy.conf does: a literal proxy_pass is resolved once at
    # config load, and nginx refuses to start with "host not found in
    # upstream" when file_host is down - which would take the whole app with
    # it instead of costing only sessions and reminders.
    location ^~ /api/file-host/ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $file_host_upstream "${FILE_HOST_UPSTREAM}";

        rewrite ^/api/file-host/(.*)$ /$1 break;
        proxy_pass http://$file_host_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # "" makes nginx omit these headers altogether, a client-supplied copy
        # included: file_host gets no client address from this proxy.
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    include /etc/nginx/tts-proxy.conf;
    include /etc/nginx/security-headers.conf;
}
