# Mounted over /etc/nginx/conf.d/default.conf by docker-compose.www.yml for
# local development. Not baked into the image: CI/production Docker builds
# have no local mkcert certs, so the image itself (see Dockerfile) stays
# plain-HTTP-only and cert-agnostic. This file adds a 443 listener that
# terminates TLS with the same mkcert certs `vite dev` already uses
# (apps/www/vite.config.ts / certs/nixos.local+3*.pem), so getUserMedia
# (mic access, e.g. the interview app) sees a secure context over the LAN.
server {
    listen 80;
    server_name localhost nixos.local;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
}

server {
    listen 443 ssl;
    server_name nixos.local;

    ssl_certificate     /etc/nginx/certs/nixos.local+3.pem;
    ssl_certificate_key /etc/nginx/certs/nixos.local+3-key.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
}
