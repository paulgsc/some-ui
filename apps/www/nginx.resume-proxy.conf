# Same-origin route to the résumé render service: /api/resume/* -> the
# `resume-render` container from infra/compose/resume.yml, which publishes no
# port of its own. The LAN build's /resume-build page posts contact details
# here and gets the PDF back.
#
# `include`d by nginx.https.conf and mounted by infra/compose/www.yml, the way
# nginx.tts-proxy.conf is, for the reasons that file gives.
#
# The request body is the PII. Nothing here logs it (the image turns the
# access log off), and no client address is forwarded: the service has no use
# for one.
location ^~ /api/resume/ {
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $resume_upstream "resume-render:3100";

    rewrite ^/api/resume/(.*)$ /$1 break;
    proxy_pass http://$resume_upstream;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";

    # A few short strings; the service refuses more than 8 KB itself.
    client_max_body_size 16k;
    proxy_connect_timeout 5s;
    # A render is typst plus two checks, about half a second, and the service
    # runs one at a time.
    proxy_read_timeout 90s;
    proxy_send_timeout 30s;
}
