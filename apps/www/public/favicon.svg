<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="64"
  height="64"
  role="img"
  aria-label="Some UI"
>
  <title>Some UI</title>
  <!--
    The mochi: one plump honey cell with a face. One solid shape on purpose:
    the seven-cell comb it replaced was legible at 16px only because of the
    gaps between its cells, and at launcher and splash size those gaps read
    as a cluster of holes.

    Geometry (kept in step with MOCHI_BODY and MOCHI_FACE in
    packages/ui/shared/src/components/brand, which draws the same mark for
    in-app use; apps/www/src/lib/brand/favicon.test.ts holds the two to it):
    a flat-top hexagon of circumradius 19 rounded by 6, the face a little
    below centre. At 16px the face is a blur of two darker dots and the shape
    still reads as one round cell, which is all a tab icon needs.
  -->
  <style>
    /* Honey holds on a dark tab strip; a light one takes the deeper honey,
       as the comb's light pairing did, so the body keeps its edge. */
    .body { fill: #f5b75b; }
    .shine { fill: #fde4b8; }
    @media (prefers-color-scheme: light) {
      .body { fill: #e9962a; }
      .shine { fill: #f8cf8c; }
    }
  </style>
  <path
    class="body"
    d="M56.2 29A6 6 0 0 1 56.2 35L46.7 51.45A6 6 0 0 1 41.5 54.45L22.5 54.45A6 6 0 0 1 17.3 51.45L7.8 35A6 6 0 0 1 7.8 29L17.3 12.55A6 6 0 0 1 22.5 9.55L41.5 9.55A6 6 0 0 1 46.7 12.55Z"
  />
  <ellipse
    class="shine"
    cx="21"
    cy="19.5"
    rx="5.5"
    ry="3"
    transform="rotate(-32 21 19.5)"
  />
  <ellipse cx="19.5" cy="38.5" rx="3.4" ry="2.2" fill="#f08f7e" opacity="0.7" />
  <ellipse cx="44.5" cy="38.5" rx="3.4" ry="2.2" fill="#f08f7e" opacity="0.7" />
  <path
    fill="#472b1b"
    d="M22.9 33A2.6 2.6 0 1 0 28.1 33A2.6 2.6 0 1 0 22.9 33Z M35.9 33A2.6 2.6 0 1 0 41.1 33A2.6 2.6 0 1 0 35.9 33Z M28.5 38.4Q32 43.4 35.5 38.4Q32 40.2 28.5 38.4Z"
  />
</svg>
