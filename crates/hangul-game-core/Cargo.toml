[package]
name = "hangul-game-core"
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { workspace = true , features = ["derive"] }
serde_json = { workspace = true }
rand = { version = "0.8", features = ["small_rng"] }
getrandom = { version = "0.2", features = ["js"] } 

[lints]
workspace = true

# getrandom is never called directly, but must be a direct dependency for
# its "js" feature to activate on the wasm32 target (rand's getrandom
# backend otherwise panics at runtime under wasm-pack).
[package.metadata.cargo-machete]
ignored = ["getrandom"]
