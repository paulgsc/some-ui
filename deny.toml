[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT-0",
    "Unicode-3.0",
]

[bans]
# Diverging-deps tracking: warns (does not fail CI) when two crates in the
# resolved graph depend on different major/minor versions of the same
# dependency, e.g. rand 0.8 vs 0.9 across wasm crates. Checked by the
# rust-deny "bans" job in _deny-checks.yml.
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = ["https://github.com"]