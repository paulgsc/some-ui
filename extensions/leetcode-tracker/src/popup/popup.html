<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Streak Tracker Settings</title>
    <link rel="stylesheet" href="styles/popup.css" />
  </head>
  <body>
    <div class="popup-container">
      <div class="popup-header">
        <div class="header-icon">
          <svg
            viewBox="0 0 24 24"
            width="24"
            height="24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M9.588 2.085a1 1 0 01.97.092c2.85 1.966 4.498 4.744 5.31 6.67l.854-.885a1 1 0 011.56.154c2.177 3.38 2.211 7.383.521 10.3C17.039 21.459 13.583 22 11.977 22c-1.569 0-4.905-.27-6.825-3.584-.832-1.435-1.27-3.053-1.125-4.704.146-1.66.876-3.284 2.264-4.721.86-.891 1.505-2.122 1.957-3.322.449-1.193.68-2.278.752-2.806a1 1 0 01.588-.778z"
              fill="url(#flame-gradient-popup)"
            />
            <defs>
              <linearGradient
                id="flame-gradient-popup"
                x1="12"
                x2="12"
                y1="2"
                y2="22"
                gradientUnits="userSpaceOnUse"
              >
                <stop stop-color="#FFA116" />
                <stop offset="1" stop-color="#F9772E" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1>Streak Tracker</h1>
      </div>

      <div class="popup-content">
        <div class="setting-row">
          <div class="setting-info">
            <div class="setting-label">Enable Tracking</div>
            <div class="setting-description">
              Show streak indicator on all pages
            </div>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="enableToggle" checked />
            <span class="slider"></span>
          </label>
        </div>

        <div class="divider"></div>

        <div class="stats-section">
          <h2>Current Streaks</h2>
          <div class="stat-card">
            <div class="stat-icon leetcode">
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="currentColor"
              >
                <path
                  d="M13.483 0a1.374 1.374 0 0 0-.961.438L7.116 6.226l-3.854 4.126a5.266 5.266 0 0 0-1.209 2.104 5.35 5.35 0 0 0-.125.513 5.527 5.527 0 0 0 .062 2.362 5.83 5.83 0 0 0 .349 1.017 5.938 5.938 0 0 0 1.271 1.818l4.277 4.193.039.038c2.248 2.165 5.852 2.133 8.063-.074l2.396-2.392c.54-.54.54-1.414.003-1.955a1.378 1.378 0 0 0-1.951-.003l-2.396 2.392a3.021 3.021 0 0 1-4.205.038l-.02-.019-4.276-4.193c-.652-.64-.972-1.469-.948-2.263a2.68 2.68 0 0 1 .066-.523 2.545 2.545 0 0 1 .619-1.164L9.13 8.114c1.058-1.134 3.204-1.27 4.43-.278l3.501 2.831c.593.48 1.461.387 1.94-.207a1.384 1.384 0 0 0-.207-1.943l-3.5-2.831c-.8-.647-1.766-1.045-2.774-1.202l2.015-2.158A1.384 1.384 0 0 0 13.483 0zm-2.866 12.815a1.38 1.38 0 0 0-1.38 1.382 1.38 1.38 0 0 0 1.38 1.382H20.79a1.38 1.38 0 0 0 1.38-1.382 1.38 1.38 0 0 0-1.38-1.382z"
                />
              </svg>
            </div>
            <div class="stat-details">
              <div class="stat-platform">LeetCode</div>
              <div class="stat-value" id="leetcodeStreak">Loading...</div>
            </div>
          </div>
        </div>

        <div class="footer-info">
          <p>Data synced with local database</p>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
