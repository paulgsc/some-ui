<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOYO - Content Censor</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 400px;
        min-height: 300px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #1a1a1a;
        color: #fff;
        padding: 16px;
      }

      .header {
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid #333;
      }

      .header h1 {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 4px;
      }

      .header p {
        font-size: 12px;
        color: #888;
      }

      .section {
        margin-bottom: 24px;
      }

      .section-title {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 12px;
        color: #aaa;
      }

      .whitelist {
        background: #252525;
        border-radius: 8px;
        padding: 12px;
        max-height: 200px;
        overflow-y: auto;
      }

      .whitelist-empty {
        text-align: center;
        color: #666;
        font-size: 13px;
        padding: 20px;
      }

      .whitelist-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px;
        background: #2a2a2a;
        border-radius: 6px;
        margin-bottom: 8px;
      }

      .whitelist-item:last-child {
        margin-bottom: 0;
      }

      .channel-info {
        flex: 1;
      }

      .channel-name {
        font-size: 13px;
        font-weight: 500;
      }

      .channel-date {
        font-size: 11px;
        color: #666;
        margin-top: 2px;
      }

      .remove-btn {
        background: #ff4444;
        color: #fff;
        border: none;
        padding: 4px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        transition: background 0.2s;
      }

      .remove-btn:hover {
        background: #ff6666;
      }

      .action-buttons {
        display: flex;
        gap: 8px;
      }

      .btn {
        flex: 1;
        padding: 10px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.2s;
      }

      .btn-primary {
        background: #4a9eff;
        color: #fff;
      }

      .btn-primary:hover {
        background: #6bb0ff;
      }

      .btn-secondary {
        background: #333;
        color: #fff;
      }

      .btn-secondary:hover {
        background: #444;
      }

      .stats {
        display: flex;
        gap: 12px;
        margin-top: 16px;
      }

      .stat {
        flex: 1;
        background: #252525;
        padding: 12px;
        border-radius: 8px;
        text-align: center;
      }

      .stat-value {
        font-size: 24px;
        font-weight: 600;
        color: #4a9eff;
      }

      .stat-label {
        font-size: 11px;
        color: #888;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>🔒 BOYO</h1>
      <p>Progressive Content Masking</p>
    </div>

    <div class="section">
      <div class="section-title">Whitelisted Channels</div>
      <div class="whitelist" id="whitelist">
        <div class="whitelist-empty">No channels whitelisted yet</div>
      </div>
    </div>

    <div class="section">
      <div class="action-buttons">
        <button class="btn btn-secondary" id="clearSession">
          Clear Session
        </button>
        <button class="btn btn-primary" id="reload">Reload Page</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="whitelistCount">0</div>
        <div class="stat-label">Trusted Channels</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="sessionCount">0</div>
        <div class="stat-label">Revealed This Session</div>
      </div>
    </div>

    <script type="module" src="./popup.tsx"></script>
  </body>
</html>
