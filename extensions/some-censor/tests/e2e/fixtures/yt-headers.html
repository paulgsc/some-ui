<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BOYO Fixture — Headers and the Player</title>
  </head>
  <body>
    <!--
    BOYO fixture: images outside a card (#1804). The page header's
    banner, cover and backdrop (inline, and moved into the seamless header's
    portal), the tabbed header's own banner and the Polymer playlist header
    keep the nesting YouTube's desktop bundle draws; the player's overlays
    are the bare elements that carry the image. Each image is set from the
    script below; none may paint while the extension is on.
  -->
    <ytd-app>
      <div id="images">
        <yt-page-header-view-model class="ytPageHeaderViewModelHost">
          <div class="ytPageHeaderViewModelBannerContainer">
            <yt-image-banner-view-model class="ytImageBannerViewModelHost"
              ><img data-name="header banner"
            /></yt-image-banner-view-model>
          </div>
          <div class="ytPageHeaderViewModelBackground">
            <cinematic-container-view-model
              ><img
                class="ytCoreImageHost ytCinematicContainerViewModelBackgroundImage"
                data-name="header backdrop"
            /></cinematic-container-view-model>
          </div>
          <yt-content-preview-image-view-model
            class="ytContentPreviewImageViewModelHost"
            ><img data-name="header cover"
          /></yt-content-preview-image-view-model>
        </yt-page-header-view-model>
        <yt-page-header-portal class="page-header-portal">
          <div class="ytPageHeaderViewModelBackground">
            <cinematic-container-view-model
              ><img
                class="ytCoreImageHost ytCinematicContainerViewModelSeamlessBackgroundImage"
                data-name="portal backdrop"
            /></cinematic-container-view-model>
          </div>
        </yt-page-header-portal>
        <ytd-tabbed-page-header
          ><yt-image-banner-view-model class="ytImageBannerViewModelHost"
            ><img data-name="tabbed banner" /></yt-image-banner-view-model
        ></ytd-tabbed-page-header>
        <ytd-playlist-header-renderer
          ><div class="immersive-header-background-wrapper">
            <img class="blurred-image" data-name="playlist backdrop" />
          </div>
          <img data-name="playlist cover"
        /></ytd-playlist-header-renderer>
        <div class="ytp-ce-element">
          <div class="ytp-ce-covering-image" data-name="end screen"></div>
          <div class="ytp-ce-expanding-image" data-name="end screen art"></div>
        </div>
        <div class="ytp-videowall-still-image" data-name="video wall"></div>
        <div
          class="ytp-modern-videowall-still-image"
          data-name="modern video wall"
        ></div>
        <div
          class="ytp-autonav-endscreen-upnext-thumbnail"
          data-name="autoplay card"
        ></div>
        <div
          class="ytp-autonav-thumbnail-small"
          data-name="autoplay small"
        ></div>
        <div class="ytp-suggestion-image" data-name="suggestion"></div>
        <div
          class="ytp-more-videos-button-thumbnail"
          data-name="more videos button"
        ></div>
        <div
          class="ytp-video-menu-item-thumbnail"
          data-name="playlist menu"
        ></div>
      </div>
    </ytd-app>
    <script>
      const image =
        "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='100%25' height='100%25' fill='%23f0f'/%3E%3C/svg%3E"
      for (const el of document.querySelectorAll("#images [data-name]")) {
        if (el instanceof HTMLImageElement) el.src = image
        else el.style.backgroundImage = `url("${image}")`
      }
    </script>
  </body>
</html>
