<!doctype html>

    <style>
      /* Stand-ins for YouTube's own layout, so a screenshot has boxes to
         compare. The image fills a box sized without it, as on youtube.com. */
      body {
        background: #0f0f0f;
        color: #fff;
        font-family: sans-serif;
        margin: 0;
        padding: 20px;
      }
      ytd-video-renderer,
      yt-lockup-view-model {
        display: block;
        margin-bottom: 16px;
        width: 420px;
      }
      ytd-thumbnail a#thumbnail,
      .ytThumbnailViewModelImage {
        background: #272727;
        display: block;
        height: 180px;
        position: relative;
        width: 320px;
      }
      #channel-thumbnail yt-img-shadow,
      .ytSpecAvatarShapeHost {
        border-radius: 50%;
        display: block;
        height: 36px;
        overflow: hidden;
        width: 36px;
      }
      img {
        height: 100%;
        inset: 0;
        position: absolute;
        width: 100%;
      }
      #channel-thumbnail yt-img-shadow img,
      .ytSpecAvatarShapeHost img {
        position: static;
      }
      #overlays,
      .ytThumbnailBottomOverlayViewModelHost {
        bottom: 4px;
        position: absolute;
        right: 4px;
      }
      ytd-video-preview {
        display: block;
        height: 180px;
        position: relative;
        width: 320px;
      }
    </style>
  </head>
