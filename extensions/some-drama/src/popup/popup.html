<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>C-Drama Tracker</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 320px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #fce4ec 0%, #fff3e0 100%);
        color: #333;
      }

      .container {
        padding: 20px;
      }

      h1 {
        font-size: 20px;
        margin-bottom: 16px;
        color: #d81b60;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .emoji {
        font-size: 24px;
      }

      .input-group {
        margin-bottom: 12px;
      }

      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 4px;
        color: #666;
      }

      input {
        width: 100%;
        padding: 8px 12px;
        border: 2px solid #f8bbd0;
        border-radius: 6px;
        font-size: 14px;
        background: white;
        transition: border-color 0.2s;
      }

      input:focus {
        outline: none;
        border-color: #d81b60;
      }

      .button-group {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }

      button {
        flex: 1;
        padding: 10px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn-primary {
        background: #d81b60;
        color: white;
      }

      .btn-primary:hover {
        background: #c2185b;
        transform: translateY(-1px);
        box-shadow: 0 4px 8px rgba(216, 27, 96, 0.3);
      }

      .btn-secondary {
        background: #fff;
        color: #d81b60;
        border: 2px solid #d81b60;
      }

      .btn-secondary:hover {
        background: #fce4ec;
      }

      .status {
        margin-top: 12px;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 12px;
        text-align: center;
      }

      .status.success {
        background: #c8e6c9;
        color: #2e7d32;
      }

      .status.error {
        background: #ffcdd2;
        color: #c62828;
      }

      .status.info {
        background: #bbdefb;
        color: #1565c0;
      }

      .tracked-info {
        margin-top: 16px;
        padding: 12px;
        background: white;
        border-radius: 8px;
        border: 2px solid #f8bbd0;
      }

      .tracked-info h3 {
        font-size: 14px;
        margin-bottom: 8px;
        color: #d81b60;
      }

      .tracked-info p {
        font-size: 12px;
        color: #666;
        margin-bottom: 4px;
      }

      .shortcuts {
        margin-top: 16px;
        padding: 12px;
        background: rgba(255, 255, 255, 0.6);
        border-radius: 8px;
        font-size: 11px;
        color: #666;
      }

      .shortcuts h4 {
        font-size: 12px;
        margin-bottom: 6px;
        color: #d81b60;
      }

      .shortcuts ul {
        list-style: none;
        padding-left: 0;
      }

      .shortcuts li {
        margin-bottom: 3px;
      }

      .shortcuts kbd {
        background: #fff;
        padding: 2px 6px;
        border-radius: 3px;
        border: 1px solid #ddd;
        font-family: monospace;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1><span class="emoji">🎭</span> C-Drama Tracker</h1>

      <div class="input-group">
        <label for="dramaId">Drama ID / Name</label>
        <input type="text" id="dramaId" placeholder="e.g., the-untamed" />
      </div>

      <div class="input-group">
        <label for="episodeNumber">Episode Number</label>
        <input type="number" id="episodeNumber" placeholder="e.g., 1" min="1" />
      </div>

      <div class="button-group">
        <button class="btn-primary" id="markBtn">Track This Tab</button>
        <button class="btn-secondary" id="unmarkBtn">Stop Tracking</button>
      </div>

      <div id="status" class="status" style="display: none"></div>

      <div id="trackedInfo" class="tracked-info" style="display: none">
        <h3>Currently Tracking:</h3>
        <p id="trackedDrama"></p>
        <p id="trackedEpisode"></p>
      </div>

      <div class="shortcuts">
        <h4>⌨️ Keyboard Shortcuts</h4>
        <ul>
          <li><kbd>1</kbd> - Joy 😊</li>
          <li><kbd>2</kbd> - Sadness 😢</li>
          <li><kbd>3</kbd> - Surprise 😲</li>
          <li><kbd>4</kbd> - Fear 😱</li>
          <li><kbd>5</kbd> - Anger 😠</li>
        </ul>
      </div>
    </div>

    <script src="./popup.ts"></script>
  </body>
</html>
