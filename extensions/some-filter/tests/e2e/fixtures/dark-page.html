<!DOCTYPE html>
<!--
  Dark-page fixture: a page that is genuinely dark (not prepaint-poisoned).

  Background rgb(30,30,30) → luminance ≈ 0.012 → isLight=false, skip=true.
  (skip fires when avgLuminance < 0.2 — classifier avoids inverting already-dark pages.)
  Expected outcome: data-sw-theme-applied="none", no data-sw-dark on <html>.

  This distinguishes a real dark page from a prepaint-poisoned white page:
  both produce themeApplied="none", but only the poisoned case has luminance ≈ 0.005
  on what should be a white page.
-->
<html style="background-color: rgb(30, 30, 30);">
<head>
  <meta charset="utf-8" />
  <title>Dark Page Fixture</title>
</head>
<body style="background-color: rgb(30, 30, 30); margin: 0; color: rgb(220, 220, 220);">
  <main style="background-color: rgb(30, 30, 30);">
    <h1>Dark Page Fixture</h1>
    <p>Dark background — dark theme should NOT be applied.</p>
  </main>
</body>
</html>
