<!doctype html>
<!--
  SF-RC4 (#1343) regression fixture — a `:hover`-only colour swap on a
  non-allowlisted element, which is exactly the case #1343 confirmed live:
  a real `getComputedStyle` change with zero corresponding DOM mutation, so
  `pipeline.ts`'s Sensor (`childList` plus `attributeFilter: ["class",
  "style"]`) and every other observation channel in this codebase is blind
  to it.

  ── Why the colours are what they are ──

  #hover-carrier declares no inline `color`, so before any interaction it
  inherits #panel's — which the co-located (#741) fix corrects along with
  #panel's own background, leaving it legible. `ownTextColor` therefore
  reports "no own colour" for it (computed equals the inherited value) and
  the audit registers no candidate at all. That is the correct resting
  state, and the spec asserts it: the carrier must be untagged *before* the
  hover, or the test would pass for the wrong reason.

  On hover the rule below sets a near-black colour that differs from the
  inherited one, so `ownTextColor` now resolves it as an own colour and the
  carrier becomes a candidate — dark text on the darkened #panel. Nothing
  about that transition is a DOM mutation.

  A <div>, deliberately: `theme-apply.ts`'s DARK_THEME_BODY_RULES cover
  `p`/`span`/`label`/… and form controls, so a carrier of one of those tags
  would have its colour forced by the static layer and never reach this
  channel. `div` is outside every one of those `:where()` lists, which is
  what "non-allowlisted" means here.

  #focus-carrier is the same shape one state over, driven by `:focus`
  instead — a `tabindex` makes an ordinary div focusable. It exists so the
  spec can prove the focus half independently rather than assuming the two
  share a code path because they happen to be listed together.

  #static-carrier has no interaction rule at all. It is the control: it must
  stay untagged through the whole spec, so a pass that tagged everything
  indiscriminately would fail rather than look like success.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Interaction State Fixture</title>
    <style>
      #hover-carrier:hover {
        color: rgb(10, 10, 10);
      }
      #focus-carrier:focus {
        color: rgb(12, 12, 12);
        outline: none;
      }
    </style>
  </head>
  <body style="background-color: rgb(255, 255, 255); margin: 0">
    <div
      id="panel"
      style="
        background-color: rgb(250, 250, 250);
        color: rgb(40, 40, 40);
        padding: 24px;
      "
    >
      <div id="hover-carrier">Hover changes this text's colour.</div>
      <div id="focus-carrier" tabindex="0">
        Focus changes this text's colour.
      </div>
      <div id="static-carrier">This text never changes colour.</div>
    </div>
  </body>
</html>
