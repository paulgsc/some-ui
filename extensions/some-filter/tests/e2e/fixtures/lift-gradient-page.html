<!doctype html>
<!--
  Lift-gradient fixture (ADR 0002 lift-gradient amendment,
  `adapter/enforcement-sheet.ts`'s own header — "border soup: containers get
  a lift gradient, not a forced border"). Exercises LIFT_SELECTOR
  (`:not(:only-child)` siblings) and the narrowed BORDER_CONTAINER_SELECTOR
  (form-control affordance only — structural containers no longer get a
  forced border).

  #sibling-a/#sibling-b: two div siblings under #sibling-group — each is
  NOT :only-child, so each should get the lift gradient.

  #lone-child: the sole child of #lone-parent — IS :only-child of its own
  parent, so it should get no lift (background-image: none), same as a
  chain of single-child wrappers collapsing to nothing.

  #ext-marked: a div sibling among main's other children (so it would
  otherwise match LIFT_SELECTOR) carrying [data-my-ext] — must get neither
  the lift nor a forced border, same exclusion every other rule in the
  sheet respects.

  #text-input/#action-button/#modal-dialog: BORDER_CONTAINER_SELECTOR's
  remaining affordance-only selector — these should still get the forced
  1px solid border the structural containers above no longer do.

  #tall-file/#tall-file-sibling: two sibling divs, one of them 6000px tall —
  a stand-in for GitHub's PR "Files changed" tab, where each changed file's
  diff sits in its own CONTAINER-matched sibling box as tall as that file's
  own line count. Exercises the raster-cost bound: the lift's
  background-size must stay a fixed 3rem regardless of this box's real
  height, not scale to it (this module's own header, "the lift's raster
  cost must not scale with container height").
-->
<html style="background-color: rgb(255, 255, 255)">
  <head>
    <meta charset="utf-8" />
    <title>Lift Gradient Fixture</title>
  </head>
  <body style="background-color: rgb(255, 255, 255); margin: 0">
    <main style="background-color: rgb(255, 255, 255)">
      <div id="sibling-group">
        <div id="sibling-a">Sibling A</div>
        <div id="sibling-b">Sibling B</div>
      </div>
      <div id="lone-parent">
        <div id="lone-child">Only child of its own parent</div>
      </div>
      <div id="ext-marked" data-my-ext>Extension DOM</div>
      <input id="text-input" type="text" />
      <button id="action-button">Action</button>
      <dialog id="modal-dialog" open>Dialog content</dialog>
      <div id="tall-file" style="height: 6000px">Large file diff stand-in</div>
      <div id="tall-file-sibling">Next file</div>
    </main>
  </body>
</html>
