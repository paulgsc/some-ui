<!DOCTYPE html>
<!--
  Transparent-page fixture: no explicit background on any element.

  classifyPage() collects zero opaque samples → avgLuminance=null →
  fallback: isLight=true, skip=false (bias toward applying dark theme on ambiguous pages).
  Expected outcome: data-sw-theme-applied="dark", data-sw-dark on <html>.
-->
<html>
<head>
  <meta charset="utf-8" />
  <title>Transparent Page Fixture</title>
</head>
<body style="margin: 0;">
  <main>
    <h1>Transparent Page Fixture</h1>
    <p>No explicit background — zero opaque samples — dark theme applied via fallback.</p>
  </main>
</body>
</html>
