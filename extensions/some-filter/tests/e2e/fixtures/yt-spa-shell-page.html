<!doctype html>
<!--
  YouTube-watch-shaped SPA fixture for yt-navigate-evidence.spec.ts.

  What makes it YouTube-shaped is which elements survive a route swap, not
  what they look like:

    - #masthead / #guide / #watch are the persistent app shell. They are
      light, so the first round tags them `data-sw-patched="<key>"`, and a
      yt-navigate-* route swap keeps the very same elements (YouTube reuses
      ytd-app, ytd-masthead, ytd-watch-flexy across watch -> watch).
    - #player is persistent and near-black, so it is tagged "preserve".
    - #route is the part the router replaces: a few mid-grey controls,
      below LIGHT_THRESHOLD (so never tagged) and above PRESERVE_THRESHOLD.

  `html` declares no background of its own and `body` does. With the veil
  up (`sw-dirty`), pipeline.ts's readHtmlCanvasAttr() cannot trust the
  body fallback and reports no canvas evidence at all, so the page-level
  verdict rests entirely on the per-surface keys.

  Pre-navigation the distinct-key mean is light (three light shell keys,
  three greys), so the page is themed. The spec then swaps #route for new
  greys with different keys, which is what a real watch -> watch navigation
  does to the controls under the player.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>YouTube SPA Shell Fixture</title>
  </head>
  <body style="background-color: rgb(255, 255, 255); margin: 0">
    <div
      id="masthead"
      style="background-color: rgb(255, 255, 255); height: 56px; padding: 8px"
    >
      masthead
    </div>
    <div style="display: flex">
      <div
        id="guide"
        style="
          background-color: rgb(249, 249, 249);
          width: 200px;
          height: 400px;
        "
      >
        guide
      </div>
      <div
        id="watch"
        style="background-color: rgb(242, 242, 242); flex: 1; padding: 8px"
      >
        <div
          id="player"
          style="background-color: rgb(0, 0, 0); height: 240px; color: #fff"
        >
          player
        </div>
        <div id="route">
          <div style="background-color: rgb(80, 80, 80); padding: 4px">a</div>
          <div style="background-color: rgb(96, 96, 96); padding: 4px">b</div>
          <div style="background-color: rgb(112, 112, 112); padding: 4px">
            c
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
