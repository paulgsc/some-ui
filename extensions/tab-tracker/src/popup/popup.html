<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TabLedger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #08080c;
        --bg2: #101016;
        --border: rgba(255, 255, 255, 0.07);
        --text: rgba(255, 255, 255, 0.88);
        --muted: rgba(255, 255, 255, 0.38);
        --dim: rgba(255, 255, 255, 0.14);
      }

      body {
        width: 320px;
        min-height: 120px;
        max-height: 480px;
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .header {
        padding: 12px 14px 10px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }

      .logo {
        font-family: "DM Mono", monospace;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }

      #errorBanner {
        display: none;
        padding: 6px 14px;
        background: rgba(244, 63, 94, 0.08);
        border-bottom: 1px solid rgba(244, 63, 94, 0.2);
        font-size: 10px;
        color: #fca5a5;
        letter-spacing: 0.04em;
      }

      #nodeList {
        flex: 1;
        overflow-y: auto;
        padding: 4px 0;
        color: var(--muted);
        font-family: "DM Mono", monospace;
        font-size: 10px;
        scrollbar-width: thin;
        scrollbar-color: var(--bg2) transparent;
      }

      .empty {
        padding: 24px 14px;
        text-align: center;
        line-height: 1.7;
      }

      .node-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        transition: background 0.12s ease;
      }

      .node-row:hover {
        background: var(--bg2);
      }

      .node-info {
        flex: 1;
        min-width: 0;
      }

      .node-domain {
        font-family: "DM Sans", sans-serif;
        font-size: 11px;
        font-weight: 500;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .node-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 2px;
      }

      .seg-badge {
        font-size: 8.5px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 1px 5px;
        border-radius: 3px;
        border: 1px solid;
      }

      .node-last-seen {
        font-size: 9px;
        color: var(--dim);
      }

      .node-outcomes {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }

      .outcome-pill {
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .node-visits {
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        min-width: 20px;
        text-align: right;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <span class="logo">TabLedger</span>
    </div>
    <div id="errorBanner"></div>
    <div id="nodeList">loading…</div>
    <script src="popup.js"></script>
  </body>
</html>
