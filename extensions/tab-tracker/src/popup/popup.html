<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TabLedger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0c0c10;
        --bg2: #131318;
        --bg3: #1b1b22;
        --border: rgba(255, 255, 255, 0.07);
        --border-hover: rgba(255, 255, 255, 0.12);
        --text-primary: rgba(255, 255, 255, 0.92);
        --text-secondary: rgba(255, 255, 255, 0.45);
        --text-muted: rgba(255, 255, 255, 0.25);
        --green: #22c55e;
        --amber: #f59e0b;
        --red: #ef4444;
        --violet: #7c3aed;
        --violet-light: #c084fc;
        --accent: #6366f1;
      }

      body {
        width: 360px;
        min-height: 200px;
        max-height: 560px;
        background: var(--bg);
        color: var(--text-primary);
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* ── Header ── */
      .header {
        padding: 14px 16px 12px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }

      .header-left {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .logo {
        font-family: "DM Mono", monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--text-secondary);
      }

      .session-total {
        font-family: "DM Mono", monospace;
        font-size: 20px;
        font-weight: 500;
        letter-spacing: -0.01em;
        color: var(--text-primary);
      }

      .header-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
      }

      .toggle-group {
        display: flex;
        background: var(--bg3);
        border-radius: 6px;
        padding: 2px;
        gap: 1px;
      }

      .toggle-btn {
        background: none;
        border: none;
        color: var(--text-secondary);
        font-family: "DM Mono", monospace;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.08em;
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.15s ease;
        text-transform: uppercase;
      }

      .toggle-btn.active {
        background: var(--accent);
        color: #fff;
      }

      .toggle-btn:not(.active):hover {
        color: var(--text-primary);
      }

      .reset-btn {
        background: none;
        border: 1px solid var(--border);
        color: var(--text-muted);
        font-family: "DM Mono", monospace;
        font-size: 9px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .reset-btn:hover {
        color: var(--red);
        border-color: var(--red);
      }

      /* ── Stats bar ── */
      .stats-bar {
        padding: 8px 16px;
        display: flex;
        gap: 16px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }

      .stat {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .stat-value {
        font-family: "DM Mono", monospace;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-primary);
      }

      .stat-label {
        font-size: 9.5px;
        font-weight: 400;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      /* ── Tab list ── */
      .tab-list {
        flex: 1;
        overflow-y: auto;
        padding: 4px 0;
        scrollbar-width: thin;
        scrollbar-color: var(--bg3) transparent;
      }

      .tab-list::-webkit-scrollbar {
        width: 4px;
      }

      .tab-list::-webkit-scrollbar-track {
        background: transparent;
      }

      .tab-list::-webkit-scrollbar-thumb {
        background: var(--bg3);
        border-radius: 2px;
      }

      .tab-row {
        padding: 9px 16px;
        cursor: pointer;
        transition: background 0.12s ease;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      }

      .tab-row:hover {
        background: var(--bg2);
      }

      .tab-row.expanded {
        background: var(--bg2);
      }

      .tab-main {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .tab-favicon {
        width: 14px;
        height: 14px;
        border-radius: 2px;
        flex-shrink: 0;
        object-fit: contain;
      }

      .tab-favicon-placeholder {
        width: 14px;
        height: 14px;
        border-radius: 2px;
        background: var(--bg3);
        flex-shrink: 0;
      }

      .tab-info {
        flex: 1;
        min-width: 0;
      }

      .tab-domain {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tab-title {
        font-size: 10.5px;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 1px;
      }

      .tab-right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 3px;
        flex-shrink: 0;
      }

      .tab-time {
        font-family: "DM Mono", monospace;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-primary);
      }

      .tab-tags {
        display: flex;
        gap: 3px;
      }

      .tag {
        font-family: "DM Mono", monospace;
        font-size: 8.5px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 1px 5px;
        border-radius: 3px;
      }

      .tag-rabbit-hole {
        background: rgba(124, 58, 237, 0.2);
        color: var(--violet-light);
      }
      .tag-deep-work {
        background: rgba(34, 197, 94, 0.15);
        color: #86efac;
      }
      .tag-neglected {
        background: rgba(245, 158, 11, 0.15);
        color: #fcd34d;
      }
      .tag-cold {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text-muted);
      }
      .tag-active {
        background: rgba(99, 102, 241, 0.2);
        color: #a5b4fc;
      }
      .tag-pinned {
        background: rgba(239, 68, 68, 0.15);
        color: #fca5a5;
      }

      /* ── Bar track ── */
      .bar-track {
        height: 3px;
        background: var(--bg3);
        border-radius: 2px;
        margin-top: 7px;
        overflow: hidden;
      }

      .bar-fill {
        height: 100%;
        border-radius: 2px;
        transition: width 0.4s ease;
      }

      /* ── Sparkline expand ── */
      .tab-expand {
        display: none;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
      }

      .tab-expand.open {
        display: block;
      }

      .sparkline-label {
        font-family: "DM Mono", monospace;
        font-size: 9px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 6px;
      }

      .sparkline {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 32px;
      }

      .spark-bar {
        flex: 1;
        border-radius: 2px 2px 0 0;
        min-height: 2px;
        transition: height 0.3s ease;
      }

      .pin-btn {
        margin-top: 8px;
        background: none;
        border: 1px solid var(--border);
        color: var(--text-muted);
        font-family: "DM Mono", monospace;
        font-size: 9px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .pin-btn:hover {
        color: var(--text-primary);
        border-color: var(--border-hover);
      }

      .pin-btn.pinned {
        color: #fca5a5;
        border-color: rgba(239, 68, 68, 0.3);
      }

      /* ── Export bar ── */
      .footer {
        padding: 10px 16px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: flex-end;
        flex-shrink: 0;
      }

      .export-btn {
        background: none;
        border: 1px solid var(--border);
        color: var(--text-secondary);
        font-family: "DM Mono", monospace;
        font-size: 9.5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 5px 12px;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.15s ease;
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .export-btn:hover {
        color: var(--text-primary);
        border-color: var(--border-hover);
      }

      .export-btn.copied {
        color: var(--green);
        border-color: rgba(34, 197, 94, 0.3);
      }

      /* ── Empty state ── */
      .empty-state {
        padding: 32px 16px;
        text-align: center;
        color: var(--text-muted);
        font-size: 12px;
        line-height: 1.6;
      }

      .empty-state .empty-icon {
        font-size: 28px;
        margin-bottom: 8px;
      }

      /* ── Active indicator ── */
      .active-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse-dot 2s ease-in-out infinite;
        flex-shrink: 0;
      }

      @keyframes pulse-dot {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      /* ── Loading ── */
      .loading {
        padding: 24px 16px;
        text-align: center;
        color: var(--text-muted);
        font-family: "DM Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.1em;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-left">
        <span class="logo">TabLedger</span>
        <span class="session-total" id="sessionTotal">—</span>
      </div>
      <div class="header-right">
        <div class="toggle-group">
          <button class="toggle-btn active" id="btnSession">Session</button>
          <button class="toggle-btn" id="btnAllTime">All Time</button>
        </div>
        <button class="reset-btn" id="resetBtn">Reset Session</button>
      </div>
    </div>

    <div class="stats-bar" id="statsBar">
      <div class="stat">
        <span class="stat-value" id="statTabs">—</span>
        <span class="stat-label">open tabs</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="statActive">—</span>
        <span class="stat-label">tracked</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="statTop">—</span>
        <span class="stat-label">most time</span>
      </div>
    </div>

    <div class="tab-list" id="tabList">
      <div class="loading">loading ledger…</div>
    </div>

    <div class="footer">
      <button class="export-btn" id="exportBtn">
        <span>⎘</span>
        <span id="exportLabel">Export MD</span>
      </button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
