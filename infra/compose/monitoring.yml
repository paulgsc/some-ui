# Optional override: joins www and the TTS services to shared-dev-network,
# the external network a container-run paulgsc/server `file_host` (service
# name file-host-server) lives on. Not part of the default stack and not
# pulled in by docker-compose.yml's `include:` - Compose errors out before
# starting anything if a service references an external network that
# doesn't exist yet, so folding this into base.yml/www.yml/tts.yml directly
# broke plain `docker compose up www` (or the TTS pair) on any checkout
# where the other project's stack, which owns shared-dev-network, hasn't
# been started first.
#
# Bring it in with an extra -f once that other stack is up:
#
#   docker compose -f docker-compose.yml -f infra/compose/monitoring.yml up www
#
# FILE_HOST_UPSTREAM below is what actually points apps/www/nginx.https.conf
# at the container instead of its host.docker.internal default - see
# FILE_HOST_UPSTREAM in infra/compose/www.yml and .env.example.
networks:
  monitoring-network:
    name: shared-dev-network
    external: true

services:
  www:
    networks:
      - monitoring-network
    environment:
      FILE_HOST_UPSTREAM: file-host-server:3000
  openai-edge-tts:
    networks:
      - monitoring-network
  nginx:
    networks:
      - monitoring-network
