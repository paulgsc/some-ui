# The LAN résumé render service: packages/ui/resume/scripts/serve.mjs, which
# compiles an ATS résumé with contact details (PII) supplied per request. One
# author's tool with no auth, not a pattern: packages/ui/resume/README.md,
# "Scope and limits".
#
# Reachable from the home network only, and only through the www container:
# no port is published, not even on 127.0.0.1. apps/www's nginx proxies the
# same-origin /api/resume/ path to it over some-ui-network
# (apps/www/nginx.https.conf, RESUME_UPSTREAM), and the only page that calls it is the
# LAN build's /resume-build.
#
# The image is published from main by .github/workflows/resume-docker-release.yml
# (`pgathondu/resume-render:<commit>` and `:latest`), so nothing is built here
# (RELEASE R8, paulgsc/server#853). Home runs it from paulgsc/server's compose,
# pinned by digest; this file is for development.
services:
  resume-render:
    image: pgathondu/resume-render:${RESUME_TAG:-latest}
    container_name: resume-render
    expose:
      - "3100"
    # Nothing in the container is writable, /tmp included: a render keeps the
    # PII and its PDF in memory and pipes (scripts/serve.mjs), so it has
    # nothing to write.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - some-ui-network
    restart: unless-stopped
    mem_limit: 1G
    cpus: 2.0
    pids_limit: 64
    # Bounded like every other container.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
