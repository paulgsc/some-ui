# openai-edge-tts: the speech backend apps/www talks to wherever one is
# reachable (vite dev, vite preview, the Docker image). It exposes an
# OpenAI-compatible /v1/audio/speech, which is why @some-ui/speech's HTTP
# adapter speaks to it with an OpenAI-shaped request and no vendor-specific
# code of its own.
#
# The browser reaches nginx below on ${PORT:-5050} of whatever host serves
# the page - apps/www derives exactly that by default (src/lib/tts-config),
# and VITE_TTS_ENDPOINT overrides it for deployments that front this service
# somewhere else. The GitHub Pages build has no backend at all and resolves
# to the browser's own speechSynthesis instead; nothing here applies to it.
services:
  openai-edge-tts:
    image: travisvn/openai-edge-tts:latest-ffmpeg
    container_name: openai-edge-tts
    # Remove external port mapping - only accessible through nginx
    expose:
      - "5050"
    env_file:
      - ${REPO_ROOT:-.}/.env
    environment:
      API_KEY: ${API_KEY}
      PORT: 5050
      REQUIRE_API_KEY: ${REQUIRE_API_KEY:-false}
      EXPAND_API: ${EXPAND_API:-true}
      REMOVE_FILTER: ${REMOVE_FILTER:-false}
      DEFAULT_VOICE: ${DEFAULT_VOICE:-en-US-DavisNeural}
      DEFAULT_RESPONSE_FORMAT: ${DEFAULT_RESPONSE_FORMAT:-wav}
      DEFAULT_SPEED: ${DEFAULT_SPEED:-1.0}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en-US}
    networks:
      - some-ui-network
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    container_name: openai-edge-tts-proxy
    ports:
      - "${PORT:-5050}:80" # Expose nginx on your desired port
    volumes:
      - ${REPO_ROOT:-.}/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - some-ui-network
    depends_on:
      - openai-edge-tts
    restart: unless-stopped
