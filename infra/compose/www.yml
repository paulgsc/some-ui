# Serves the built apps/www static bundle over HTTPS for LAN/mDNS use
# (e.g. https://nixos.local:8443), so getUserMedia (mic access, used by the
# interview app) sees a secure context. HTTP stays available on 8080 for
# plain local checks.
#
# That HTTPS listener is also why nginx.tts-proxy.conf is mounted below. The
# speech backend in infra/compose/tts.yml publishes plain HTTP on :5050 and
# terminates no TLS, so a page served from :443 here cannot fetch it
# directly - the browser blocks it as mixed content, and the topik applet
# goes silent with nothing to say why. The mounted snippet adds a
# same-origin /api/tts/ route that this container proxies to the TTS
# container over some-ui-network (service-to-service, so :5050 never has to
# be reachable from the browser at all), and apps/www's src/lib/tts-config
# defaults to it whenever the page is HTTPS. Plain-HTTP consumers - Storybook,
# cert-less `vite dev`, the :80 listener here - are untouched and keep
# talking to the published :5050 as before.
#
# The TTS containers are not a `depends_on` of this service, deliberately:
# `docker compose up www` on its own stays the documented way to serve just
# the app, and the proxy resolves its upstream per request (see the snippet),
# so a missing TTS stack costs speech and nothing else. Bring both up with
# `docker compose up www openai-edge-tts nginx` (or plain `docker compose up`)
# when you want the applet to speak.
#
# Requires local mkcert certs at ${REPO_ROOT}/certs (gitignored, machine-local)
# — the same ones apps/www/vite.config.ts already looks for:
#   mkcert -install
#   mkcert -cert-file certs/nixos.local+3.pem \
#          -key-file certs/nixos.local+3-key.pem \
#          nixos.local localhost 127.0.0.1 ::1
#
# Usage: docker compose up www   (from repo root, via root docker-compose.yml)
#
# honeycomb's sfx (packages/some-content/public/sfx) is volume-mounted rather
# than baked into the image - unlike the GitHub Pages build, the Docker image
# doesn't bundle it, so nginx serves whatever's mounted at
# WWW_SFX_ASSETS_PATH on the host. Point that env var wherever the deployer
# keeps the actual asset files; the default below just keeps
# `docker compose up www` working out of the box against this repo's own
# (mostly empty/gitignored) copy.
#
# packages/some-content/public/hangul and .../topiks are the same story with
# one difference: they're optional, not load-bearing. HangulHexGrid's own
# bundled demo pool (@some-ui/honeycomb's HANGUL_WORDS) works with nothing
# mounted here at all - that volume only matters if you've asked an LLM to
# generate a hangul/words/vocab.json (see apps/www/src/lib/hangul-vocab) and
# want this container to serve one instead of its demo pool. Unlike sfx, the
# GitHub Pages build never bakes any of these in either way: there's no
# companion data there, by design (apps/www resolves to "static" mode and
# never fetches them).
#
# LeetType used to be in this list, mounting a generated challenges.json and a
# tree of code samples. Both went in M20 (#887): exercises carry inline
# sources now, so the activity fetches nothing and there is nothing to mount.
# That also removes the only difference the Pages and Docker builds had for
# this activity - they now run the same code path.
#
# topiks differs from those two in one respect worth knowing before you mount
# nothing and wonder why the applet is empty: @some-ui/topik ships no bundled
# demo pool, so an unmounted topiks dir means an empty catalogue rather than a
# fallback one. That is the honest state - the study material is curated, not
# generated at build time - and apps/www renders it as "nothing to study"
# rather than as an error (see src/lib/topik-content).
#
# REPO_ROOT must actually be exported (e.g. `export REPO_ROOT=$(pwd)` from
# repo root) before running docker compose. The root docker-compose.yml
# includes this file via `include:`, and Compose resolves any relative
# `${VAR:-default}` fallback here against *this file's* directory
# (infra/compose/), not the repo root you ran the command from - an unset
# REPO_ROOT silently mounts infra/compose/packages/some-content/public/sfx
# (nonexistent, so Docker creates it empty) instead of the real one, and
# nginx's SPA fallback then serves index.html for every .mp3 request
# ("Content-Type text/html" in the browser, not a 404).
services:
  www:
    image: pgathondu/www:${TAG:-latest}
    container_name: some-ui-www
    ports:
      - "${WWW_HTTP_PORT:-5172}:80"
      - "${WWW_HTTPS_PORT:-5173}:443"
    volumes:
      - ${REPO_ROOT:-.}/apps/www/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${REPO_ROOT:-.}/apps/www/nginx.tts-proxy.conf:/etc/nginx/tts-proxy.conf:ro
      - ${REPO_ROOT:-.}/certs:/etc/nginx/certs:ro
      - ${WWW_SFX_ASSETS_PATH:-${REPO_ROOT:-.}/packages/some-content/public/sfx}:/usr/share/nginx/html/sfx:ro
      - ${WWW_HANGUL_ASSETS_PATH:-${REPO_ROOT:-.}/packages/some-content/public/hangul}:/usr/share/nginx/html/hangul:ro
      - ${WWW_TOPIK_ASSETS_PATH:-${REPO_ROOT:-.}/packages/some-content/public/topiks}:/usr/share/nginx/html/topiks:ro
    networks:
      - some-ui-network
    # Dockerfile bakes in the same wget-spider HEALTHCHECK as a baseline for
    # bare `docker run`; redeclared here so compose can tune it without a
    # rebuild (matches the pattern used by infra/compose/*.yml in server).
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
