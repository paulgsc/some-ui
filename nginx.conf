events {
    worker_connections 1024;
}

http {
    # No access log. Without this line nginx's compiled-in default writes every
    # request (client address, request line, referrer, user agent) to its
    # access log, and this proxy has no use for that record. error_log is
    # deliberately left on: nginx's error log still carries the client address
    # and request line when an upstream fails, and it cannot be made
    # address-free without dropping nginx's own errors.
    access_log off;

    upstream tts_backend {
        server openai-edge-tts:5050;
    }

    server {
        listen 80;
        server_name localhost;
        
        # Handle CORS preflight requests
        location / {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header 'Access-Control-Max-Age' 1728000 always;
                add_header 'Content-Type' 'text/plain; charset=utf-8' always;
                add_header 'Content-Length' 0 always;
                return 204;
            }
            
            # Add CORS headers to actual requests
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            
            # Proxy to the TTS service
            proxy_pass http://tts_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Important: Don't buffer audio responses
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
