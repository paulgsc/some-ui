<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
        <style>
@import url('https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css');
        </style>
    </head>
    <body class="bg-gray-50 p-4 min-w-[200px] max-w-[250px]">
        <div class="space-y-4">
            <div class="text-center">
                <h3 class="text-lg font-semibold text-gray-800 mb-2">Comment Hider</h3>
                <p class="text-xs text-gray-600 leading-relaxed">
                Hide comment lines from GitHub code view
                </p>
            </div>

            <button 
                   id="toggleBtn" 
                   class="w-full px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                   >
                   Toggle Comments
            </button>

                <div id="status" class="text-center">
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-gray-200 text-gray-700">
                        Click to toggle
                    </span>
                </div>

                <div class="text-xs text-gray-500 text-center space-y-1">
                    <p>Works on any GitHub code page</p>
                    <p class="text-gray-400">Hides lines starting with //, /* etc.</p>
                </div>
        </div>

        <script src="popup.js"></script>
    </body>
</html>
