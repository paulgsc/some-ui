<!doctype html>
<!-- A release promo's close (HYPER3): the mark, where to get it, two badges. -->
<html
  lang="en"
  data-composition-variables='[
    {"id":"cta","type":"string","label":"Where to get it (| splits lines)","default":"Get it on|Firefox Add-ons"},
    {"id":"badge1","type":"string","label":"Badge 1","default":"No sign-in"},
    {"id":"badge2","type":"string","label":"Badge 2","default":"Source is public"},
    {"id":"ground","type":"color","label":"Ground","default":"#111821"},
    {"id":"ink","type":"color","label":"Ink","default":"#f4efe6"},
    {"id":"accent","type":"color","label":"Accent","default":"#f5b75b"},
    {"id":"accentInk","type":"color","label":"Ink on accent","default":"#2a1a0c"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="lib/promo.css" />
    <style>
      #glow {
        top: 40px;
      }
      #mark {
        left: 410px;
        top: 420px;
        width: 260px;
        height: 260px;
      }
      #cta {
        position: absolute;
        left: 0;
        width: 1080px;
        top: 780px;
        padding: 0 48px;
        font-size: 150px;
      }
      #rule {
        position: absolute;
        left: 460px;
        top: 1130px;
        width: 160px;
        height: 10px;
        border-radius: 5px;
        background: var(--accent);
        transform-origin: 0 50%;
      }
      #badges {
        position: absolute;
        left: 0;
        width: 1080px;
        top: 1220px;
        padding: 0 48px;
        display: flex;
        gap: 20px;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1080"
      data-height="1920"
      data-fps="30"
      data-no-timeline
    >
      <div id="glow" class="glow"></div>
      <img id="mark" class="mark" src="brand/mark.svg" alt="" />
      <h2 id="cta" class="display"></h2>
      <div id="rule"></div>
      <div id="badges">
        <span class="chip"><i class="dot"></i><span id="badge1"></span></span>
        <span class="chip"><i class="dot"></i><span id="badge2"></span></span>
      </div>
    </div>
    <script src="lib/motion.js"></script>
    <script>
      const { length: L, track, lines, row, vars, $ } = window.motion
      $("badge1").textContent = vars.badge1
      $("badge2").textContent = vars.badge2
      track($("glow"), [
        [0.1, { opacity: 0, scale: 0.6 }],
        [1.3, {}],
      ])
      track($("mark"), [
        [0.2, { opacity: 0, scale: 0.55, rotate: 10 }, "back"],
        [1.1, {}, "inOut"],
        [L, { y: -12 }],
      ])
      lines($("cta"), vars.cta).forEach((line, i) =>
        track(line, [
          [0.6 + i * 0.1, { yPct: 110 }],
          [1.6 + i * 0.1, {}],
        ])
      )
      track($("rule"), [
        [1.0, { scaleX: 0 }],
        [1.8, {}],
      ])
      row($("badges"))
      document.querySelectorAll("#badges .chip").forEach((chip, i) =>
        track(chip, [
          [1.3 + i * 0.1, { opacity: 0, y: 24 }],
          [2.0 + i * 0.1, {}],
        ])
      )
    </script>
  </body>
</html>
