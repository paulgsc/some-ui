packages:
  - packages/ui/*
  - apps/*
  - docs/canon
  - extensions/**
  - "!extensions/**/dist/**"
  - packages/*
  - crates/*
overrides:
  "@types/react": ^19.0.4
  "@eslint/core": 0.17.0
  "@eslint/config-helpers": 0.4.2
  ws: ^8.21.1
  # fx-runner (via web-ext) pins shell-quote 1.7.3, which Dependabot cannot
  # bump; <= 1.8.3 is GHSA-affected (quote() leaves newlines in .op). One
  # repo-wide floor also dedupes concurrently's exact 1.8.4 pin.
  shell-quote: ^1.9.0
  # Transitive via ajv@8 (web-ext's addons-linter, api-extractor); Dependabot
  # cannot bump it without a direct dependency to move. < 3.1.7 is
  # advisory-affected.
  fast-uri: ^3.1.7
  # Transitive via @tailwindcss/oxide@4.1.12 (tar ^7.4.3); same Dependabot
  # gap as fast-uri. < 7.5.21 is advisory-affected.
  tar: ^7.5.21
  # Scoped to the 1.x line (minimatch@3); 2.x/5.x consumers are untouched.
  # Same Dependabot gap as fast-uri/tar. 1.x < 1.1.18 is advisory-affected.
  "brace-expansion@1": ^1.1.18
  # pnpm audit backlog Dependabot cannot bump (transitive-only). Each is
  # scoped to the affected major, and every dependent's declared range
  # already admits the patched version.
  "brace-expansion@2": ^2.1.4
  "js-yaml@3": ^3.15.2
  "js-yaml@4": ^4.3.2
  browserslist: ^4.28.7
  colord: ^2.9.4
  baseline-browser-mapping: ^2.11.0
minimumReleaseAgeExclude:
  - "@some-ui/leetype-wasm"
# Single source of truth for dependencies that more than one workspace needs
# to agree on. Reference them as `"lucide-react": "catalog:"` in a package
# manifest instead of a version range — there is then no per-package version
# left to drift.
#
# Both entries here were added after finding six copies of lucide-react
# (0.378, 0.474, 0.511, 0.522, 0.525, 0.562) and two majors of zod in the
# apps/www browser bundle. The cause is `^0.x` semantics: for a 0.x package
# caret pins the *minor*, so `^0.378.0` can never resolve to 0.562.0 and every
# distinct spec installs its own copy. Ten distinct lucide-react specs existed
# across seventeen declarations.
#
# Adding a dependency here is only worth it for something two workspaces
# genuinely share; a single-consumer dependency belongs in its own manifest.
# Both are pinned to a version already in use rather than the newest
# available: the point of this change was to collapse duplicates, not to
# upgrade. `^4.0.5` here would resolve zod to 4.4.3 and quietly fold a minor
# bump into a dedupe commit.
catalog:
  # Every icon identifier imported repo-wide (120 of them) was checked to
  # resolve in 0.562.0 before unifying on it. Caret on a 0.x version only
  # admits patches, so this stays on 0.562.x.
  lucide-react: ^0.562.0
  zod: 4.6.5
  # Radix is here for a second-order reason. These are proper semver ranges,
  # so caret alone would have been enough to converge them — but ten of the
  # eighteen were declared at different ranges (react-accordion had four:
  # ^1.1.2, ^1.2.1, ^1.2.7, ^1.2.11), and each top-level component pins its
  # own range on the shared internals (react-context, react-primitive,
  # react-slot, …). Two versions of one component therefore multiply into
  # twenty-odd duplicated internals in the browser bundle. `pnpm dedupe`
  # cannot merge those — the ranges genuinely do not overlap — so the fix has
  # to happen at the declarations. Each entry is the highest range that was
  # already declared somewhere, and every bump stays inside its major.
  "@radix-ui/react-accordion": ^1.2.11
  "@radix-ui/react-avatar": ^1.2.6
  "@radix-ui/react-collapsible": ^1.1.11
  "@radix-ui/react-compose-refs": ^1.1.1
  "@radix-ui/react-dialog": ^1.1.23
  "@radix-ui/react-dropdown-menu": ^2.1.24
  "@radix-ui/react-label": ^2.1.1
  "@radix-ui/react-popover": ^1.1.5
  "@radix-ui/react-progress": ^1.1.1
  "@radix-ui/react-scroll-area": ^1.2.3
  "@radix-ui/react-select": ^2.3.7
  "@radix-ui/react-separator": ^1.1.7
  "@radix-ui/react-slider": ^1.3.5
  "@radix-ui/react-slot": ^1.2.3
  "@radix-ui/react-switch": ^1.1.2
  "@radix-ui/react-tabs": 1.1.21
  "@radix-ui/react-tooltip": ^1.2.16
allowBuilds:
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  spawn-sync: true
  unrs-resolver: true

# Recorded explicitly only to work around pnpm/pnpm#12337, a regression in
# 11.5.3: the workspace state file stores a setting only when it was set
# explicitly, while CI coerces an unset `enableGlobalVirtualStore` to `false`.
# So an install and a run that disagree about CI-ness compare `undefined`
# against `false`, pnpm's pre-run check decides node_modules is out of sync,
# and it silently runs a full workspace install before the task's own command
# - once per task, with no line saying why. Naming the setting here is the
# fix upstream recommends: it forces the key into the state file, so both
# sides compare `false`. See #1461.
#
# It is NOT a statement that the global virtual store should be off. `false`
# is pnpm's own default for an unset value; this only makes that explicit.
# Drop the line once #12337 is fixed.
#
# Only a CI/non-CI mismatch trips it, so GitHub Actions (install and build
# both under CI) was never affected. What this fixes is the mixed case: a
# container image with node_modules baked in at a different CI-ness than the
# session that later builds, and anyone running a CI=1 build over a local
# install.
#
# Turbo makes it worse rather than causes it: it sets
# `pnpm_config_verify_deps_before_run` in every task's environment, and the
# resulting installs take no lock, so N parallel tasks start N installs that
# race each other over node_modules/.bin - that is pnpm/pnpm#14551, which
# names Turborepo directly and is the source of the `[WARN] Failed to create
# bin ... ENOENT` noise.
#
# If this ever needs disabling wholesale instead, the setting is
# `verifyDepsBeforeRun` and it must live HERE, not in .npmrc: when
# pnpm-workspace.yaml exists its settings overwrite the .npmrc-derived config
# wholesale and only the env var is re-applied afterwards, so the .npmrc form
# looks correct and does nothing.
enableGlobalVirtualStore: false
