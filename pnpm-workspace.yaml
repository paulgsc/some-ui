packages:
  - packages/ui/*
  - apps/*
  - docs/canon
  - extensions/**
  - "!extensions/**/dist/**"
  - packages/*
  - crates/*
overrides:
  "@types/react": ^19.0.4
  "@eslint/core": 0.17.0
  "@eslint/config-helpers": 0.4.2
  ws: ^8.21.1
minimumReleaseAgeExclude:
  - "@some-ui/leetype-wasm"
# Single source of truth for dependencies that more than one workspace needs
# to agree on. Reference them as `"lucide-react": "catalog:"` in a package
# manifest instead of a version range — there is then no per-package version
# left to drift.
#
# Both entries here were added after finding six copies of lucide-react
# (0.378, 0.474, 0.511, 0.522, 0.525, 0.562) and two majors of zod in the
# apps/www browser bundle. The cause is `^0.x` semantics: for a 0.x package
# caret pins the *minor*, so `^0.378.0` can never resolve to 0.562.0 and every
# distinct spec installs its own copy. Ten distinct lucide-react specs existed
# across seventeen declarations.
#
# Adding a dependency here is only worth it for something two workspaces
# genuinely share; a single-consumer dependency belongs in its own manifest.
# Both are pinned to a version already in use rather than the newest
# available: the point of this change was to collapse duplicates, not to
# upgrade. `^4.0.5` here would resolve zod to 4.4.3 and quietly fold a minor
# bump into a dedupe commit.
catalog:
  # Every icon identifier imported repo-wide (120 of them) was checked to
  # resolve in 0.562.0 before unifying on it. Caret on a 0.x version only
  # admits patches, so this stays on 0.562.x.
  lucide-react: ^0.562.0
  zod: 4.0.5
  # Radix is here for a second-order reason. These are proper semver ranges,
  # so caret alone would have been enough to converge them — but ten of the
  # eighteen were declared at different ranges (react-accordion had four:
  # ^1.1.2, ^1.2.1, ^1.2.7, ^1.2.11), and each top-level component pins its
  # own range on the shared internals (react-context, react-primitive,
  # react-slot, …). Two versions of one component therefore multiply into
  # twenty-odd duplicated internals in the browser bundle. `pnpm dedupe`
  # cannot merge those — the ranges genuinely do not overlap — so the fix has
  # to happen at the declarations. Each entry is the highest range that was
  # already declared somewhere, and every bump stays inside its major.
  "@radix-ui/react-accordion": ^1.2.11
  "@radix-ui/react-aspect-ratio": ^1.1.7
  "@radix-ui/react-avatar": ^1.2.6
  "@radix-ui/react-collapsible": ^1.1.11
  "@radix-ui/react-compose-refs": ^1.1.1
  "@radix-ui/react-dialog": ^1.1.14
  "@radix-ui/react-dropdown-menu": ^2.1.15
  "@radix-ui/react-label": ^2.1.1
  "@radix-ui/react-popover": ^1.1.5
  "@radix-ui/react-progress": ^1.1.1
  "@radix-ui/react-scroll-area": ^1.2.3
  "@radix-ui/react-select": ^2.3.7
  "@radix-ui/react-separator": ^1.1.7
  "@radix-ui/react-slider": ^1.3.5
  "@radix-ui/react-slot": ^1.2.3
  "@radix-ui/react-switch": ^1.1.2
  "@radix-ui/react-tabs": 1.1.21
  "@radix-ui/react-tooltip": ^1.2.7
allowBuilds:
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  spawn-sync: true
  unrs-resolver: true

# Turbo sets `pnpm_config_verify_deps_before_run` in every task's environment
# (the literal is in its native binary, beside PNPM_HOME and
# NPM_CONFIG_STORE_DIR), which turns on pnpm's pre-run dependency check. That
# check is unconditionally broken here, so leave it off — see #1461.
#
# `checkDepsStatus` compares each setting recorded in
# node_modules/.pnpm-workspace-state-v1.json against the freshly resolved
# config. `enableGlobalVirtualStore` is stored as JSON `null` and resolves to
# `undefined`, and `equals(null, undefined)` is false — so the comparison
# trips on every single check, for a setting nothing in this repo sets. pnpm
# then silently runs a full workspace install before the task's own command,
# once per task. Running one build in `warn` mode says it out loud:
#
#   [WARN] Your node_modules are out of sync with your lockfile.
#          The value of the enableGlobalVirtualStore setting has changed
#
# `warn` is not the conservative middle ground it looks like: all 37 tasks of
# a full build emit that same line, none of them because anything is actually
# stale. A warning that fires unconditionally teaches people to skip it, so
# it is worse than silence for the day the check has something real to say.
#
# This has to live HERE, not in .npmrc. When pnpm-workspace.yaml exists its
# settings overwrite the .npmrc-derived config wholesale, and only the env
# var is re-applied afterwards — so `verify-deps-before-run=false` in .npmrc
# looks correct, does nothing, and reads like evidence that the setting is
# irrelevant. It is not.
#
# What this gives up: pnpm no longer auto-heals a stale node_modules before
# running a task. CI installs with --frozen-lockfile before it builds, and
# changing a dependency locally means running `pnpm install`, so the cost is
# a clearer error instead of a silent fixup. Drop this line once pnpm stops
# serialising an unset setting as `null` and comparing it to `undefined`.
verifyDepsBeforeRun: false
